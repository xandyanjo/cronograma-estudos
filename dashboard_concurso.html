    // --- Utilitários de Persistência Segura com window.storage ---
    if (typeof window !== 'undefined' && !window.__inMemoryStorage) {
      window.__inMemoryStorage = {};
    }

    const storageGet = async (key) => {
      try {
        if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
          return await window.storage.get(key, { shared: false });
        } else if (typeof window !== 'undefined' && window.storage && typeof window.storage.getItem === 'function') {
          return await window.storage.getItem(key);
        }
        return window.__inMemoryStorage[key] || null;
      } catch (e) {
        console.error(`Erro ao ler chave ${key}:`, e);
        return window.__inMemoryStorage[key] || null;
      }
    };

    const storageSet = async (key, value) => {
      try {
        if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
          await window.storage.set(key, value, { shared: false });
        } else if (typeof window !== 'undefined' && window.storage && typeof window.storage.setItem === 'function') {
          await window.storage.setItem(key, value);
        } else {
          window.__inMemoryStorage[key] = value;
        }
      } catch (e) {
        console.error(`Erro ao salvar chave ${key}:`, e);
        window.__inMemoryStorage[key] = value;
        throw e;
      }
    };

    const storageDelete = async (key) => {
      try {
        if (typeof window !== 'undefined' && window.storage && typeof window.storage.delete === 'function') {
          await window.storage.delete(key, { shared: false });
        } else if (typeof window !== 'undefined' && window.storage && typeof window.storage.removeItem === 'function') {
          await window.storage.removeItem(key);
        } else {
          delete window.__inMemoryStorage[key];
        }
      } catch (e) {
        console.error(`Erro ao deletar chave ${key}:`, e);
        delete window.__inMemoryStorage[key];
      }
    };

    // --- Utilitário de formatação de porcentagem com até 2 casas decimais, sem zeros à direita ---
    const getPercent = (completed, total) => {
      if (!total || total <= 0) return 0;
      return Math.round((completed / total) * 10000) / 100;
    };

    // --- Componente Principal da Aplicação ---
    function App() {
      const [loading, setLoading] = useState(true);
      const [storageError, setStorageError] = useState(false);
      const [studyStructure, setStudyStructure] = useState(DEFAULT_STUDY_STRUCTURE);
      const [completedKeys, setCompletedKeys] = useState({});
      const [toastMsg, setToastMsg] = useState(null);
      const [driveLetter, setDriveLetter] = useState("E");

      // Controle de Navegação (Drill-Down)
      const [navigation, setNavigation] = useState({
        view: 'home',
        subjectName: null,
        courseId: null,
        periodName: null
      });

      // Estados para Formulários de Adição
      const [newCourseName, setNewCourseName] = useState("");
      const [newCourseSubject, setNewCourseSubject] = useState("Conhecimento Militar Naval");
      const [newPeriodName, setNewPeriodName] = useState("");
      const [newVideoText, setNewVideoText] = useState("");
      const [newManualItem, setNewManualItem] = useState("");

      // --- Inicialização dos Dados ---
      useEffect(() => {
        const loadInitialData = async () => {
          setLoading(true);
          try {
            // 0. Carregar a letra do disco configurada
            const savedDrive = await storageGet("progresso:letra_disco");
            if (savedDrive) {
              setDriveLetter(savedDrive);
            }

            // 1. Carregar a estrutura de dados (cursos e vídeos cadastrados)
            const savedStructure = await storageGet("progresso:estrutura_dados");
            let currentStructure = DEFAULT_STUDY_STRUCTURE;
            if (savedStructure) {
              try {
                const parsed = typeof savedStructure === 'string' ? JSON.parse(savedStructure) : savedStructure;
                if (parsed && (parsed.courses || parsed.manual)) {
                  currentStructure = parsed;
                  setStudyStructure(parsed);
                }
              } catch (e) {
                console.error("Falha ao parsear estrutura salva, usando padrão.", e);
              }
            }

            // 2. Carregar o progresso de itens marcados como concluídos
            const progressMap = {};
            let listedKeys = false;
            
            if (window.storage && typeof window.storage.list === 'function') {
              try {
                const keys = await window.storage.list("progresso:", { shared: false });
                if (keys && Array.isArray(keys)) {
                  keys.forEach(k => {
                    const keyStr = typeof k === 'string' ? k : k.key;
                    if (keyStr) {
                      const relativeKey = keyStr.replace("progresso:", "");
                      progressMap[relativeKey] = true;
                    }
                  });
                  listedKeys = true;
                }
              } catch (e) {
                console.warn("list() falhou ou indisponível, caindo em loop paralelo", e);
              }
            }

            if (!listedKeys) {
              const keysToQuery = [];
              currentStructure.courses.forEach(c => {
                c.periods.forEach(p => {
                  p.videos.forEach(v => {
                    keysToQuery.push(`${c.name}/${p.name}/${v}`);
                  });
                });
              });
              currentStructure.manual.forEach(m => {
                m.items.forEach(i => {
                  keysToQuery.push(`manual/${m.id}/${i}`);
                });
              });

              await Promise.all(keysToQuery.map(async (relativeKey) => {
                const status = await storageGet(`progresso:${relativeKey}`);
                if (status === true || status === 'true') {
                  progressMap[relativeKey] = true;
                }
              }));
            }

            setCompletedKeys(progressMap);
          } catch (err) {
            console.error("Erro no carregamento:", err);
            setStorageError(true);
          } finally {
            setLoading(false);
          }
        };

        loadInitialData();
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const saveStructure = async (newStructure) => {
        setStudyStructure(newStructure);
        try {
          await storageSet("progresso:estrutura_dados", JSON.stringify(newStructure));
        } catch (e) {
          showToast("⚠️ Erro ao salvar estrutura de dados!");
        }
      };

      const handleDriveChange = async (newDrive) => {
        const cleanDrive = newDrive.replace(/[^a-zA-Z]/g, '').toUpperCase();
        setDriveLetter(cleanDrive);
        if (cleanDrive) {
          try {
            await storageSet("progresso:letra_disco", cleanDrive);
          } catch (e) {
            console.error("Erro ao salvar letra de disco:", e);
          }
        }
      };

      // --- Lógica de Progresso ---
      const stats = useMemo(() => {
        let totalVideos = 0;
        let completedVideos = 0;
        let totalManual = 0;
        let completedManual = 0;
        const subjectStats = {};

        Object.keys(SUBJECT_METADATA).forEach(subject => {
          subjectStats[subject] = { total: 0, completed: 0 };
        });

        studyStructure.courses.forEach(c => {
          const subject = c.subject || "Conhecimento Militar Naval";
          if (!subjectStats[subject]) {
            subjectStats[subject] = { total: 0, completed: 0 };
          }
          c.periods.forEach(p => {
            p.videos.forEach(v => {
              const key = `${c.name}/${p.name}/${v}`;
              totalVideos++;
              subjectStats[subject].total++;
              if (completedKeys[key]) {
                completedVideos++;
                subjectStats[subject].completed++;
              }
            });
          });
        });

        studyStructure.manual.forEach(m => {
          const subject = m.subject;
          if (!subjectStats[subject]) {
            subjectStats[subject] = { total: 0, completed: 0 };
          }
          m.items.forEach(i => {
            const key = `manual/${m.id}/${i}`;
            totalManual++;
            subjectStats[subject].total++;
            if (completedKeys[key]) {
              completedManual++;
              subjectStats[subject].completed++;
            }
          });
        });

        const totalAll = totalVideos + totalManual;
        const completedAll = completedVideos + completedManual;
        const percentAll = getPercent(completedAll, totalAll);

        return {
          totalVideos,
          completedVideos,
          totalManual,
          completedManual,
          totalAll,
          completedAll,
          percentAll,
          subjectStats
        };
      }, [studyStructure, completedKeys]);

      const toggleVideoComplete = async (courseName, periodName, videoName) => {
        const key = `${courseName}/${periodName}/${videoName}`;
        const currentVal = completedKeys[key];
        const newVal = !currentVal;

        setCompletedKeys(prev => ({ ...prev, [key]: newVal }));

        try {
          const storageKey = `progresso:${key}`;
          if (newVal) {
            await storageSet(storageKey, true);
          } else {
            await storageDelete(storageKey);
          }
        } catch (err) {
          setCompletedKeys(prev => ({ ...prev, [key]: currentVal }));
          showToast("❌ Falha ao salvar no storage");
        }
      };

      const toggleManualComplete = async (manualId, itemName) => {
        const key = `manual/${manualId}/${itemName}`;
        const currentVal = completedKeys[key];
        const newVal = !currentVal;

        setCompletedKeys(prev => ({ ...prev, [key]: newVal }));

        try {
          const storageKey = `progresso:${key}`;
          if (newVal) {
            await storageSet(storageKey, true);
          } else {
            await storageDelete(storageKey);
          }
        } catch (err) {
          setCompletedKeys(prev => ({ ...prev, [key]: currentVal }));
          showToast("❌ Falha ao salvar no storage");
        }
      };

      // --- Operações de Estrutura ---
      const handleAddCourse = (e) => {
        e.preventDefault();
        if (!newCourseName.trim()) return;

        const newCourse = {
          id: `course-${Date.now()}`,
          name: newCourseName.trim(),
          subject: newCourseSubject,
          periods: []
        };

        const updated = {
          ...studyStructure,
          courses: [...studyStructure.courses, newCourse]
        };

        saveStructure(updated);
        setNewCourseName("");
        showToast(`Curso "${newCourse.name}" adicionado!`);
      };

      const handleAddPeriod = (e, courseId) => {
        e.preventDefault();
        if (!newPeriodName.trim()) return;

        const updatedCourses = studyStructure.courses.map(c => {
          if (c.id === courseId) {
            if (c.periods.some(p => p.name.toUpperCase() === newPeriodName.trim().toUpperCase())) {
              showToast("Este período já existe!");
              return c;
            }
            return {
              ...c,
              periods: [...c.periods, { name: newPeriodName.trim(), videos: [] }]
            };
          }
          return c;
        });

        saveStructure({ ...studyStructure, courses: updatedCourses });
        setNewPeriodName("");
        showToast(`Período "${newPeriodName}" adicionado!`);
      };

      const handleAddVideos = (e, courseId, periodName) => {
        e.preventDefault();
        if (!newVideoText.trim()) return;

        const videosToAdd = newVideoText
          .split("\n")
          .map(v => v.trim())
          .filter(v => v.length > 0);

        if (videosToAdd.length === 0) return;

        const updatedCourses = studyStructure.courses.map(c => {
          if (c.id === courseId) {
            const updatedPeriods = c.periods.map(p => {
              if (p.name === periodName) {
                const uniqueNewVideos = videosToAdd.filter(v => !p.videos.includes(v));
                return {
                  ...p,
                  videos: [...p.videos, ...uniqueNewVideos]
                };
              }
              return p;
            });
            return { ...c, periods: updatedPeriods };
          }
          return c;
        });

        saveStructure({ ...studyStructure, courses: updatedCourses });
        setNewVideoText("");
        showToast(`${videosToAdd.length} vídeo(s) adicionado(s)!`);
      };

      const handleAddManualItem = (e, manualId) => {
        e.preventDefault();
        if (!newManualItem.trim()) return;

        const updatedManual = studyStructure.manual.map(m => {
          if (m.id === manualId) {
            if (m.items.includes(newManualItem.trim())) {
              showToast("Este item já existe!");
              return m;
            }
            return {
              ...m,
              items: [...m.items, newManualItem.trim()]
            };
          }
          return m;
        });

        saveStructure({ ...studyStructure, manual: updatedManual });
        setNewManualItem("");
        showToast("Item adicionado com sucesso!");

      const handleDeleteCourse = (courseId, courseName) => {
        if (!confirm(`Deseja realmente remover o curso "${courseName}"?`)) return;

              </div>

              <div class="glass-panel p-6 rounded-2xl border border-slate-800/80 space-y-4">
                <div class="flex items-start gap-2">
                  <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg">
                    <Icons.Info />
                  </div>
                  <div>
                    <h4 class="text-sm font-bold text-slate-200">Adicionar Videoaulas</h4>
                    <p class="text-xs text-slate-500 mt-0.5">Cole os nomes de arquivos das aulas abaixo (um por linha para lote).</p>
                  </div>
                </div>

                <form onSubmit={(e) => handleAddVideos(e, currentCourse.id, currentPeriod.name)} class="space-y-3.5">
                  <div>
                    <textarea
                      required
                      placeholder="Exemplo:&#10;Aula 03 - RDM - Regimento Geral&#10;Aula 04 - Exercícios Adsumus"
                      value={newVideoText}
                      onChange={(e) => setNewVideoText(e.target.value)}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 focus:outline-none focus:border-indigo-500 transition-colors font-mono resize-none leading-relaxed"
                    />
                  </div>
                  <button
                    type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 rounded-xl transition-all duration-200 active:scale-[0.98] shadow-lg shadow-indigo-600/10"
                  >
                    Adicionar Videoaula(s)
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      };

      const renderManual = () => {
        if (!currentManual) return null;
        const meta = SUBJECT_METADATA[navigation.subjectName] || SUBJECT_METADATA["Exercícios"];
        const SubjectIcon = meta.icon;
        const total = currentManual.items.length;
        let completed = 0;
        currentManual.items.forEach(i => {
          if (completedKeys[`manual/${currentManual.id}/${i}`]) completed++;
        });
        const percent = getPercent(completed, total);

        return (
          <div class="fade-in space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <button 
                onClick={handleBack} 
                class="flex items-center gap-2 text-slate-400 hover:text-white text-sm bg-slate-900 border border-slate-800/80 px-4 py-2 rounded-xl transition-all self-start"
              >
                <Icons.ChevronLeft /> Voltar para Início
              </button>
              
              <div class="text-xs text-slate-500 font-bold uppercase tracking-wider flex items-center gap-2">
                Categorias Manuais <Icons.ChevronRight /> <span class={meta.text}>{navigation.subjectName}</span>
              </div>
            </div>

            <div class="glass-panel p-6 rounded-2xl border border-slate-800/80 flex flex-col md:flex-row items-center gap-6 justify-between">
              <div class="flex items-center gap-4">
                <div class={`p-4 rounded-2xl ${meta.bg} ${meta.text}`}>
                  <SubjectIcon />
                </div>
                <div>
                  <h1 class="text-2xl font-bold font-outfit text-white">{navigation.subjectName}</h1>
                  <p class="text-sm text-slate-400 mt-0.5">Progresso de itens de controle manual (sem pasta vinculada).</p>
                </div>
              </div>
              
              <div class="w-full md:w-80">
                <div class="flex justify-between items-center text-sm mb-2">
                  <span class="text-slate-400 font-bold">{completed} de {total} concluintes</span>
                  <span class={`font-black ${meta.text}`}>{percent}%</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-3 p-[1px] border border-slate-800">
                  <div 
                    class={`h-full rounded-full bg-gradient-to-r ${meta.color} transition-all duration-500`}
                    style={{ width: `${percent}%` }}
                  ></div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              <div class="lg:col-span-2 space-y-3">
                <h3 class="text-lg font-bold font-outfit text-slate-300 flex items-center gap-2">
                  <Icons.FileText /> Lista de Cadastro
                </h3>

                {currentManual.items.length === 0 ? (
                  <div class="glass-panel p-10 rounded-2xl border border-slate-800 text-center text-slate-500">
                    Nenhum item cadastrado nesta categoria de acompanhamento.
                  </div>
                ) : (
                  <div class="space-y-2.5">
                    {currentManual.items.map((item, idx) => {
                      const relativeKey = `manual/${currentManual.id}/${item}`;
                      const isCompleted = !!completedKeys[relativeKey];

                      return (
                        <div 
                          key={idx}
                          class={`glass-panel p-4.5 rounded-xl border transition-all duration-200 flex items-center justify-between gap-4 ${
                            isCompleted ? "border-green-500/20 bg-green-500/[0.02]" : "border-slate-800/80 hover:border-slate-700"
                          }`}
                        >
                          <div class="flex items-center gap-3.5">
                            <button
                              onClick={() => toggleManualComplete(currentManual.id, item)}
                              class={`w-6 h-6 rounded-lg border flex items-center justify-center transition-all ${
                                isCompleted 
                                  ? "bg-green-500 border-green-400 text-[#070a13]" 
                                  : "border-slate-600 hover:border-slate-400 bg-slate-900"
                              }`}
                            >
                              {isCompleted && (
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
                              )}
                            </button>

                            <span class={`text-sm font-semibold ${isCompleted ? "text-slate-400 line-through" : "text-slate-200"}`}>
                              {item}
                            </span>
                          </div>

                          <button
                            onClick={() => handleDeleteManualItem(currentManual.id, item)}
                            class="text-red-500/60 hover:text-red-400 p-2 hover:bg-red-500/10 rounded-lg transition-all"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              <div class="glass-panel p-6 rounded-2xl border border-slate-800/80 space-y-4">
                <h4 class="text-md font-bold font-outfit text-slate-200 flex items-center gap-1.5">
                  <Icons.Plus /> Adicionar Novo Item
                </h4>
                <form onSubmit={(e) => handleAddManualItem(e, currentManual.id)} class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Título / Descrição</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Simulado Geral - Adsumus 03"
                      value={newManualItem}
                      onChange={(e) => setNewManualItem(e.target.value)}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors"
                    />
                  </div>
                  <button
                    type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 rounded-xl transition-all duration-200 active:scale-[0.98] shadow-lg shadow-indigo-600/10"
                  >
                    Cadastrar Item
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div class="max-w-7xl mx-auto space-y-8 pb-12">
          
          <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-slate-800/80">
            <div>
              <div class="flex items-center gap-2">
                <span class="bg-blue-500/10 border border-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">
                  Concurso Militar Naval
                </span>
                {storageError && (
                  <span class="bg-amber-500/10 border border-amber-500/20 text-amber-400 px-3 py-1 rounded-full text-xs font-bold tracking-wider">
                    Modo Local Alternativo
                  </span>
                )}
              </div>
              <h1 class="text-3xl font-extrabold font-outfit mt-2 bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                ⚓ Cronograma de Estudos
              </h1>
              <div class="flex items-center gap-3 mt-1.5 flex-wrap">
                <p class="text-slate-400 text-sm">Acompanhamento e controle de progresso das aulas e conteúdos.</p>
                
                <div class="flex items-center gap-1.5 bg-slate-900/80 px-2.5 py-1 rounded-lg border border-slate-800/80 text-xs">
                  <span class="text-slate-400 font-bold">Unidade de Disco:</span>
                  <input
                    type="text"
                    maxLength="1"
                    value={driveLetter}
                    onChange={(e) => handleDriveChange(e.target.value)}
                    class="w-7 bg-slate-950 border border-slate-800 rounded px-1.5 py-0.5 text-center font-bold text-indigo-400 focus:outline-none focus:border-indigo-500 uppercase"
                    title="Letra da unidade de disco (ex: E, D, C) onde os vídeos estão salvos"
                  />
                  <span class="text-slate-500 font-semibold">:\Video aulas\AA</span>
                </div>

                <button 
                  onClick={async () => {
                    if (confirm("Deseja redefinir a estrutura para o padrão dos arquivos locais? (Isso atualizará a lista de pastas e arquivos ocultando metadados, sem apagar suas marcações de concluído)")) {
                      await storageDelete("progresso:estrutura_dados");
                      window.location.reload();
                    }
                  }}
                  class="text-xs bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800/80 px-2.5 py-1 rounded-lg transition-all"
                >
                  🔄 Recarregar Estrutura Local
                </button>
              </div>
            </div>
            
            <div class="glass-panel px-6 py-4 rounded-2xl border border-slate-800 flex items-center gap-6 shadow-xl">
              <div class="space-y-1">
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">Progresso Geral</div>
                <div class="flex items-baseline gap-1.5">
                  <span class="text-3xl font-black font-outfit text-slate-100">{stats.percentAll}%</span>
                  <span class="text-xs text-slate-400 font-medium">({stats.completedAll}/{stats.totalAll} Concluídos)</span>
                </div>
              </div>
              <div class="w-24 md:w-32 bg-slate-950 rounded-full h-3 p-[1px] border border-slate-800">
                <div 
                  class="h-full rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 shadow-[0_0_8px_rgba(99,102,241,0.5)] transition-all duration-500"
                  style={{ width: `${stats.percentAll}%` }}
                ></div>
              </div>
            </div>
          </header>

          {loading ? (
            <div class="flex flex-col items-center justify-center py-24 space-y-4">
              <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
              <p class="text-sm font-semibold text-slate-400">Carregando painel de progresso...</p>
            </div>
          ) : (
            <div>
              {navigation.view === 'home' && renderHome()}
              {navigation.view === 'subject' && renderSubject()}
              {navigation.view === 'course' && renderCourse()}
              {navigation.view === 'period' && renderPeriod()}
              {navigation.view === 'manual' && renderManual()}
            </div>
          )}

          {toastMsg && (
            <div class="fixed bottom-6 right-6 bg-slate-900 border border-slate-700/80 text-slate-200 px-4.5 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-2.5 text-sm animate-bounce">
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
