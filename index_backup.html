// ─── AUDIO GENERATOR (WEB AUDIO API) ─────────────────────────
function createWhiteNoise(ctx) {
  const bufferSize = 2 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  return source;
}

function createPinkNoise(ctx) {
  const bufferSize = 4 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
    data[i] *= 0.11;
    b6 = white * 0.115926;
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  return source;
}

function createRain(ctx) {
  const pink = createPinkNoise(ctx);
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1000;
  filter.Q.value = 1.0;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 150;
  
  pink.connect(filter);
  filter.connect(hp);
  
  return {
    source: pink,
    connect: (dest) => hp.connect(dest),
    disconnect: () => {
      try {
        pink.disconnect();
        filter.disconnect();
        hp.disconnect();
      } catch(e){}
    },
    start: () => pink.start(0),
    stop: () => { try { pink.stop(); } catch(e) {} }
  };
}

function createBinauralBeats(ctx) {
  const oscL = ctx.createOscillator();
  const oscR = ctx.createOscillator();
  oscL.frequency.value = 100;
  oscR.frequency.value = 105;
  oscL.type = 'sine';
  oscR.type = 'sine';
  const pannerL = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const pannerR = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const gain = ctx.createGain();
  gain.gain.value = 0.5;
  if (pannerL && pannerR) {
    pannerL.pan.value = -1;
    pannerR.pan.value = 1;
    oscL.connect(pannerL);
    pannerL.connect(gain);
    oscR.connect(pannerR);
    pannerR.connect(gain);
  } else {
    oscL.connect(gain);
    oscR.connect(gain);
  }
  return {
    connect: (dest) => gain.connect(dest),
    disconnect: () => {
      try {
        oscL.disconnect();
        oscR.disconnect();
        if (pannerL) pannerL.disconnect();
        if (pannerR) pannerR.disconnect();
        gain.disconnect();
      } catch(e){}
    },
    start: () => { oscL.start(0); oscR.start(0); },
    stop: () => { try { oscL.stop(); oscR.stop(); } catch(e) {} }
  };
}

const FocusSounds = {
  ctx: null,
  gain: null,
  activeNode: null,
  currentType: null,
  volume: 0.3,
  listeners: new Set(),

  subscribe(listener) {
    this.listeners.add(listener);
    return () => this.listeners.delete(listener);
  },

  notify() {
    this.listeners.forEach(l => l({
      currentType: this.currentType,
      volume: this.volume,
      isPlaying: !!this.currentType
    }));
  },

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = this.volume;
    this.gain.connect(this.ctx.destination);
  },

  play(type) {
    try {
      this.init();
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.stop();

      let node;
      if (type === 'pink') {
        node = createPinkNoise(this.ctx);
        node.connect(this.gain);
        node.start(0);
        this.activeNode = node;
      } else if (type === 'white') {
        node = createWhiteNoise(this.ctx);
        node.connect(this.gain);
        node.start(0);
        this.activeNode = node;
      } else if (type === 'rain') {
        node = createRain(this.ctx);
        node.connect(this.gain);
        node.start();
        this.activeNode = node;
      } else if (type === 'binaural') {
        node = createBinauralBeats(this.ctx);
        node.connect(this.gain);
        node.start();
        this.activeNode = node;
      }
      this.currentType = type;
      this.notify();
    } catch (e) {
      console.error("Erro de áudio:", e);
    }
  },

  stop() {
    if (this.activeNode) {
      try {
        this.activeNode.stop();
        this.activeNode.disconnect();
      } catch (e) {}
      this.activeNode = null;
    }
    this.currentType = null;
    this.notify();
  },

  setVolume(vol) {
    this.volume = vol;
    if (this.gain) {
      this.gain.gain.value = vol;
    }
    this.notify();
  }
};

function useFocusSounds() {
  const [state, setState] = useState({
    currentType: FocusSounds.currentType,
    volume: FocusSounds.volume,
    isPlaying: !!FocusSounds.currentType
  });
  useEffect(() => {
    return FocusSounds.subscribe(setState);
  }, []);
  return {
    ...state,
    play: (type) => FocusSounds.play(type),
    stop: () => FocusSounds.stop(),
    setVolume: (v) => FocusSounds.setVolume(v)
  };
}

  if(!di)return 1;
  const diff=Date.now()-new Date(di+'T12:00:00').getTime();
  return Math.min(28,Math.max(1,Math.floor(diff/(7*86400000))+1));

const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return[h,m,sc].map(n=>String(n).padStart(2,'0')).join(':');};
const fmtMM=s=>fmt(s).slice(3);

// ─── useLS HOOK ───────────────────────────────────────────────
function useLS(key,init,v=null){
  const[val,setVal]=useState(()=>{
    try{const r=localStorage.getItem(key);if(r===null)return init;const p=JSON.parse(r);if(v&&!v(p))return init;return p;}catch{return init;}
  });
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(val));}catch{}},[key,val]);
  return[val,setVal];
}

// ─── useCRON HOOK ─────────────────────────────────────────────
function useCron(saved,onSave,onReg){
  const[tempos,setTempos]=useState(saved);
  const[ativo,setAtivo]=useState(null);
  const[segs,setSegs]=useState(0);
  const[dIni,setDIni]=useState(null);
  // Sincroniza tempos internos quando o Firebase atualizar tSaved externamente (deep compare)
  const prevSaved=useRef(saved);
  const fromFirebaseRef=useRef(false); // flag: mudança veio do Firebase (não dispara onSave)
  const mountedRef=useRef(false);      // flag: evita onSave no mount inicial
  useEffect(()=>{
    if(JSON.stringify(saved)!==JSON.stringify(prevSaved.current)){
      prevSaved.current=saved;
      fromFirebaseRef.current=true; // marca que a mudança veio do Firebase
      setTempos(prev=>{
        const merged={...saved};
        return merged;
      });
    }
  },[saved]);
  useEffect(()=>{
    if(!mountedRef.current){mountedRef.current=true;return;} // pula mount inicial
    if(fromFirebaseRef.current){fromFirebaseRef.current=false;return;} // pula se veio do Firebase
    onSave(tempos); // só salva quando o usuário realmente alterou (parou/resetou timer)
  },[tempos]);
  useEffect(()=>{if(!ativo)return;const t=setInterval(()=>setSegs(p=>p+1),1000);return()=>clearInterval(t);},[ativo]);
  const iniciar=useCallback((sem,mid)=>{
    const k=`${sem}-${mid}`;
    if(ativo===k){
      const add=Math.max(0,segs-(tempos[k]||0));
      setTempos(p=>({...p,[k]:segs}));onReg(add,dIni||hoje());
      setAtivo(null);setSegs(0);setDIni(null);
    }else{
      if(ativo){const add=Math.max(0,segs-(tempos[ativo]||0));setTempos(p=>({...p,[ativo]:segs}));onReg(add,dIni||hoje());}
      setSegs(tempos[k]||0);setAtivo(k);setDIni(hoje());
    }
  },[ativo,segs,tempos,dIni,onReg]);
  const resetar=useCallback((sem,mid,e)=>{
    e?.stopPropagation();const k=`${sem}-${mid}`;
    setTempos(p=>{const n={...p};delete n[k];return n;}); // remove tempo salvo
    if(ativo===k){setAtivo(null);setSegs(0);setDIni(null);}
  },[ativo]);
  const getTempo=useCallback((sem,mid)=>{const k=`${sem}-${mid}`;return ativo===k?segs:(tempos[k]||0);},[ativo,segs,tempos]);
  const getTotal=useCallback((mid)=>{
    let t=0;Object.entries(tempos).forEach(([k,v])=>{if(k.split('-').slice(1).join('-')===mid)t+=v;});
    if(ativo&&ativo.split('-').slice(1).join('-')===mid)t+=segs-(tempos[ativo]||0);
    return t;
  },[tempos,ativo,segs]);
  return{tempos,ativo,segs,iniciar,resetar,getTempo,getTotal};
}

// ─── usePOMO HOOK ─────────────────────────────────────────────
function usePomo(rodIni,onSave){
  const[at,setAt]=useState(false);const[seg,setSeg]=useState(25*60);
  const[tipo,setTipo]=useState('estudo');const[rod,setRod]=useState(rodIni);
  const tRef=useRef(tipo);useEffect(()=>{tRef.current=tipo;},[tipo]);
  useEffect(()=>{onSave(rod);},[rod]);
  useEffect(()=>{
    if(!at)return;
    const som=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)();[[880,0],[1100,.15],[880,.3]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.3;o.start(c.currentTime+d);o.stop(c.currentTime+d+.15);});}catch{}};
    const t=setInterval(()=>setSeg(p=>{if(p<=1){som();if(tRef.current==='estudo'){setRod(r=>r+1);setTipo('pausa');setAt(false);return 5*60;}else{setTipo('estudo');setAt(false);return 25*60;}}return p-1;}),1000);
    return()=>clearInterval(t);
  },[at]);
  return{at,seg,tipo,rod,iniciar:()=>setAt(true),pausar:()=>setAt(false),resetar:()=>{setAt(false);setTipo('estudo');setSeg(25*60);}};
}

// ─── HEATMAP ──────────────────────────────────────────────────
function Heatmap({reg}){
  const base=useMemo(()=>{const d=new Date();d.setHours(12,0,0,0);return d;},[]);
  const dias=useMemo(()=>{const r=[];for(let i=HEATMAP_DIAS-1;i>=0;i--){const d=new Date(base);d.setDate(d.getDate()-i);const ch=d.toISOString().split('T')[0];const s=reg[ch]||0;const eh=i===0;let cor='bg-gray-700';let op='opacity-30';if(s>=7200){cor='bg-green-500';op='opacity-100';}else if(s>=3600){cor='bg-green-500';op='opacity-70';}else if(s>=1800){cor='bg-green-500';op='opacity-50';}else if(s>0){cor='bg-green-500';op='opacity-30';}let df=ch;try{df=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}catch{}r.push({ch,s,eh,df,cor,op});}return r;},[reg,base]);
  const off=useMemo(()=>{if(!dias.length)return 0;return new Date(dias[0].ch+'T12:00:00').getDay();},[dias]);
  const cols=Math.ceil((dias.length+off)/7);
  return(
    <div className="bg-gray-800 rounded-2xl p-4 border border-gray-700">
      <div className="flex justify-between items-center mb-3">
        <span className="text-white font-semibold text-sm">🔥 Atividade — 12 semanas</span>

          <span>menos</span>
          {['bg-gray-700 opacity-30','bg-green-500 opacity-30','bg-green-500 opacity-50','bg-green-500 opacity-70','bg-green-500 opacity-100'].map((c,i)=><div key={i} className={`w-3 h-3 rounded-sm ${c}`}/>)}
          <span>mais</span>
        </div>
      </div>
      <div className="flex gap-1 overflow-x-auto pb-1">
        {Array.from({length:cols},(_,ci)=>(
          <div key={ci} className="flex flex-col gap-1">
            {Array.from({length:7},(_,di)=>{const pos=ci*7+di-off;const d=dias[pos];if(!d)return<div key={di} className="w-3 h-3 opacity-0"/>;return<div key={di} className={`w-3 h-3 rounded-sm cursor-default transition-transform hover:scale-125 ${d.cor} ${d.op} ${d.eh?'ring-2 ring-white ring-offset-1 ring-offset-gray-800':''}`} title={d.s>0?`${d.df}: ${fmt(d.s)}`:`${d.df}: sem estudo`}/>;})}</div>
        ))}
      </div>
    </div>
  );
}

function BarChart({ reg }) {
  const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const dados = useMemo(() => {
    const res = [];
    const hojeDate = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(hojeDate.getDate() - i);
      const ch = d.toISOString().split('T')[0];
      const s = reg[ch] || 0;
      const h = s / 3600;
      const diaLabel = diasSemana[d.getDay()];
      res.push({ label: diaLabel, horas: h });
    }
    return res;
  }, [reg]);

  const maxHoras = Math.max(2, ...dados.map(d => d.horas));
  const height = 130;
  const width = 320;
  const padding = { top: 15, right: 10, bottom: 20, left: 30 };
  const graphHeight = height - padding.top - padding.bottom;
  const graphWidth = width - padding.left - padding.right;
  const barWidth = 22;
  const barGap = (graphWidth - barWidth * dados.length) / (dados.length - 1);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto">
      <defs>
        <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#60a5fa" />
          <stop offset="100%" stopColor="#2563eb" />
        </linearGradient>
      </defs>
      {[0, 0.5, 1].map((p, i) => {
        const y = padding.top + graphHeight * (1 - p);
        const val = (maxHoras * p).toFixed(1) + 'h';
        return (
          <g key={i}>
            <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="rgba(255,255,255,0.08)" strokeDasharray="2 2" />
            <text x={padding.left - 5} y={y + 3} fill="rgba(255,255,255,0.4)" fontSize="8" textAnchor="end">{val}</text>
          </g>
        );
      })}
      {dados.map((d, i) => {
        const barHeight = (d.horas / maxHoras) * graphHeight;
        const x = padding.left + i * (barWidth + barGap);
        const y = padding.top + graphHeight - barHeight;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barWidth} height={Math.max(2, barHeight)} rx="3" fill="url(#barGrad)" />
            {d.horas > 0 && (
              <text x={x + barWidth / 2} y={y - 3} fill="#93c5fd" fontSize="8" fontWeight="bold" textAnchor="middle">
                {d.horas.toFixed(1)}
              </text>
            )}
            <text x={x + barWidth / 2} y={height - 5} fill="rgba(255,255,255,0.5)" fontSize="8" textAnchor="middle">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function DonutChart({ dados }) {
  const total = useMemo(() => dados.reduce((a, d) => a + d.val, 0), [dados]);
  const processados = useMemo(() => {
    let acc = 0;
    return dados.map(d => {
      const pct = total > 0 ? (d.val / total) : 0;
      const angle = pct * 360;
      const startAngle = acc;
      acc += angle;
      return { ...d, pct, startAngle };
    });
  }, [dados, total]);

  const cores = ['#60a5fa', '#34d399', '#a78bfa', '#fbbf24', '#f87171', '#2dd4bf', '#f472b6'];

  if (total === 0) return <div className="text-center py-4 text-xs text-white/40 font-medium">Sem dados de tempo.</div>;

  let cumPercent = 0;
  return (
    <div className="flex items-center gap-6 py-2">
      <svg viewBox="0 0 120 120" className="w-24 h-24 shrink-0">
        <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="12" />
        {processados.map((d, i) => {
          if (d.pct === 0) return null;
          const r = 45;
          const circ = 2 * Math.PI * r;
          const strokeLength = d.pct * circ;
          const strokeOffset = circ - (cumPercent * circ);
          cumPercent += d.pct;
          const cor = cores[i % cores.length];
          return (
            <circle
              key={i}
              cx="60"
              cy="60"
              r={r}
              fill="none"
              stroke={cor}
              strokeWidth="12"
              strokeDasharray={`${strokeLength} ${circ}`}
              strokeDashoffset={strokeOffset}
              transform="rotate(-90 60 60)"
            />
          );
        })}
        <circle cx="60" cy="60" r="38" fill="#1e293b" />
      </svg>
      <div className="flex-1 space-y-1.5">
        {processados.map((d, i) => {
          if (d.pct === 0) return null;
          const cor = cores[i % cores.length];
          return (
            <div key={i} className="flex items-center justify-between text-[10px]">
              <div className="flex items-center gap-1.5 text-white/80 truncate">
                <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: cor }} />
                <span className="truncate">{d.label}</span>
              </div>
              <span className="font-semibold text-white/50 text-[9px]">{(d.pct * 100).toFixed(0)}%</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── INTERLEAVING SUGESTÃO ────────────────────────────────────
function InterleavingSugestao({S}){
  const{cron,semanaAtual}=S;
  const cfg=CRONOGRAMA[semanaAtual]||{f:0};
  const fase=FASES[cfg.f]||FASES[0];
  const temposHoje=useMemo(()=>{
    const t={};
    fase.materias.forEach(mat=>{t[mat.id]=cron.tempos[`${semanaAtual}-${mat.id}`]||0;});
    return t;
  },[cron.tempos,semanaAtual,fase]);
  const analise=useMemo(()=>{
    const dados=fase.materias.map(mat=>({...mat,tempo:temposHoje[mat.id]||0,meta:mat.horas*3600,pct:mat.horas>0?(temposHoje[mat.id]||0)/(mat.horas*3600):0}));
    if(dados.length<2)return null;
    const maisEstudada=[...dados].sort((a,b)=>b.tempo-a.tempo)[0];
    const menosEstudada=[...dados].sort((a,b)=>a.pct-b.pct)[0];
    if(maisEstudada.id===menosEstudada.id||maisEstudada.tempo<1800)return null;
    return{maisEstudada,menosEstudada};
  },[temposHoje,fase]);
  const[dispensado,setDispensado]=useState(false);
  if(!analise||dispensado)return null;
  return(
    <div className="rounded-2xl p-3 border slide-in" style={{background:'rgba(139,92,246,0.08)',borderColor:'rgba(139,92,246,0.3)'}}>
      <div className="flex items-start justify-between gap-3">
        <div className="flex items-start gap-2 flex-1 min-w-0">
          <span style={{fontSize:18}}>🔀</span>
          <div className="min-w-0">
            <p className="text-xs font-semibold text-purple-300">Dica de Interleaving</p>
            <p className="text-[11px] text-white/60 mt-0.5 leading-snug">
              Você focou em <span className="text-white font-medium">{analise.maisEstudada.nome}</span> ({(analise.maisEstudada.tempo/3600).toFixed(1)}h).
              Alterne para <span className="text-purple-300 font-semibold">{analise.menosEstudada.nome}</span>!
            </p>
          </div>
        </div>
        <button onClick={()=>setDispensado(true)} style={{color:'rgba(255,255,255,0.2)',fontSize:14,flexShrink:0}}>✕</button>
      </div>
    </div>
  );
}

// ─── CONQUISTAS ───────────────────────────────────────────────
function Conquistas({S}){
  const{badges,setBadges}=S;
  const tot=Object.keys(badges).length;
  const pct=Math.round(tot/BADGES.length*100);
  const resetOne=id=>{const b=BADGES.find(x=>x.id===id);if(!b||!badges[id])return;let df='';try{df=` (${new Date(badges[id]).toLocaleDateString('pt-BR')})`;}catch{}if(!confirm(`Resetar "${b.nome}"${df}?`))return;setBadges(p=>{const n={...p};delete n[id];return n;});};
  const resetAll=()=>{if(!tot){alert('Nenhuma conquista para resetar.');return;}if(!confirm(`Resetar todas as ${tot} conquistas?`))return;setBadges({});};
  return(
    <div className="min-h-screen bg-gradient-to-br from-yellow-900 to-slate-900 p-4">
      <div className="max-w-4xl mx-auto space-y-4">
        <div className="bg-white bg-opacity-10 rounded-2xl p-5 border border-white border-opacity-20">
          <div className="flex justify-between items-start flex-wrap gap-3">
            <div><h2 className="text-2xl font-bold text-yellow-300">🏆 Conquistas</h2><p className="text-white text-opacity-50 text-sm mt-1">{tot}/{BADGES.length} badges desbloqueados</p></div>
            <button onClick={resetAll} className="text-sm px-3 py-1.5 rounded-xl text-red-300 transition-colors" style={{backgroundColor:'rgba(239,68,68,0.2)'}}>🗑 Resetar Todas</button>
          </div>
          <div className="mt-3">
            <div className="flex justify-between text-xs mb-1" style={{color:'rgba(255,255,255,0.4)'}}><span>Progresso</span><span>{pct}%</span></div>
            <div className="w-full rounded-full" style={{height:8,backgroundColor:'rgba(255,255,255,0.1)'}}>
              <div className="h-full rounded-full transition-all duration-700 bg-gradient-to-r from-yellow-400 to-amber-400" style={{width:`${pct}%`}}/>
            </div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16}}>
          {BADGES.map(b=>{
            const g=!!badges[b.id];let df='';if(g){try{df=new Date(badges[b.id]).toLocaleDateString('pt-BR');}catch{}}
            return(
              <div key={b.id} className="rounded-2xl p-4 border transition-all" style={{
                background:g?'linear-gradient(135deg,rgba(234,179,8,0.3),rgba(245,158,11,0.2))':'rgba(255,255,255,0.05)',
                borderColor:g?'rgba(234,179,8,0.5)':'rgba(255,255,255,0.1)',opacity:g?1:0.5}}>
                <div className="flex justify-between mb-2">
                  <span style={{fontSize:36,filter:g?'none':'grayscale(1)',opacity:g?1:0.4}}>{b.ic}</span>
                  {g&&<button onClick={()=>resetOne(b.id)} style={{color:'rgba(255,255,255,0.2)',fontSize:14}} className="hover:text-red-400 transition-colors">↺</button>}
                </div>
                <div className="font-semibold text-white text-sm">{b.nome}</div>
                <div className="text-xs mt-1 mb-2" style={{color:'rgba(255,255,255,0.4)'}}>{b.desc}</div>
                {g?<div className="text-xs text-yellow-300">✅ {df?`em ${df}`:'Conquistado!'}</div>:<div className="text-xs" style={{color:'rgba(255,255,255,0.25)'}}>🔒 Não desbloqueado</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── POMODORO MODAL ───────────────────────────────────────────
function SoundControls() {
  const { currentType, volume, isPlaying, play, stop, setVolume } = useFocusSounds();
  const sounds = [
    { id: 'white', label: '🤍 Branco', desc: 'Ruído foco' },
    { id: 'pink', label: '💖 Rosa', desc: 'Ruído suave' },
    { id: 'rain', label: '🌧️ Chuva', desc: 'Ambiental' },
    { id: 'binaural', label: '🎧 Binaural', desc: '5Hz Theta' }
  ];
  return (
    <div className="mt-4 pt-3 border-t border-gray-700">
      <div className="text-xs text-gray-400 font-semibold mb-2 flex items-center justify-between">
        <span>🔊 Sons de Foco</span>
        {isPlaying && (
          <button type="button" onClick={stop} className="text-red-400 font-medium hover:underline text-[10px]">
            Parar
          </button>
        )}
      </div>
      <div className="grid grid-cols-2 gap-1.5 mb-2">
        {sounds.map(s => (
          <button
            key={s.id}
            type="button"
            onClick={() => currentType === s.id ? stop() : play(s.id)}
            className={`text-[9px] p-1.5 rounded-lg text-left transition-all ${
              currentType === s.id
                ? 'bg-blue-500/20 text-blue-300 border border-blue-500/40 font-semibold'
                : 'bg-gray-800 text-gray-400 border border-gray-700/50 hover:bg-gray-700/30'
            }`}
          >
            <div className="font-semibold">{s.label}</div>
            <div className="text-[7px] opacity-60 font-normal">{s.desc}</div>
          </button>
        ))}
      </div>
      <div className="flex items-center gap-1.5">
        <span className="text-[8px] text-gray-500">Vol</span>
        <input
          type="range"
          min="0"
          max="1"
          step="0.05"
          value={volume}
          onChange={e => setVolume(parseFloat(e.target.value))}
          className="h-1 flex-1 bg-gray-700 rounded-lg appearance-none cursor-pointer"
        />
        <span className="text-[8px] font-mono text-gray-400 w-5 text-right">
          {Math.round(volume * 100)}%
        </span>
      </div>
    </div>
  );
}

function PomoModal({pomo,onClose}){
  const total=pomo.tipo==='estudo'?25*60:5*60;

  const cor=pomo.tipo==='estudo'?'#34d399':'#60a5fa';
  return(
    <div className="fixed z-50 rounded-2xl p-4 shadow-2xl" style={{bottom:100,right:16,width:240,background:'#111827',border:'1px solid #374151'}}>
      <div className="flex justify-between items-center mb-3">

      <div className="flex justify-between items-center mb-3">
        <span className="text-xs px-2 py-1 rounded-full font-medium" style={{background:cor+'33',color:cor}}>{pomo.tipo==='estudo'?'🎯 Estudo':'☕ Pausa'}</span>
        <span className="text-xs" style={{color:'#9ca3af'}}>{pomo.rod} rodada{pomo.rod!==1?'s':''}</span>
      </div>
      <div className="flex justify-center mb-4">
        <div style={{position:'relative',width:112,height:112}}>
          <svg style={{width:'100%',height:'100%',transform:'rotate(-90deg)'}} viewBox="0 0 120 120">
            <circle cx="60" cy="60" r={r} fill="none" stroke="#374151" strokeWidth="8"/>
            <circle cx="60" cy="60" r={r} fill="none" stroke={cor} strokeWidth="8" strokeLinecap="round"
              strokeDasharray={circ} strokeDashoffset={off} style={{transition:'stroke-dashoffset .5s ease'}}/>

          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>

          {pomo.at?'⏸ Pausar':'▶ Iniciar'}
        </button>
      </div>
      <SoundControls />
    </div>
  );
}

// ─── CRONOGRAMA VIEW ──────────────────────────────────────────
function CronogramaView({S}){
  const{ui,dispatchUI,ed,dispatchED,concl,setConcl,diarios,cron,salvarDiario,semanaAtual,dataInicioPlano}=S;
  const sem=ui.sem;const setSem=n=>dispatchUI({t:'SEM',p:n});
  const cfg=CRONOGRAMA[sem]||{f:0};
  const fase=FASES[cfg.f]||FASES[0];
  const tempoSem=useMemo(()=>{let t=0;Object.entries(cron.tempos).forEach(([k,v])=>{if(k.startsWith(`${sem}-`))t+=v;});if(cron.ativo?.startsWith(`${sem}-`))t+=cron.segs-(cron.tempos[cron.ativo]||0);return t;},[sem,cron]);
  const metaSem=useMemo(()=>fase.materias.reduce((a,m)=>a+m.horas*3600,0),[fase]);
  const pct=metaSem>0?Math.min(100,Math.round(tempoSem/metaSem*100)):0;
  const eAtual=dataInicioPlano&&sem===semanaAtual;
  const atrasado=dataInicioPlano&&sem<semanaAtual&&pct<100;
  return(
    <div className="min-h-screen bg-gradient-to-br from-blue-900 via-blue-800 to-slate-900">
      <div style={{position:'sticky',top:0,zIndex:30,padding:'12px 16px',background:'rgba(30,58,138,0.9)',backdropFilter:'blur(8px)',borderBottom:'1px solid rgba(255,255,255,0.1)'}}>
        <div className="max-w-3xl mx-auto">
          <div className="flex justify-between items-center mb-2">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-white font-bold">📚 Semana {sem}/28</h1>
                {eAtual&&<span className="text-xs px-2 py-0.5 rounded-full font-medium" style={{background:'rgba(96,165,250,0.2)',color:'#93c5fd'}}>📍 atual</span>}
                {atrasado&&<span className="text-xs px-2 py-0.5 rounded-full font-medium" style={{background:'rgba(239,68,68,0.2)',color:'#fca5a5'}}>⚠ atraso</span>}
              </div>
              <p style={{color:'rgba(255,255,255,0.5)',fontSize:12}}>{fase.nome} · {cfg.foco||''}</p>
            </div>
            <div className="text-right"><span className="text-white font-bold">{pct}%</span><div style={{color:'rgba(255,255,255,0.3)',fontSize:11}}>{fmt(tempoSem)} / {fmt(metaSem)}</div></div>
          </div>
          <div className="w-full rounded-full" style={{height:6,background:'rgba(255,255,255,0.1)'}}>
            <div className="rounded-full transition-all h-full bg-gradient-to-r from-blue-400 to-green-400" style={{width:`${pct}%`}}/>
          </div>
        </div>
      </div>
      <div className="max-w-3xl mx-auto p-4 space-y-4 pb-36">
        <div className="rounded-2xl p-4 border" style={{background:'rgba(255,255,255,0.07)',borderColor:'rgba(255,255,255,0.1)'}}>
          <div className="flex justify-between text-sm mb-2">
            <span style={{color:'rgba(255,255,255,0.6)'}}>Navegar semana</span>
            <span className="text-white font-bold">{sem} / 28</span>
          </div>
          <input type="range" min={1} max={28} value={sem} onChange={e=>setSem(Number(e.target.value))}/>
          <div className="flex justify-between text-xs mt-1" style={{color:'rgba(255,255,255,0.3)'}}>
            {[1,7,14,21,28].map(n=><button key={n} onClick={()=>setSem(n)} className={`hover:text-white transition-colors ${sem===n?'text-blue-400':''}`}>{n}</button>)}

function SearchModal({S}){
  const{ui,dispatchUI,topP,resumos}=S;

    if(t.length<2){
      dispatchUI({t:'SEARCH',p:{t:'',r:[]}});

    const tl=t.toLowerCase(),res=[];
    Object.entries(CONTEUDOS).forEach(([mid,mat])=>{
      mat.categorias.forEach((cat,ci)=>{
        cat.topicos.forEach((top,ti)=>{const k=`${mid}-${ci}-${ti}`;if(top.toLowerCase().includes(tl)||resumos[k]?.toLowerCase().includes(tl))res.push({mid,mn:mat.nome,top,k,custom:false});});
        (topP[`${mid}-${ci}`]||[]).forEach((top,ti)=>{const k=`${mid}-${ci}-custom-${ti}`;if(top.toLowerCase().includes(tl))res.push({mid,mn:mat.nome,top,k,custom:true});});
      });
    });
    dispatchUI({t:'SEARCH',p:{t,r:res}});

  };
  const hl=(txt,t)=>{if(!t)return txt;const pts=[];let r=txt;let i=0;while(r.length>0&&i<100){const idx=r.toLowerCase().indexOf(t.toLowerCase());if(idx===-1){pts.push(<span key={i}>{r}</span>);break;}if(idx>0)pts.push(<span key={i+'a'}>{r.slice(0,idx)}</span>);pts.push(<mark key={i+'b'} style={{background:'rgba(251,191,36,0.4)',color:'#fde68a',borderRadius:3,padding:'0 2px'}}>{r.slice(idx,idx+t.length)}</mark>);r=r.slice(idx+t.length);i++;}return pts;};
  return(
    <div style={{position:'fixed',inset:0,zIndex:50,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'flex-start',justifyContent:'center',paddingTop:64,paddingLeft:16,paddingRight:16}}
      onClick={e=>{if(e.target===e.currentTarget)dispatchUI({t:'CSEARCH'});}}>
      <div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden slide-in" style={{background:'#1f2937'}}
        onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 p-4" style={{borderBottom:'1px solid #374151'}}>
          <span style={{color:'#9ca3af'}}>🔍</span>

            ref={inputRef}

            onChange={e=>buscar(e.target.value)}
            onKeyDown={e=>{if(e.key==='Escape')dispatchUI({t:'CSEARCH'});}}

            className="flex-1 text-white outline-none"

          <button onClick={()=>dispatchUI({t:'CSEARCH'})} style={{color:'#9ca3af'}} className="hover:text-white">✕</button>

          {termo.length>0&&termo.length<2&&<div className="p-4 text-sm text-center" style={{color:'#9ca3af'}}>Continue digitando…</div>}
          {termo.length>=2&&ui.resS.length===0&&<div className="p-4 text-sm text-center" style={{color:'#9ca3af'}}>Nenhum resultado para "{termo}"</div>}

function calcularSRS(rating, interval) {
  let nextInterval = 1;
  let nextTime = 0;
  if (rating === 'again') {
    nextInterval = 0;
    nextTime = Date.now() + 60000;
  } else if (rating === 'hard') {
    nextInterval = 1;
    nextTime = Date.now() + 86400000;
  } else if (rating === 'good') {
    nextInterval = interval === 0 ? 3 : Math.max(3, Math.round(interval * 2.0));
    nextTime = Date.now() + nextInterval * 86400000;
  } else if (rating === 'easy') {
    nextInterval = interval === 0 ? 6 : Math.max(6, Math.round(interval * 3.5));
    nextTime = Date.now() + nextInterval * 86400000;
  }
  return {
    interval: nextInterval,
    nextReview: new Date(nextTime).toISOString()
  };
}

      frente: frente.trim(),
      verso: verso.trim(),
      criadoEm: new Date().toISOString(),
      intervalo: 0,
      revisarEm: new Date().toISOString(),
    };
    setFlashcards(p => [...p, novo]);
    setFrente('');
    setVerso('');
    alert('Flashcard criado com sucesso!');
  };

  const responderSRS = (rating) => {
    const card = cardsParaRevisar[cardIndex];
    if (!card) return;
    const r = calcularSRS(rating, card.intervalo);
    setFlashcards(p => p.map(c => {
      if (c.id === card.id) {
        return {
          ...c,
          intervalo: r.interval,
          revisarEm: r.nextReview
        };
      }
      return c;
    }));
    if (cardIndex + 1 < cardsParaRevisar.length) {
      setCardIndex(p => p + 1);
      setMostrarVerso(false);
    } else {
      alert('Parabéns! Você concluiu a revisão deste deck.');
      setAbaInterna('decks');
      setDeckAtual(null);
    }
  };

  const deletarCard = (id) => {
    if (!confirm('Deseja realmente excluir este flashcard?')) return;
    setFlashcards(p => p.filter(c => c.id !== id));
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 p-4 pb-24">
      <div className="max-w-xl mx-auto space-y-4">
        <div className="flex justify-between items-center bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10">
          <div>
            <h2 className="text-xl font-bold text-blue-400 font-outfit">📇 Flashcards</h2>
            <p className="text-xs text-white/50">Estudo ativo e repetição espaçada</p>
          </div>
          <div className="flex gap-2">
            {abaInterna !== 'decks' && (
              <button onClick={() => { setAbaInterna('decks'); setDeckAtual(null); }} className="text-xs bg-white/10 px-3 py-1.5 rounded-xl text-white hover:bg-white/20 transition-all">
                ← Voltar
              </button>
            )}
            {abaInterna === 'decks' && (
              <button onClick={() => setAbaInterna('novo')} className="text-xs bg-blue-500 hover:bg-blue-600 px-3 py-1.5 rounded-xl text-white font-semibold transition-all">
                + Novo Card
              </button>
            )}
          </div>
        </div>

        {abaInterna === 'decks' && (
          <div className="space-y-3">
            {Decks.map(d => (
              <div key={d.id} className="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col justify-between gap-3 hover:border-blue-500/40 transition-all duration-300">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-semibold text-white text-base">{d.nome}</h3>
                    <div className="flex gap-3 text-xs text-white/40 mt-1">
                      <span>Total: <strong className="text-white">{d.total}</strong></span>
                      <span>A revisar: <strong className={d.due > 0 ? "text-amber-400 font-bold" : "text-white/40"}>{d.due}</strong></span>
                    </div>
                  </div>
                </div>
                <div className="flex gap-2 justify-end">
                  {d.due > 0 ? (
                    <button onClick={() => iniciarRevisao(d.id)} className="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl transition-all shadow-lg shadow-amber-500/20">
                      Revisar ({d.due})
                    </button>
                  ) : (
                    <button disabled className="text-xs bg-white/5 text-white/20 px-4 py-2 rounded-xl">
                      Em dia!
                    </button>
                  )}
                  <button onClick={() => { setMateriaSel(d.id); setAbaInterna('novo'); }} className="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl transition-all">
                    + Adicionar
                  </button>
                </div>
              </div>
            ))}
            {flashcards.length === 0 && (
              <div className="text-center py-12 bg-white/5 border border-white/5 rounded-2xl p-6">
                <div className="text-4xl mb-3">📇</div>
                <h3 className="font-medium text-white/70">Nenhum flashcard criado ainda</h3>
                <p className="text-xs text-white/40 mt-1 max-w-xs mx-auto">Adicione cartões para começar a treinar sua memória com repetição espaçada.</p>
                <button onClick={() => setAbaInterna('novo')} className="mt-4 text-xs bg-blue-500 text-white px-4 py-2 rounded-xl font-semibold">
                  Criar primeiro flashcard
                </button>
              </div>
            )}
          </div>
        )}

        {abaInterna === 'revisar' && deckAtual && (
          <div className="space-y-4">
            {cardsParaRevisar.length > 0 ? (
              <div className="space-y-4">
                <div className="flex justify-between items-center text-xs text-white/40">
                  <span>Revisando {CONTEUDOS[deckAtual]?.nome}</span>
                  <span>{cardIndex + 1} de {cardsParaRevisar.length}</span>
                </div>
                
                <div 
                  onClick={() => !mostrarVerso && setMostrarVerso(true)}
                  className="min-h-[220px] bg-slate-800/80 border border-white/10 rounded-3xl p-6 flex flex-col justify-between shadow-2xl cursor-pointer transition-all duration-300 relative overflow-hidden select-none hover:border-blue-400/40"
                >
                  <div className="absolute top-3 right-3 text-xs bg-white/5 text-white/30 px-2 py-0.5 rounded-full">
                    {mostrarVerso ? 'Verso' : 'Frente - Clique para revelar'}
                  </div>
                  <div className="flex-1 flex items-center justify-center text-center px-4 py-6">
                    <p className="text-base text-white font-medium whitespace-pre-wrap">
                      {mostrarVerso ? cardsParaRevisar[cardIndex].verso : cardsParaRevisar[cardIndex].frente}
                    </p>
                  </div>
                </div>

                <div className="flex flex-col gap-2">
                  {!mostrarVerso ? (
                    <button 
                      onClick={() => setMostrarVerso(true)} 
                      className="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-2xl font-bold transition-all shadow-lg shadow-blue-500/20"
                    >
                      Mostrar Resposta
                    </button>
                  ) : (
                    <div className="grid grid-cols-4 gap-2">
                      <button 
                        onClick={() => responderSRS('again')} 
                        className="bg-red-500/25 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 py-3 rounded-xl text-xs font-semibold flex flex-col items-center justify-center transition-all"
                      >
                        <span>Errei</span>
                        <span className="text-[10px] opacity-60">1 min</span>
                      </button>
                      <button 
                        onClick={() => responderSRS('hard')} 
                        className="bg-amber-500/25 hover:bg-amber-600 text-amber-400 hover:text-white border border-amber-500/30 py-3 rounded-xl text-xs font-semibold flex flex-col items-center justify-center transition-all"
                      >
                        <span>Difícil</span>
                        <span className="text-[10px] opacity-60">1 dia</span>
                      </button>
                      <button 
                        onClick={() => responderSRS('good')} 
                        className="bg-blue-500/25 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/30 py-3 rounded-xl text-xs font-semibold flex flex-col items-center justify-center transition-all"
                      >
                        <span>Bom</span>
                        <span className="text-[10px] opacity-60">3d+</span>
                      </button>
                      <button 
                        onClick={() => responderSRS('easy')} 
                        className="bg-green-500/25 hover:bg-green-600 text-green-400 hover:text-white border border-green-500/30 py-3 rounded-xl text-xs font-semibold flex flex-col items-center justify-center transition-all"
                      >
                        <span>Fácil</span>
                        <span className="text-[10px] opacity-60">6d+</span>
                      </button>
                    </div>
                  )}
                  <button 
                    onClick={() => deletarCard(cardsParaRevisar[cardIndex].id)} 
                    className="mt-4 text-center text-xs text-red-400 hover:text-red-300 font-medium py-1.5 transition-all"
                  >
                    Excluir este card
                  </button>
                </div>
              </div>
            ) : (
              <div className="text-center py-12 bg-white/5 border border-white/5 rounded-2xl p-6">
                <div className="text-4xl mb-3">🎉</div>
                <h3 className="font-semibold text-white">Nenhum cartão para revisar</h3>
                <p className="text-xs text-white/40 mt-1">Você concluiu todos os cartões deste deck por hoje!</p>
                <button onClick={() => setAbaInterna('decks')} className="mt-4 text-xs bg-white/10 text-white px-4 py-2 rounded-xl">
                  Voltar para os decks
                </button>
              </div>
            )}
          </div>
        )}

        {abaInterna === 'novo' && (
          <form onSubmit={criarCard} className="bg-white/5 border border-white/10 rounded-2xl p-5 space-y-4">
            <h3 className="font-semibold text-white text-base">Adicionar Flashcard</h3>
            
            <div className="space-y-1">
              <label className="text-xs text-white/50 font-medium">Selecione a Matéria</label>
              <select 
                value={materiaSel} 
                onChange={e => setMateriaSel(e.target.value)}
                required
                className="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500"
              >
                <option value="">-- Escolha uma matéria --</option>
                {Object.entries(CONTEUDOS).map(([id, mat]) => (
                  <option key={id} value={id}>{mat.nome}</option>
                ))}
              </select>
            </div>

            <div className="space-y-1">
              <label className="text-xs text-white/50 font-medium">Pergunta (Frente)</label>
              <textarea 
                value={frente} 
                onChange={e => setFrente(e.target.value)}
                required 
                placeholder="Ex: Qual foi a maior batalha naval da Primeira Guerra Mundial?"
                rows={3}
                className="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-sm text-white outline-none resize-none focus:border-blue-500"
              />
            </div>

            <div className="space-y-1">
              <label className="text-xs text-white/50 font-medium">Resposta (Verso)</label>
              <textarea 
                value={verso} 
                onChange={e => setVerso(e.target.value)}
                required 
                placeholder="Ex: Batalha da Jutlândia (1916)..."
                rows={3}
                className="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-sm text-white outline-none resize-none focus:border-blue-500"
              />
            </div>

            <button type="submit" className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm transition-all">
              Criar Flashcard
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

// ─── GOOGLE LOGIN BTN ─────────────────────────────────────────
function GoogleLoginBtn(){
  const[user,setUser]=useState(null);
  const[loading,setLoading]=useState(false);

  useEffect(()=>{
    const u=window.auth&&window.auth.currentUser;
    if(u)setUser(u);
    // só atualiza o ícone visual — a lógica de sync fica no App
    const handler=e=>setUser(e.detail);
    window.addEventListener('authStateChanged',handler);
    return()=>window.removeEventListener('authStateChanged',handler);
  },[]);

  const login=()=>{ window.loginGoogle(); };

  const logout=async()=>{
    if(!window.auth)return;
    if(!confirm('Sair da conta Google?'))return;
    await window.auth.signOut();
    let uid=localStorage.getItem('_uid_anon');
    if(!uid){uid='u_'+Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem('_uid_anon',uid);}
    window._uid=uid;
    localStorage.setItem('_uid',uid);
    // dispara o evento para o React atualizar o estado
    window.dispatchEvent(new CustomEvent('authStateChanged',{detail:null}));
  };

  if(loading)return(
    <button disabled style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontSize:11,color:'#9ca3af',border:'none',background:'none',padding:'8px 10px'}}>
      <span style={{fontSize:18,lineHeight:1}}>⏳</span>
      <span>...</span>
    </button>
  );

  if(user)return(
    <button onClick={logout} title={`Logado: ${user.displayName||user.email}`}
      style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontSize:11,color:'#34d399',border:'none',background:'none',cursor:'pointer',padding:'8px 10px',transition:'color .2s',maxWidth:64}}>
      {user.photoURL
        ?<img src={user.photoURL} alt="" style={{width:20,height:20,borderRadius:'50%',border:'2px solid #34d399'}}/>
        :<span style={{fontSize:18,lineHeight:1}}>👤</span>}
      <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:56}}>
        {(user.displayName||user.email||'').split(' ')[0]}
      </span>
    </button>
  );

  return(
    <button onClick={login} title="Entrar com Google para sincronizar entre dispositivos"
      style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontSize:11,color:'#f59e0b',border:'1px solid rgba(245,158,11,0.4)',background:'rgba(245,158,11,0.1)',cursor:'pointer',padding:'6px 10px',transition:'all .2s',borderRadius:8}}
      className="hover:text-white">
      <span style={{fontSize:18,lineHeight:1}}>🔐</span>
      <span>Sincronizar</span>
    </button>
  );
}

// ─── QUESTOES VIEW ────────────────────────────────────────────
function QuestoesView({S}){
  const {bancoQuestoes, progressoQuestoes, setProgressoQuestoes} = S;
  const [materiaSel, setMateriaSel] = useState('');
  const [anoSel, setAnoSel] = useState('');
  const [assuntoSel, setAssuntoSel] = useState('');
  const [buscaText, setBuscaText] = useState('');
  const [idx, setIdx] = useState(0);

  const materiasDisp = useMemo(() => [...new Set(bancoQuestoes.map(q=>q.materiaNome))].sort(), [bancoQuestoes]);
  const anosDisp = useMemo(() => [...new Set(bancoQuestoes.map(q=>q.ano))].sort((a,b)=>b-a), [bancoQuestoes]);

  const assuntosDisp = useMemo(() => {
    const qs = bancoQuestoes.filter(q => !materiaSel || q.materiaNome === materiaSel);
    return [...new Set(qs.map(q => q.assunto).filter(Boolean))].sort();
  }, [bancoQuestoes, materiaSel]);

  const filtradas = useMemo(() => {
    return bancoQuestoes.filter(q => {
      const matchMateria = !materiaSel || q.materiaNome === materiaSel;
      const matchAno = !anoSel || String(q.ano) === String(anoSel);
      const matchAssunto = !assuntoSel || q.assunto === assuntoSel;

      const term = buscaText.trim();
      if (!term) return matchMateria && matchAno && matchAssunto;

      const normalizar = s => {
        if (!s) return '';
        return s.normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[-\s]+/g, ' ')
          .trim()
          .toLowerCase();
      };

      const termNorm = normalizar(term);
      const enunciadoNorm = normalizar(q.enunciado);
      const assuntoNorm = normalizar(q.assunto || '');
      const subassuntoNorm = normalizar(q.subassunto || '');
      const materiaNorm = normalizar(q.materiaNome || '');
      const textoBaseNorm = normalizar(q.texto_base || '');

      const matchBusca = 
        enunciadoNorm.includes(termNorm) ||
        assuntoNorm.includes(termNorm) ||
        subassuntoNorm.includes(termNorm) ||
        materiaNorm.includes(termNorm) ||
        textoBaseNorm.includes(termNorm);

      return matchMateria && matchAno && matchAssunto && matchBusca;
    });
  }, [bancoQuestoes, materiaSel, anoSel, assuntoSel, buscaText]);

  useEffect(() => { 
    setAssuntoSel('');
    setIdx(0); 
  }, [materiaSel, anoSel]);

  useEffect(() => {
    setIdx(0);
  }, [assuntoSel, buscaText]);

  useEffect(() => {
    if (window.MathJax && window.MathJax.typesetPromise) {
      setTimeout(() => {
        window.MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));
      }, 50);
    }
  }, [q, idx, filtradas]);

  const responder = (id, altMarcada, correta) => {
    setProgressoQuestoes(p => ({
      ...p,
      [id]: { acertou: altMarcada === correta, alternativa: altMarcada, data: new Date().toISOString() }
    }));
  };

  if(!bancoQuestoes.length) {
    return <div className="p-8 text-center text-white/50">Carregando Banco de Questões...</div>;
  }

  const q = filtradas[idx];
  const resp = q ? progressoQuestoes[q.id] : null;

  const totFeitas = filtradas.filter(fq => progressoQuestoes[fq.id]).length;
  const totAcertos = filtradas.filter(fq => progressoQuestoes[fq.id]?.acertou).length;
  const pctAcerto = totFeitas > 0 ? Math.round((totAcertos / totFeitas) * 100) : 0;

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 p-4 pb-24">
      <div className="max-w-2xl mx-auto space-y-4">
        <div className="bg-white/5 backdrop-blur-md rounded-3xl p-5 border border-white/10 space-y-4 shadow-xl">
          <div className="flex justify-between items-start">
            <div>
              <h2 className="text-xl font-bold text-blue-400 font-outfit">📝 Banco de Questões</h2>
              <p className="text-xs text-white/50">Resolva provas anteriores para fixar o conteúdo</p>
            </div>
            {totFeitas > 0 && (
              <div className="text-right">
                <div className="text-2xl font-bold text-white">{pctAcerto}%</div>
                <div className="text-[10px] text-white/40 uppercase">Aproveitamento</div>
              </div>
            )}
          </div>

          <div className="relative">
            <input 
              type="text" 
              placeholder="Pesquisar por assunto, enunciado, matéria..." 
              value={buscaText} 
              onChange={e=>setBuscaText(e.target.value)} 
              className="w-full bg-slate-800/80 border border-white/10 rounded-xl pl-10 pr-10 py-2.5 text-sm text-white placeholder-white/30 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-outfit"
            />
            <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/30 text-sm">🔍</span>
            {buscaText && (
              <button 
                onClick={() => setBuscaText('')} 
                className="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40 hover:text-white text-xs bg-white/5 hover:bg-white/10 rounded-full w-5 h-5 flex items-center justify-center transition-colors"
                title="Limpar busca"
              >
                ✕
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <select value={materiaSel} onChange={e=>setMateriaSel(e.target.value)} className="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500 w-full">
              <option value="">📚 Todas as Matérias</option>
              {materiasDisp.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
            <select value={anoSel} onChange={e=>setAnoSel(e.target.value)} className="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500 w-full">
              <option value="">📅 Todos os Anos</option>
              {anosDisp.map(a=><option key={a} value={a}>{a}</option>)}
            </select>
            <select value={assuntoSel} onChange={e=>setAssuntoSel(e.target.value)} className="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500 w-full">
              <option value="">🔍 Todos os Assuntos</option>
              {assuntosDisp.map(a=><option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        </div>
        <div className="flex justify-between items-center px-2 text-xs font-medium text-white/40">
          <span>{filtradas.length} questões encontradas</span>
          <span>{totFeitas} resolvidas ({totAcertos} acertos)</span>
        </div>
        {filtradas.length === 0 ? (
          <div className="text-center py-12 bg-white/5 border border-white/5 rounded-3xl">
            <div className="text-4xl mb-3 opacity-50">🔍</div>
            <h3 className="font-medium text-white/70">Nenhuma questão encontrada</h3>
            <p className="text-xs text-white/40 mt-1">Tente mudar os filtros acima.</p>
          </div>
        ) : (
          <div className="bg-slate-800/80 border border-white/10 rounded-3xl p-5 md:p-6 space-y-5 shadow-2xl relative">
            <div className="flex justify-between items-center flex-wrap gap-2">
              <div className="flex flex-wrap gap-2 items-center">
                <span className="bg-blue-500/20 text-blue-300 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                  {q.materiaNome} • {q.ano} • Q{q.num}
                </span>
                {q.dificuldade && (
                  <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider ${
                    q.dificuldade === 'facil' ? 'bg-green-500/20 text-green-300' :
                    q.dificuldade === 'media' ? 'bg-yellow-500/20 text-yellow-300' :
                    'bg-red-500/20 text-red-300'
                  }`}>
                    {q.dificuldade === 'facil' ? 'Fácil' : q.dificuldade === 'media' ? 'Média' : 'Difícil'}
                  </span>
                )}
                {q.anulada && (
                  <span className="bg-red-600/30 text-red-400 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-red-500/20">
                    ANULADA
                  </span>
                )}
              </div>
              <span className="text-xs text-white/40 font-medium">
                Questão {idx + 1} de {filtradas.length}
              </span>
            </div>

            {q.assunto && (
              <div className="text-xs text-white/50 font-medium -mt-2">
                Assunto: <span className="text-white/80">{q.assunto}</span>
                {q.subassunto && (
                  <> • Subassunto: <span className="text-white/80">{q.subassunto}</span></>
                )}
              </div>
            )}

            {q.texto_base && (
              <div className="bg-slate-950/60 border border-white/5 rounded-2xl p-4 text-sm text-white/70 leading-relaxed max-h-60 overflow-y-auto mb-4 whitespace-pre-wrap font-serif italic shadow-inner">
                <div className="text-xs font-bold text-blue-400 not-italic uppercase mb-2">Texto de Apoio:</div>
                {q.texto_base}
              </div>
            )}

            <div className="text-[15px] md:text-base text-white/90 leading-relaxed whitespace-pre-wrap font-medium">
              {q.enunciado}
            </div>

            {q.anulada && (
              <div className="bg-red-500/10 border border-red-500/20 rounded-2xl p-4 text-center">
                <div className="text-sm font-bold text-red-400">Esta questão foi anulada pela banca examinadora.</div>
              </div>
            )}

            <div className="space-y-2 mt-6">
              {Object.entries(q.alternativas).map(([letra, texto]) => {
                const foiRespondida = !!resp || q.anulada;
                const isCorreta = letra === q.gabarito;
                const foiMarcada = resp?.alternativa === letra;
                let btnStyle = "bg-white/5 hover:bg-white/10 border-white/10 text-white/80";
                if (q.anulada) {
                  btnStyle = "bg-white/5 border-white/5 text-white/30 opacity-50";
                } else if (foiRespondida) {
                  if (isCorreta) btnStyle = "bg-green-500/20 border-green-500/50 text-green-300";
                  else if (foiMarcada) btnStyle = "bg-red-500/20 border-red-500/50 text-red-300";
                  else btnStyle = "bg-white/5 border-white/5 text-white/30 opacity-50";
                }
                return (
                  <button key={letra} disabled={foiRespondida} onClick={() => responder(q.id, letra, q.gabarito)}
                    className={`w-full text-left p-4 rounded-2xl border transition-all flex gap-3 items-start ${btnStyle} ${foiRespondida?'cursor-default':''}`}>
                    <span className="font-bold mt-0.5 shrink-0">{letra})</span>
                    <span className="text-sm leading-snug">{texto}</span>
                  </button>
                );
              })}
            </div>

            {resp && q.comentario_gabarito && (
              <div className="bg-blue-500/10 border border-blue-500/20 rounded-2xl p-4 mt-6 space-y-2">
                <div className="text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center gap-1.5">
                  <span>💡 Explicação do Gabarito:</span>
                </div>
                <p className="text-sm text-white/80 leading-relaxed whitespace-pre-wrap font-medium">
                  {q.comentario_gabarito}
                </p>
              </div>
            )}

            {q.tags && q.tags.length > 0 && (
              <div className="flex flex-wrap gap-1.5 pt-4 border-t border-white/5 mt-6">
                {q.tags.map(tag => (
                  <span key={tag} className="text-[10px] bg-slate-900 text-white/40 px-2 py-0.5 rounded-md hover:text-white/60 transition-colors">
                    #{tag}
                  </span>
                ))}
              </div>
            )}

            <div className="pt-4 border-t border-white/10 flex justify-between gap-3 mt-6">
              <button disabled={idx === 0} onClick={() => setIdx(i => i - 1)} className="flex-1 bg-white/5 hover:bg-white/10 disabled:opacity-30 text-white font-medium py-3 rounded-xl text-sm transition-all">
                ← Anterior
              </button>
              {!resp && !q.anulada && idx < filtradas.length - 1 && (
                <button onClick={() => setIdx(i => i + 1)} className="flex-1 bg-amber-600/25 hover:bg-amber-600/35 border border-amber-500/30 text-amber-300 font-medium py-3 rounded-xl text-sm transition-all">
                  Pular
                </button>
              )}
              <button disabled={idx === filtradas.length - 1} onClick={() => setIdx(i => i + 1)} className="flex-1 bg-blue-600 hover:bg-blue-700 disabled:opacity-30 text-white font-medium py-3 rounded-xl text-sm transition-all shadow-lg shadow-blue-500/20">
                Próxima →
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────
function App(){
  // ── estados persistidos no localStorage ──
  const[concl,setConcl]        =useLS(LS.C,{},isObj);
  const[topC,setTopC]          =useLS(LS.TC,{},isObj);
  const[topP,setTopP]          =useLS(LS.TP,{},isObj);
  const[resumos,setResumos]    =useLS(LS.R,{},isObj);
  const[reg,setReg]            =useLS(LS.RD,{},isObj);
  const[diarios,setDiarios]    =useLS(LS.D,{},isObj);
  const[topR,setTopR]          =useLS(LS.TR,{},isObj);
  const[badges,setBadges]      =useLS(LS.B,{},isObj);
  const[topRen,setTopRen]      =useLS(LS.RN,{},isObj);
  const[dataProva,setDataProva]=useLS(LS.DP,DATA_PROVA_PAD,v=>typeof v==='string');
  const[tSaved,setTSaved]      =useLS(LS.T,{},isObj);
  const[pRodSaved,setPRodSaved]=useLS(LS.PR,0,v=>typeof v==='number');
  const[dataInicioPlano,setDataInicioPlano]=useLS(LS.DI,'',v=>typeof v==='string');
  const[flashcards,setFlashcards]=useLS(LS.F,[],Array.isArray);
  const[habitos,setHabitos]      =useLS(LS.H,{},isObj);
  const[progressoQuestoes,setProgressoQuestoes] = useLS('progresso_questoes',{},isObj);
  const[bancoQuestoes,setBancoQuestoes] = useState([]);

  useEffect(()=>{
    fetch('CA-AA-AFN/banco_completo.json')
      .then(r => r.ok ? r : fetch('banco_questoes.json'))
      .then(r=>r.json())
      .then(d=>setBancoQuestoes(d.questoes||[]))
      .catch(e=>console.error('Erro ao carregar banco de questões', e));
  },[]);
  // ── estados de UI ──
  const[ui,dispatchUI]=useReducer(uiR,UI0);
  const[ed,dispatchED]=useReducer(edR,ED0);
  const[toast,setToast]=useState(null);
  const[frase]=useState(()=>FRASES[Math.floor(Math.random()*FRASES.length)]);
  // ── controle de sync ──
  const[currentUid,setCurrentUid]=useState(()=>window._uid);
  const[fbLoaded,setFbLoaded]=useState(false); // true após Firebase carregar — causa re-render para ativar save
  const saveRef=useRef(null);
  const skipSaveRef=useRef(false); // true enquanto dados remotos estão sendo aplicados

  // ── auth: login/logout subsequentes ──
  useEffect(()=>{
    const handler=e=>{
      const user=e.detail;
      if(user){
        const prevUid=window._uid; // UID anterior (pode ser anônimo u_xxx)
        window._uid=user.uid;
        localStorage.setItem('_uid',user.uid);

        // ── MIGRAÇÃO: se vinha de UID anônimo, tenta copiar dados para o Google UID ──
        if(prevUid&&prevUid.startsWith('u_')&&prevUid!==user.uid&&window.db){
          const anonRef=window.db.ref(`/usuarios/${prevUid}`);
          const googleRef=window.db.ref(`/usuarios/${user.uid}`);
          // Só migra se o Google UID ainda não tem dados próprios
          googleRef.once('value').then(snap=>{
            if(!snap.val()){
              // Google UID vazio → copia dados anônimos para ele
              anonRef.once('value').then(anonSnap=>{
                const d=anonSnap.val();
                if(d){
                  googleRef.set(d)
                    .then(()=>{console.log('[Firebase] Dados migrados do UID anônimo para Google UID.');anonRef.remove();})
                    .catch(err=>console.error('[Firebase] Erro na migração:',err));
                }
              });
            }
          });
        }

        setCurrentUid(user.uid);
      }
      else{setCurrentUid(window._uid);}
      clearTimeout(saveRef.current);
      setFbLoaded(false);
      skipSaveRef.current=false;
    };
    window.addEventListener('authStateChanged',handler);
    return()=>window.removeEventListener('authStateChanged',handler);
  },[]);

  // ── listener Firebase em tempo real ──
  // Quando currentUid muda: cancela timer de save, aguarda Firebase, aplica dados
  useEffect(()=>{
    if(!window.db)return;
    // ao trocar de usuário, cancela qualquer save pendente imediatamente
    clearTimeout(saveRef.current);
    setFbLoaded(false);
    const ref=window.db.ref(`/usuarios/${currentUid}`);
    const aplicarDados=snap=>{
      const d=snap.val();
      if(d){
        // bloqueia save enquanto aplica dados remotos
        skipSaveRef.current=true;
        if(d.concluidos&&isObj(d.concluidos))setConcl(d.concluidos);
        if(d.topicosCompletos&&isObj(d.topicosCompletos))setTopC(d.topicosCompletos);
        if(d.topicosPersonalizados&&isObj(d.topicosPersonalizados))setTopP(d.topicosPersonalizados);
        if(d.resumos&&isObj(d.resumos))setResumos(d.resumos);
        if(d.registrosDiarios&&isObj(d.registrosDiarios))setReg(d.registrosDiarios);
        if(d.diarios&&isObj(d.diarios))setDiarios(d.diarios);
        if(d.topicosRevisar&&isObj(d.topicosRevisar))setTopR(d.topicosRevisar);
        if(d.badges&&isObj(d.badges))setBadges(d.badges);
        if(d.topicosRenomeados&&isObj(d.topicosRenomeados))setTopRen(d.topicosRenomeados);
        if(d.dataProva&&typeof d.dataProva==='string')setDataProva(d.dataProva);
        if(d.tempos&&isObj(d.tempos))setTSaved(d.tempos);
        if(typeof d.pomodoroRodadas==='number')setPRodSaved(d.pomodoroRodadas);
        if(d.dataInicioPlano&&typeof d.dataInicioPlano==='string')setDataInicioPlano(d.dataInicioPlano);
        if(d.flashcards&&Array.isArray(d.flashcards))setFlashcards(d.flashcards);
        if(d.habitos&&isObj(d.habitos))setHabitos(d.habitos);
      }
      // Firebase respondeu — libera saves futuros (setState causa re-render que ativa o save)
      setFbLoaded(true);
    };
    ref.on('value',aplicarDados,()=>{setFbLoaded(true);});
    return()=>{ref.off('value',aplicarDados);clearTimeout(saveRef.current);};
  },[currentUid]);

  // ── save com debounce ──
  // Regras: 1) só salva após Firebase ter carregado  2) ignora ciclo causado por update remoto
  useEffect(()=>{
    if(!window.db)return;
    // se Firebase ainda não carregou para este uid, não agenda nada
    if(!fbLoaded)return;
    clearTimeout(saveRef.current);
    saveRef.current=setTimeout(()=>{
      if(skipSaveRef.current){skipSaveRef.current=false;return;}
      window.db.ref(`/usuarios/${currentUid}`).set({
        concluidos:concl,topicosCompletos:topC,topicosPersonalizados:topP,
        resumos,registrosDiarios:reg,diarios,topicosRevisar:topR,
        badges,topicosRenomeados:topRen,dataProva,tempos:tSaved,
        pomodoroRodadas:pRodSaved,dataInicioPlano,flashcards,habitos
      }).then(()=>{
        // save ok — silencioso
      }).catch(err=>{
        console.error('[Firebase] Erro ao salvar dados:', err.code, err.message);
        if(err.code==='PERMISSION_DENIED'){
          console.warn('[Firebase] Permissão negada — verifique as regras do Realtime Database e se está logado.');
        }
      });
    },2000);
  },[concl,topC,topP,resumos,reg,diarios,topR,badges,topRen,dataProva,tSaved,pRodSaved,dataInicioPlano,flashcards,habitos,currentUid,fbLoaded]);

  const regHoje=useCallback((seg,data)=>{if(seg<=0)return;const d=data||hoje();setReg(p=>({...p,[d]:(p[d]||0)+seg}));},[]);
  const cron=useCron(tSaved,setTSaved,regHoje);
  const pomo=usePomo(pRodSaved,setPRodSaved);
  const semanaAtual=useMemo(()=>calcSemAtual(dataInicioPlano),[dataInicioPlano]);

  // Auto-navega para semana atual quando dataInicioPlano é definido
  useEffect(()=>{if(dataInicioPlano)dispatchUI({t:'SEM',p:calcSemAtual(dataInicioPlano)});},[dataInicioPlano]);

  // Déficit acumulado total (semanas passadas)
  const deficitTotal=useMemo(()=>{
    if(!dataInicioPlano)return 0;
    let def=0;
    for(let s=1;s<semanaAtual;s++){
      const cfg=CRONOGRAMA[s]||{f:0};const fase=FASES[cfg.f]||FASES[0];
      const meta=fase.materias.reduce((a,m)=>a+m.horas*3600,0);
      const tempo=Object.entries(tSaved).filter(([k])=>k.startsWith(`${s}-`)).reduce((a,[,v])=>a+v,0);
      def+=Math.max(0,meta-tempo);
    }
    return def;
  },[dataInicioPlano,semanaAtual,tSaved]);

  // Déficit acumulado por matéria
  const deficitPorMateria=useMemo(()=>{
    if(!dataInicioPlano)return {};
    const d={};
    for(let s=1;s<semanaAtual;s++){
      const cfg=CRONOGRAMA[s]||{f:0};const fase=FASES[cfg.f]||FASES[0];
      fase.materias.forEach(mat=>{
        const meta=mat.horas*3600;const tempo=tSaved[`${s}-${mat.id}`]||0;
        const def=Math.max(0,meta-tempo);
        if(def>0)d[mat.id]=(d[mat.id]||0)+def;
      });
    }
    return d;
  },[dataInicioPlano,semanaAtual,tSaved]);

  const streak=useMemo(()=>{let c=0;const d=new Date();const hj=d.toISOString().split('T')[0];if(!reg[hj]||reg[hj]<STREAK_MIN)d.setDate(d.getDate()-1);for(let i=0;i<365;i++){const s=d.toISOString().split('T')[0];if(reg[s]&&reg[s]>=STREAK_MIN){c++;d.setDate(d.getDate()-1);}else break;}return c;},[reg]);
  const diasR=useMemo(()=>{const p=new Date(`${dataProva}T12:00:00`);return Math.max(0,Math.ceil((p-new Date())/86400000));},[dataProva]);
  const tempoTot=useMemo(()=>Object.values(reg).reduce((a,v)=>a+v,0),[reg]);
  const totTop=useMemo(()=>Object.values(topC).filter(Boolean).length,[topC]);
  const totSem=useMemo(()=>Object.values(concl).filter(Boolean).length,[concl]);
  const proGeral=useMemo(()=>Math.round(totSem/28*100),[totSem]);

  useEffect(()=>{
    const m={tt:tempoTot,sk:streak,pr:pomo.rod,tc:totTop};
    BADGES.forEach(b=>{if(!badges[b.id]&&b.chk(m)){setBadges(p=>({...p,[b.id]:new Date().toISOString()}));setToast(b);setTimeout(()=>setToast(null),TOAST_MS);}});
  },[tempoTot,streak,pomo.rod,totTop,badges]);

  const salvarResumo=useCallback((k,txt)=>{setResumos(p=>{if(!txt?.trim()){const n={...p};delete n[k];return n;}return{...p,[k]:txt.trim()};});dispatchED({t:'FR'});},[]);
  const salvarDiario=useCallback((sem,txt)=>{setDiarios(p=>({...p,[String(sem)]:txt}));dispatchED({t:'CD'});},[]);

  const exportar=()=>{const d={versao:'2.0',exportadoEm:new Date().toISOString(),tempos:cron.tempos,concluidos:concl,topicosCompletos:topC,topicosPersonalizados:topP,resumos,registrosDiarios:reg,diarios,topicosRevisar:topR,badgesGanhos:badges,pomodoroRodadas:pomo.rod,topicosRenomeados:topRen,dataProva,flashcards,progressoQuestoes};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`estudo-backup-${hoje()}.json`;a.click();URL.revokeObjectURL(u);};
  const importar=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d||typeof d!=='object'){alert('❌ Arquivo inválido.');return;}if(d.concluidos)setConcl(d.concluidos);if(d.topicosCompletos)setTopC(d.topicosCompletos);if(d.topicosPersonalizados)setTopP(d.topicosPersonalizados);if(d.resumos)setResumos(d.resumos);if(d.registrosDiarios)setReg(d.registrosDiarios);if(d.diarios)setDiarios(d.diarios);if(d.topicosRevisar)setTopR(d.topicosRevisar);if(d.badgesGanhos)setBadges(d.badgesGanhos);if(d.topicosRenomeados)setTopRen(d.topicosRenomeados);if(d.dataProva)setDataProva(d.dataProva);if(d.tempos)setTSaved(d.tempos);if(d.flashcards&&Array.isArray(d.flashcards))setFlashcards(d.flashcards);if(d.progressoQuestoes)setProgressoQuestoes(d.progressoQuestoes);alert(`✅ Dados importados! (v${d.versao||'?'})`);}catch(err){alert('❌ Erro: '+err.message);}};r.readAsText(f);e.target.value='';};
  const resetar=()=>{if(!confirm('⚠️ Apagar TODOS os dados? Esta ação é irreversível.\n\nExporte um backup antes!'))return;try{Object.values(LS).forEach(k=>localStorage.removeItem(k));setTimeout(()=>window.location.reload(),100);}catch(err){alert('Erro: '+err.message);}};

  const S={ui,dispatchUI,ed,dispatchED,concl,setConcl,topC,setTopC,topP,setTopP,resumos,setResumos,reg,setReg,diarios,topR,setTopR,badges,setBadges,topRen,setTopRen,dataProva,setDataProva,dataInicioPlano,setDataInicioPlano,semanaAtual,deficitTotal,deficitPorMateria,streak,diasR,tempoTot,totTop,totSem,proGeral,frase,cron,pomo,salvarResumo,salvarDiario,flashcards,setFlashcards,habitos,setHabitos,FASES,CRONOGRAMA,progressoQuestoes,setProgressoQuestoes,bancoQuestoes};
  const{view}=ui;

  return(
    <div style={{minHeight:'100vh',background:'#0f172a',color:'white'}}>
      <Toast badge={toast}/>
      {ui.showS&&<SearchModal S={S}/>}
      {ui.showP&&<PomoModal pomo={pomo} onClose={()=>dispatchUI({t:'POMO'})}/>}
      <div style={{paddingBottom:80}}>
        {view==='dashboard'  &&<Dashboard S={S}/>}
        {view==='cronograma' &&<CronogramaView S={S}/>}
        {view==='flashcards' &&<FlashcardsView S={S}/>}
        {view==='quiz'       &&<QuizView S={S}/>}
        {view==='questoes'   &&<QuestoesView S={S}/>}
        {view==='revisao'    &&<RevisaoView S={S}/>}
        {view==='conquistas' &&<Conquistas S={S}/>}
      </div>
      {/* Toolbar flutuante */}
      <div style={{position:'fixed',bottom:68,left:0,right:0,zIndex:30,display:'flex',justifyContent:'center',pointerEvents:'none'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'rgba(17,24,39,0.95)',backdropFilter:'blur(8px)',border:'1px solid #374151',borderRadius:24,padding:'6px 16px',pointerEvents:'auto'}}>
          <button onClick={()=>dispatchUI({t:'SEARCH',p:{t:'',r:[]}})} title="Pesquisar" style={{color:'#9ca3af',background:'none',border:'none',cursor:'pointer',fontSize:16,padding:'4px 8px'}} className="hover:text-white transition-colors">🔍</button>
          <div style={{width:1,height:16,background:'#374151'}}/>
          <button onClick={()=>dispatchUI({t:'POMO'})} title="Pomodoro" style={{color:pomo.at?'#4ade80':'#9ca3af',background:'none',border:'none',cursor:'pointer',fontSize:14,padding:'4px 8px'}} className="transition-colors">
            🍅{pomo.rod>0?` ${pomo.rod}`:''}
          </button>
          <div style={{width:1,height:16,background:'#374151'}}/>
          <button onClick={exportar} title="Exportar" style={{color:'#9ca3af',background:'none',border:'none',cursor:'pointer',fontSize:16,padding:'4px 8px'}} className="hover:text-white transition-colors">⬇</button>
          <label title="Importar" style={{color:'#9ca3af',cursor:'pointer',fontSize:16,padding:'4px 8px'}} className="hover:text-white transition-colors">
            ⬆<input type="file" accept=".json" onChange={importar} style={{display:'none'}}/>
          </label>
          <div style={{width:1,height:16,background:'#374151'}}/>
          <button onClick={resetar} title="Limpar todos os dados" style={{color:'#6b7280',background:'none',border:'none',cursor:'pointer',fontSize:14,padding:'4px 8px'}} className="hover:text-red-400 transition-colors">🗑</button>
        </div>
      </div>
      <NavBar view={view} dispatchUI={dispatchUI}/>
    </div>
  );
}

// Root criado uma única vez
let __appRoot = null;
function renderApp() {
  if (!__appRoot) {
    __appRoot = ReactDOM.createRoot(document.getElementById('root'));
  }
  __appRoot.render(<App />);
}

// Aguarda Firebase carregar, depois inicializa (guard contra dupla execução)
let __firebaseInited = false;
function initFirebase() {
  if (typeof firebase === 'undefined') {
    setTimeout(initFirebase, 50);
    return;
  }
  if (__firebaseInited) return;
  __firebaseInited = true;

  const firebaseConfig = {
    apiKey: "AIzaSyBR3MoezjKyBdnasY9asVqdxD3nMtoS44Q",
    authDomain: "cronogram-de-estudos.firebaseapp.com",
    databaseURL: "https://cronogram-de-estudos-default-rtdb.firebaseio.com",
    projectId: "cronogram-de-estudos",
    storageBucket: "cronogram-de-estudos.firebasestorage.app",
    messagingSenderId: "742013544348",
    appId: "1:742013544348:web:e27311a9b16a18a9ca4a59"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  window.db   = firebase.database();
  window.auth = firebase.auth();
  window.googleProvider = new firebase.auth.GoogleAuthProvider();
  window.loginGoogle = function() {
    window.auth.signInWithPopup(window.googleProvider)
      .then(function(r){ console.log("LOGADO:", r.user.displayName); })
      .catch(function(e){ console.error("ERRO LOGIN:", e); alert("Erro: " + e.message); });
  };

  let uid = localStorage.getItem('_uid');
  if (!uid) {
    uid = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    localStorage.setItem('_uid', uid);
  }
  window._uid = uid;

  // Renderiza o app imediatamente — não depende de auth
  renderApp();
  window.auth.getRedirectResult().then(function(r){if(r&&r.user)console.log("Redirect OK:",r.user.displayName);}).catch(function(e){if(e.code!=="auth/no-current-user")console.error("Redirect error:",e);});

  // Auth apenas atualiza o UID e notifica o React
  window.auth.onAuthStateChanged(function(user) {
    console.log("USER:", user);
    if (user) {
      window._uid = user.uid;
      localStorage.setItem('_uid', user.uid);
    }
    window.dispatchEvent(new CustomEvent('authStateChanged', { detail: user }));
  });
}

initFirebase();
