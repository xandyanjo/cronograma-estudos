  },[]);

  const login=()=>{ window.loginGoogle(); };

  const handleLocalSync = () => {
    const currentKey = window._uid || localStorage.getItem('_uid') || '';
    const newKey = prompt(
      "🔑 CHAVE DE SINCRONIZAÇÃO LOCAL\n\n" +
      "Como você está rodando o app localmente (file://), o login com Google não é permitido pelo navegador por segurança.\n\n" +
      "Para sincronizar o progresso de outro PC, cole a Chave de Sincronização dele abaixo.\n\n" +
      "Sua Chave Atual (copie para levar para outro PC):\n" + currentKey + "\n\n" +
      "Cole a nova chave abaixo para importar o progresso:",
      ""
    );
    if (newKey !== null) {
      const cleanKey = newKey.trim();
      if (cleanKey === '') {
        alert("Chave inválida. Nada alterado.");
      } else {
        localStorage.setItem('_uid', cleanKey);
        window._uid = cleanKey;
        alert("Chave de sincronização atualizada! A página será recarregada para baixar seu progresso.");
        window.location.reload();
      }
    }
  };

  const logout=async()=>{
    if(!window.auth)return;
    const currentKey = window._uid || localStorage.getItem('_uid') || '';
    
    try {
      await navigator.clipboard.writeText(currentKey);
      alert(
        "🔑 CONTA CONECTADA\n\n" +
        "Sua Chave de Sincronização foi copiada automaticamente para a área de transferência:\n\n" +
        currentKey + "\n\n" +
        "Você pode colar essa chave no app local (HD externo) para sincronizar o progresso.\n\n" +
        "Clique em OK para continuar. Se quiser sair da conta Google, a próxima tela perguntará."
      );
    } catch(e) {
      alert(
        "🔑 CONTA CONECTADA\n\n" +
        "Sua Chave de Sincronização é:\n\n" + currentKey + "\n\n" +
        "Copie esta chave para colar no app local (HD externo).\n\n" +
        "Clique em OK para continuar. Se quiser sair da conta Google, a próxima tela perguntará."
      );
    }
    
    if(!confirm('Deseja sair da sua conta Google no navegador?')) return;
    await window.auth.signOut();
    let uid=localStorage.getItem('_uid_anon');
    if(!uid){uid='u_'+Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem('_uid_anon',uid);}
    window._uid=uid;
    localStorage.setItem('_uid',uid);
    window.dispatchEvent(new CustomEvent('authStateChanged',{detail:null}));
  };

  if (isLocal) {
    return (
      <button onClick={handleLocalSync} title={`Sincronizar progresso localmente via chave\nChave Atual: ${uidVal}`}
        style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontSize:11,color:'#818cf8',border:'none',background:'none',cursor:'pointer',padding:'8px 10px',transition:'color .2s'}}>
        <span style={{fontSize:18,lineHeight:1}}>🔑</span>
        <span>Sincronizar</span>
      </button>
    );
  }

  if(loading)return(
    <button disabled style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontSize:11,color:'#9ca3af',border:'none',background:'none',padding:'8px 10px'}}>
      <span style={{fontSize:18,lineHeight:1}}>⏳</span>
      <span>...</span>
    </button>
  );

  if(user)return(
    <button onClick={logout} title={`Logado: ${user.displayName||user.email}\nChave de Sync: ${window._uid}`}
      style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontSize:11,color:'#34d399',border:'none',background:'none',cursor:'pointer',padding:'8px 10px',transition:'color .2s',maxWidth:64}}>
      {user.photoURL
        ?<img src={user.photoURL} alt="" style={{width:20,height:20,borderRadius:'50%',border:'2px solid #34d399'}}/>
        :<span style={{fontSize:18,lineHeight:1}}>👤</span>}
      <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:56}}>
        {(user.displayName||user.email||'').split(' ')[0]}
      </span>
    </button>
  );

  return(
    <button onClick={login} title="Entrar com Google para sincronizar entre dispositivos"
      style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontSize:11,color:'#f59e0b',border:'1px solid rgba(245,158,11,0.4)',background:'rgba(245,158,11,0.1)',cursor:'pointer',padding:'6px 10px',transition:'all .2s',borderRadius:8}}
      className="hover:text-white">
      <span style={{fontSize:18,lineHeight:1}}>🔐</span>
      <span>Sincronizar</span>
    </button>
  );
}

// ─── QUESTOES VIEW ────────────────────────────────────────────
function QuestoesView({S}){
  const {bancoQuestoes, progressoQuestoes, setProgressoQuestoes} = S;
  const [materiaSel, setMateriaSel] = useState('');
  const [anoSel, setAnoSel] = useState('');
  const [assuntoSel, setAssuntoSel] = useState('');
  const [buscaText, setBuscaText] = useState('');
  const [idx, setIdx] = useState(0);

  const materiasDisp = useMemo(() => [...new Set((bancoQuestoes||[]).map(q=>q.materiaNome))].sort(), [bancoQuestoes]);
  const anosDisp = useMemo(() => [...new Set((bancoQuestoes||[]).map(q=>q.ano))].sort((a,b)=>b-a), [bancoQuestoes]);

  const assuntosDisp = useMemo(() => {
    const qs = (bancoQuestoes||[]).filter(q => !materiaSel || q.materiaNome === materiaSel);
    return [...new Set(qs.map(q => q.assunto).filter(Boolean))].sort();
  }, [bancoQuestoes, materiaSel]);

  const filtradas = useMemo(() => {
    return (bancoQuestoes||[]).filter(q => {
      const matchMateria = !materiaSel || q.materiaNome === materiaSel;
      const matchAno = !anoSel || String(q.ano) === String(anoSel);
      const matchAssunto = !assuntoSel || q.assunto === assuntoSel;

      const term = buscaText.trim();
      if (!term) return matchMateria && matchAno && matchAssunto;

      const normalizar = s => {
        if (!s) return '';
        return s.normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[-\s]+/g, ' ')
          .trim()
          .toLowerCase();
      };

      const termNorm = normalizar(term);
      const enunciadoNorm = normalizar(q.enunciado);
      const assuntoNorm = normalizar(q.assunto || '');
      const subassuntoNorm = normalizar(q.subassunto || '');
      const materiaNorm = normalizar(q.materiaNome || '');
      const textoBaseNorm = normalizar(q.texto_base || '');

      const matchBusca = 
        enunciadoNorm.includes(termNorm) ||
        assuntoNorm.includes(termNorm) ||
        subassuntoNorm.includes(termNorm) ||
        materiaNorm.includes(termNorm) ||
        textoBaseNorm.includes(termNorm);

      return matchMateria && matchAno && matchAssunto && matchBusca;
    });
  }, [bancoQuestoes, materiaSel, anoSel, assuntoSel, buscaText]);

  useEffect(() => { 
    setAssuntoSel('');
    setIdx(0); 
  }, [materiaSel, anoSel]);

  useEffect(() => {
    setIdx(0);
  }, [assuntoSel, buscaText]);

  useEffect(() => {
    if (window.MathJax && window.MathJax.typesetPromise) {
      setTimeout(() => {
        window.MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));
      }, 50);
    }
  }, [q, idx, filtradas]);

  const responder = (id, altMarcada, correta) => {
    setProgressoQuestoes(p => ({
      ...p,
      [id]: { acertou: altMarcada === correta, alternativa: altMarcada, data: new Date().toISOString() }
    }));
  };

  if(bancoQuestoes === null) {
    return (
      <div className="p-8 text-center space-y-4">
        <div className="text-5xl">⚠️</div>
        <p className="text-white/70 font-outfit text-lg font-semibold">Banco de Questões indisponível</p>
        <p className="text-white/40 text-sm max-w-sm mx-auto">
          O navegador bloqueou o acesso ao arquivo local <code className="text-yellow-400">banco_completo.json</code> por
          política de segurança (<em>CORS</em>).
        </p>
        <div className="bg-white/5 border border-white/10 rounded-xl p-4 text-left text-xs text-white/50 max-w-sm mx-auto space-y-2">
          <p className="text-white/70 font-semibold">Para ativar no Chrome:</p>
          <p>1. Feche o Chrome completamente</p>
          <p>2. Abra pelo atalho com o parâmetro:</p>
          <code className="block bg-black/30 rounded p-2 text-green-400 break-all">
            chrome.exe --allow-file-access-from-files
          </code>
          <p>3. Abra o <code className="text-yellow-400">index.html</code> novamente</p>
        </div>
      </div>
    );
  }

  if(!bancoQuestoes || !bancoQuestoes.length) {
    return <div className="p-8 text-center text-white/50">Carregando Banco de Questões...</div>;
  }


  const q = filtradas[idx];
  const resp = q ? progressoQuestoes[q.id] : null;

  const totFeitas = filtradas.filter(fq => progressoQuestoes[fq.id]).length;
  const totAcertos = filtradas.filter(fq => progressoQuestoes[fq.id]?.acertou).length;
  const pctAcerto = totFeitas > 0 ? Math.round((totAcertos / totFeitas) * 100) : 0;

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 p-4 pb-24">
      <div className="max-w-2xl mx-auto space-y-4">
        <div className="bg-white/5 backdrop-blur-md rounded-3xl p-5 border border-white/10 space-y-4 shadow-xl">
          <div className="flex justify-between items-start">
            <div>
              <h2 className="text-xl font-bold text-blue-400 font-outfit">📝 Banco de Questões</h2>
              <p className="text-xs text-white/50">Resolva provas anteriores para fixar o conteúdo</p>
            </div>
            {totFeitas > 0 && (
              <div className="text-right">
                <div className="text-2xl font-bold text-white">{pctAcerto}%</div>
                <div className="text-[10px] text-white/40 uppercase">Aproveitamento</div>
              </div>
            )}
          </div>

          <div className="relative">
            <input 
              type="text" 
              placeholder="Pesquisar por assunto, enunciado, matéria..." 
              value={buscaText} 
              onChange={e=>setBuscaText(e.target.value)} 
              className="w-full bg-slate-800/80 border border-white/10 rounded-xl pl-10 pr-10 py-2.5 text-sm text-white placeholder-white/30 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-outfit"
            />
            <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/30 text-sm">🔍</span>
            {buscaText && (
              <button 
                onClick={() => setBuscaText('')} 
                className="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40 hover:text-white text-xs bg-white/5 hover:bg-white/10 rounded-full w-5 h-5 flex items-center justify-center transition-colors"
                title="Limpar busca"
              >
                ✕
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <select value={materiaSel} onChange={e=>setMateriaSel(e.target.value)} className="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500 w-full">
              <option value="">📚 Todas as Matérias</option>
              {materiasDisp.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
            <select value={anoSel} onChange={e=>setAnoSel(e.target.value)} className="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500 w-full">
              <option value="">📅 Todos os Anos</option>
              {anosDisp.map(a=><option key={a} value={a}>{a}</option>)}
            </select>
            <select value={assuntoSel} onChange={e=>setAssuntoSel(e.target.value)} className="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500 w-full">
              <option value="">🔍 Todos os Assuntos</option>
              {assuntosDisp.map(a=><option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        </div>
        <div className="flex justify-between items-center px-2 text-xs font-medium text-white/40">
          <span>{filtradas.length} questões encontradas</span>
          <span>{totFeitas} resolvidas ({totAcertos} acertos)</span>
        </div>
        {filtradas.length === 0 ? (
          <div className="text-center py-12 bg-white/5 border border-white/5 rounded-3xl">
            <div className="text-4xl mb-3 opacity-50">🔍</div>
            <h3 className="font-medium text-white/70">Nenhuma questão encontrada</h3>
            <p className="text-xs text-white/40 mt-1">Tente mudar os filtros acima.</p>
          </div>
        ) : (
          <div className="bg-slate-800/80 border border-white/10 rounded-3xl p-5 md:p-6 space-y-5 shadow-2xl relative">
            <div className="flex justify-between items-center flex-wrap gap-2">
              <div className="flex flex-wrap gap-2 items-center">
                <span className="bg-blue-500/20 text-blue-300 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                  {q.materiaNome} • {q.ano} • Q{q.num}
                </span>
                {q.dificuldade && (
                  <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider ${
                    q.dificuldade === 'facil' ? 'bg-green-500/20 text-green-300' :
                    q.dificuldade === 'media' ? 'bg-yellow-500/20 text-yellow-300' :
                    'bg-red-500/20 text-red-300'
                  }`}>
                    {q.dificuldade === 'facil' ? 'Fácil' : q.dificuldade === 'media' ? 'Média' : 'Difícil'}
                  </span>
                )}
                {q.anulada && (
                  <span className="bg-red-600/30 text-red-400 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-red-500/20">
                    ANULADA
                  </span>
                )}
              </div>
              <span className="text-xs text-white/40 font-medium">
                Questão {idx + 1} de {filtradas.length}
              </span>
            </div>

            {q.assunto && (
              <div className="text-xs text-white/50 font-medium -mt-2">
                Assunto: <span className="text-white/80">{q.assunto}</span>
                {q.subassunto && (
                  <> • Subassunto: <span className="text-white/80">{q.subassunto}</span></>
                )}
              </div>
            )}

            {q.texto_base && (
              <div className="bg-slate-950/60 border border-white/5 rounded-2xl p-4 text-sm text-white/70 leading-relaxed max-h-60 overflow-y-auto mb-4 whitespace-pre-wrap font-serif italic shadow-inner">
                <div className="text-xs font-bold text-blue-400 not-italic uppercase mb-2">Texto de Apoio:</div>
                {q.texto_base}
              </div>
            )}

            <div className="text-[15px] md:text-base text-white/90 leading-relaxed whitespace-pre-wrap font-medium">
              {q.enunciado}
            </div>

            {q.anulada && (
              <div className="bg-red-500/10 border border-red-500/20 rounded-2xl p-4 text-center">
                <div className="text-sm font-bold text-red-400">Esta questão foi anulada pela banca examinadora.</div>
              </div>
            )}

            <div className="space-y-2 mt-6">
              {Object.entries(q.alternativas).map(([letra, texto]) => {
                const foiRespondida = !!resp || q.anulada;
                const isCorreta = letra === q.gabarito;
                const foiMarcada = resp?.alternativa === letra;
                let btnStyle = "bg-white/5 hover:bg-white/10 border-white/10 text-white/80";
                if (q.anulada) {
                  btnStyle = "bg-white/5 border-white/5 text-white/30 opacity-50";
                } else if (foiRespondida) {
                  if (isCorreta) btnStyle = "bg-green-500/20 border-green-500/50 text-green-300";
                  else if (foiMarcada) btnStyle = "bg-red-500/20 border-red-500/50 text-red-300";
                  else btnStyle = "bg-white/5 border-white/5 text-white/30 opacity-50";
                }
                return (
                  <button key={letra} disabled={foiRespondida} onClick={() => responder(q.id, letra, q.gabarito)}
                    className={`w-full text-left p-4 rounded-2xl border transition-all flex gap-3 items-start ${btnStyle} ${foiRespondida?'cursor-default':''}`}>
                    <span className="font-bold mt-0.5 shrink-0">{letra})</span>
                    <span className="text-sm leading-snug">{texto}</span>
                  </button>
                );
              })}
            </div>

            {resp && q.comentario_gabarito && (
              <div className="bg-blue-500/10 border border-blue-500/20 rounded-2xl p-4 mt-6 space-y-2">
                <div className="text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center gap-1.5">
                  <span>💡 Explicação do Gabarito:</span>
                </div>
                <p className="text-sm text-white/80 leading-relaxed whitespace-pre-wrap font-medium">
                  {q.comentario_gabarito}
                </p>
              </div>
            )}

            {q.tags && q.tags.length > 0 && (
              <div className="flex flex-wrap gap-1.5 pt-4 border-t border-white/5 mt-6">
                {q.tags.map(tag => (
                  <span key={tag} className="text-[10px] bg-slate-900 text-white/40 px-2 py-0.5 rounded-md hover:text-white/60 transition-colors">
                    #{tag}
                  </span>
                ))}
              </div>
            )}

            <div className="pt-4 border-t border-white/10 flex justify-between gap-3 mt-6">
              <button disabled={idx === 0} onClick={() => setIdx(i => i - 1)} className="flex-1 bg-white/5 hover:bg-white/10 disabled:opacity-30 text-white font-medium py-3 rounded-xl text-sm transition-all">
                ← Anterior
              </button>
              {!resp && !q.anulada && idx < filtradas.length - 1 && (
                <button onClick={() => setIdx(i => i + 1)} className="flex-1 bg-amber-600/25 hover:bg-amber-600/35 border border-amber-500/30 text-amber-300 font-medium py-3 rounded-xl text-sm transition-all">
                  Pular
                </button>
              )}
              <button disabled={idx === filtradas.length - 1} onClick={() => setIdx(i => i + 1)} className="flex-1 bg-blue-600 hover:bg-blue-700 disabled:opacity-30 text-white font-medium py-3 rounded-xl text-sm transition-all shadow-lg shadow-blue-500/20">
                Próxima →
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────
function App(){
  // ── estados persistidos no localStorage ──
  const[concl,setConcl]        =useLS(LS.C,{},isObj);
  const[topC,setTopC]          =useLS(LS.TC,{},isObj);
  const[topP,setTopP]          =useLS(LS.TP,{},isObj);
  const[resumos,setResumos]    =useLS(LS.R,{},isObj);
  const[reg,setReg]            =useLS(LS.RD,{},isObj);
  const[diarios,setDiarios]    =useLS(LS.D,{},isObj);
  const[topR,setTopR]          =useLS(LS.TR,{},isObj);
  const[badges,setBadges]      =useLS(LS.B,{},isObj);
  const[topRen,setTopRen]      =useLS(LS.RN,{},isObj);
  const[dataProva,setDataProva]=useLS(LS.DP,DATA_PROVA_PAD,v=>typeof v==='string');
  const[tSaved,setTSaved]      =useLS(LS.T,{},isObj);
  const[pRodSaved,setPRodSaved]=useLS(LS.PR,0,v=>typeof v==='number');
  const[dataInicioPlano,setDataInicioPlano]=useLS(LS.DI,'',v=>typeof v==='string');
  const[flashcards,setFlashcards]=useLS(LS.F,[],Array.isArray);
  const[habitos,setHabitos]      =useLS(LS.H,{},isObj);
  const[progressoQuestoes,setProgressoQuestoes] = useLS('progresso_questoes',{},isObj);
  const [studyStructure, setStudyStructure] = useLS('progresso_estrutura_dados', DEFAULT_STUDY_STRUCTURE, isObj);
  const [completedKeys, setCompletedKeys] = useLS('progresso_completados_videos', {}, isObj);
  const [driveLetter, setDriveLetter] = useLS('progresso_letra_disco_videos', 'E', v => typeof v === 'string');
  const[bancoQuestoes,setBancoQuestoes] = useState([]);

  useEffect(()=>{
    // fetch() é bloqueado por CORS em file:// — usa XMLHttpRequest que funciona localmente
    const tryXHR = (url) => new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onload = () => {
        if (xhr.status === 200 || xhr.status === 0) { // status 0 = sucesso em file://
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('JSON inválido')); }
        } else { reject(new Error(`HTTP ${xhr.status}`)); }
      };
      xhr.onerror = () => reject(new Error('Erro de rede/CORS'));
      xhr.send();
    });

    tryXHR('CA-AA-AFN/banco_completo.json')
      .catch(() => tryXHR('banco_questoes.json'))
      .then(d => setBancoQuestoes(d.questoes || []))
      .catch(e => {
        console.warn('Banco de questões indisponível no modo local:', e.message);
        setBancoQuestoes(null); // null = erro (diferente de [] = vazio)
      });
  },[]);

  // ── Migração: versão da estrutura + correção de nomes corrompidos ──

  useEffect(() => {
    if (!studyStructure || !studyStructure.courses) return;

    // ── 1. Reset por versão: se estrutura local está desatualizada ──
    const localVersion  = studyStructure._version || 0;
    const targetVersion = DEFAULT_STUDY_STRUCTURE._version || 0;

    if (localVersion < targetVersion) {
      console.log('[Migração] Estrutura desatualizada (v' + localVersion + ' → v' + targetVersion + '). Resetando...');
      // Preserva apenas completedKeys que ainda existem na nova estrutura
      const validKeys = new Set();
      for (const c of DEFAULT_STUDY_STRUCTURE.courses) {
        for (const p of (c.periods || [])) {
          for (const v of (p.videos || [])) {
            validKeys.add(c.name + '||' + p.name + '||' + v);
          }
        }
      }
      setCompletedKeys(prev => {
        const next = {};
        for (const [k, val] of Object.entries(prev || {})) {
          if (validKeys.has(k)) next[k] = val;
        }
        return next;
      });
      setStudyStructure({ ...DEFAULT_STUDY_STRUCTURE });
      return; // já resolvido, não precisa da migração de chars
    }

    // ── 2. Migração de chars corrompidos (legado) ──
    const FIXES = [
      [/\u00fc0\u00e59/g, 'Á'],
      [/\u00fc0\u00e75/g, 'Ç'],
      [/\u00fc0\u00ea9/g, 'Õ'],
      [/\u00fc0\u00ea1/g, 'Í'],
      [/\u00fc0\u00eb3/g, 'Ú'],
      [/\u00fc0\u00e71/g, 'Ã'],
    ];

    const fixName = name => {
      let n = name;
      for (const [pat, rep] of FIXES) n = n.replace(pat, rep);
      n = n.replace(/  +/g, ' ').trim();
      return n;
    };

    const needsMigration = courses => courses.some(c =>
      c.periods && c.periods.some(p =>
        p.videos && p.videos.some(v => FIXES.some(([pat]) => pat.test(v)))
      )
    );

    if (!needsMigration(studyStructure.courses)) return;

    console.log('[Migração] Corrigindo nomes de arquivo corrompidos...');
    const keyMap = {};
    const newCourses = studyStructure.courses.map(course => ({
      ...course,
      periods: (course.periods || []).map(period => {
        const seen = new Set();
        const newVideos = [];
        for (const v of (period.videos || [])) {
          const fixed = fixName(v);
          if (seen.has(fixed)) continue;
          seen.add(fixed);
          newVideos.push(fixed);
          if (v !== fixed) {
            keyMap[course.name + '||' + period.name + '||' + v] = course.name + '||' + period.name + '||' + fixed;
          }
        }
        return { ...period, videos: newVideos };
      })
    }));

    if (Object.keys(keyMap).length > 0) {
      setCompletedKeys(prev => {
        const next = { ...prev };
        for (const [oldK, newK] of Object.entries(keyMap)) {
          if (oldK in next) { next[newK] = next[oldK]; delete next[oldK]; }
        }
        return next;
      });
    }

    setStudyStructure({ ...studyStructure, courses: newCourses });
    console.log('[Migração] ' + Object.keys(keyMap).length + ' nome(s) corrigido(s).');
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []); // roda apenas uma vez na montagem


  // ── estados de UI ──

  const[ui,dispatchUI]=useReducer(uiR,UI0);
  const[ed,dispatchED]=useReducer(edR,ED0);
  const[toast,setToast]=useState(null);
  const[frase]=useState(()=>FRASES[Math.floor(Math.random()*FRASES.length)]);
  // ── controle de sync ──
  const[currentUid,setCurrentUid]=useState(()=>window._uid);
  const[fbLoaded,setFbLoaded]=useState(false); // true após Firebase carregar — causa re-render para ativar save
  const saveRef=useRef(null);
  const skipSaveRef=useRef(false); // true enquanto dados remotos estão sendo aplicados

  // ── auth: login/logout subsequentes ──
  useEffect(()=>{
    const handler=e=>{
      const user=e.detail;
      if(user){
        const prevUid=window._uid; // UID anterior (pode ser anônimo u_xxx)
        window._uid=user.uid;
        localStorage.setItem('_uid',user.uid);

        // ── MIGRAÇÃO: se vinha de UID anônimo, tenta copiar dados para o Google UID ──
        if(prevUid&&prevUid.startsWith('u_')&&prevUid!==user.uid&&window.db){
          const anonRef=window.db.ref(`/usuarios/${prevUid}`);
          const googleRef=window.db.ref(`/usuarios/${user.uid}`);
          // Só migra se o Google UID ainda não tem dados próprios
          googleRef.once('value').then(snap=>{
            if(!snap.val()){
              // Google UID vazio → copia dados anônimos para ele
              anonRef.once('value').then(anonSnap=>{
                const d=anonSnap.val();
                if(d){
                  googleRef.set(d)
                    .then(()=>{console.log('[Firebase] Dados migrados do UID anônimo para Google UID.');anonRef.remove();})
                    .catch(err=>console.error('[Firebase] Erro na migração:',err));
                }
              });
            }
          });
        }

        setCurrentUid(user.uid);
      }
      else{setCurrentUid(window._uid);}
      clearTimeout(saveRef.current);
      setFbLoaded(false);
      skipSaveRef.current=false;
    };
    window.addEventListener('authStateChanged',handler);
    return()=>window.removeEventListener('authStateChanged',handler);
  },[]);

  // ── listener Firebase em tempo real ──
  // Quando currentUid muda: cancela timer de save, aguarda Firebase, aplica dados
  useEffect(()=>{
    if(!window.db)return;
    // ao trocar de usuário, cancela qualquer save pendente imediatamente
    clearTimeout(saveRef.current);
    setFbLoaded(false);
    const ref=window.db.ref(`/usuarios/${currentUid}`);
    const aplicarDados=snap=>{
      const d=snap.val();
      if(d){
        // bloqueia save enquanto aplica dados remotos
        skipSaveRef.current=true;
        if(d.concluidos&&isObj(d.concluidos))setConcl(d.concluidos);
        if(d.topicosCompletos&&isObj(d.topicosCompletos))setTopC(d.topicosCompletos);
        if(d.topicosPersonalizados&&isObj(d.topicosPersonalizados))setTopP(d.topicosPersonalizados);
        if(d.resumos&&isObj(d.resumos))setResumos(d.resumos);
        if(d.registrosDiarios&&isObj(d.registrosDiarios))setReg(d.registrosDiarios);
        if(d.diarios&&isObj(d.diarios))setDiarios(d.diarios);
        if(d.topicosRevisar&&isObj(d.topicosRevisar))setTopR(d.topicosRevisar);
        if(d.badges&&isObj(d.badges))setBadges(d.badges);
        if(d.topicosRenomeados&&isObj(d.topicosRenomeados))setTopRen(d.topicosRenomeados);
        if(d.dataProva&&typeof d.dataProva==='string')setDataProva(d.dataProva);
        if(d.tempos&&isObj(d.tempos))setTSaved(d.tempos);
        if(typeof d.pomodoroRodadas==='number')setPRodSaved(d.pomodoroRodadas);
        if(d.dataInicioPlano&&typeof d.dataInicioPlano==='string')setDataInicioPlano(d.dataInicioPlano);
        if(d.flashcards&&Array.isArray(d.flashcards))setFlashcards(d.flashcards);
        if(d.habitos&&isObj(d.habitos))setHabitos(d.habitos);
        if(d.concluidosVideos){
          if(Array.isArray(d.concluidosVideos)){
            const obj={};
            d.concluidosVideos.forEach(k=>{if(k)obj[k]=true;});
            setCompletedKeys(obj);
          }else if(isObj(d.concluidosVideos)){
            setCompletedKeys(d.concluidosVideos);
          }
        }
        if(d.estruturaVideos&&isObj(d.estruturaVideos)){
          const courses = Array.isArray(d.estruturaVideos.courses) ? d.estruturaVideos.courses.map(c => {
            if (!c) return c;
            return {
              ...c,
              periods: Array.isArray(c.periods) ? c.periods.map(p => {
                if (!p) return p;
                return {
                  ...p,
                  videos: Array.isArray(p.videos) ? p.videos : []
                };
              }) : []
            };
          }) : [];
          const manual = Array.isArray(d.estruturaVideos.manual) ? d.estruturaVideos.manual.map(m => {
            if (!m) return m;
            return {
              ...m,
              items: Array.isArray(m.items) ? m.items : []
            };
          }) : [];
          setStudyStructure({ courses, manual });
        }
        if(d.driveLetter&&typeof d.driveLetter==='string')setDriveLetter(d.driveLetter);
      }
      // Firebase respondeu — libera saves futuros (setState causa re-render que ativa o save)
      setFbLoaded(true);
    };
    ref.on('value',aplicarDados,()=>{setFbLoaded(true);});
    return()=>{ref.off('value',aplicarDados);clearTimeout(saveRef.current);};
  },[currentUid]);

  // ── save com debounce ──
  // Regras: 1) só salva após Firebase ter carregado  2) ignora ciclo causado por update remoto
  useEffect(()=>{
    if(!window.db)return;
    // se Firebase ainda não carregou para este uid, não agenda nada
    if(!fbLoaded)return;
    clearTimeout(saveRef.current);
    saveRef.current=setTimeout(()=>{
      if(skipSaveRef.current){skipSaveRef.current=false;return;}
      window.db.ref(`/usuarios/${currentUid}`).set({
        concluidos:concl,topicosCompletos:topC,topicosPersonalizados:topP,
        resumos,registrosDiarios:reg,diarios,topicosRevisar:topR,
        badges,topicosRenomeados:topRen,dataProva,tempos:tSaved,
        pomodoroRodadas:pRodSaved,dataInicioPlano,flashcards,habitos,
        concluidosVideos:Object.keys(completedKeys).filter(k => completedKeys[k]),
        estruturaVideos:studyStructure,
        driveLetter:driveLetter
      }).then(()=>{
        // save ok — silencioso
      }).catch(err=>{
        console.error('[Firebase] Erro ao salvar dados:', err.code, err.message);
        if(err.code==='PERMISSION_DENIED'){
          console.warn('[Firebase] Permissão negada — verifique as regras do Realtime Database e se está logado.');
        }
      });
    },2000);
  },[concl,topC,topP,resumos,reg,diarios,topR,badges,topRen,dataProva,tSaved,pRodSaved,dataInicioPlano,flashcards,habitos,completedKeys,studyStructure,driveLetter,currentUid,fbLoaded]);

  const regHoje=useCallback((seg,data)=>{if(seg<=0)return;const d=data||hoje();setReg(p=>({...p,[d]:(p[d]||0)+seg}));},[]);
  const cron=useCron(tSaved,setTSaved,regHoje);
  const pomo=usePomo(pRodSaved,setPRodSaved);
  const semanaAtual=useMemo(()=>calcSemAtual(dataInicioPlano),[dataInicioPlano]);

  // Auto-navega para semana atual quando dataInicioPlano é definido
  useEffect(()=>{if(dataInicioPlano)dispatchUI({t:'SEM',p:calcSemAtual(dataInicioPlano)});},[dataInicioPlano]);

  // Déficit acumulado total (semanas passadas)
  const deficitTotal=useMemo(()=>{
    if(!dataInicioPlano)return 0;
    let def=0;
    for(let s=1;s<semanaAtual;s++){
      const cfg=CRONOGRAMA[s]||{f:0};const fase=FASES[cfg.f]||FASES[0];
      const meta=fase.materias.reduce((a,m)=>a+m.horas*3600,0);
      const tempo=Object.entries(tSaved).filter(([k])=>k.startsWith(`${s}-`)).reduce((a,[,v])=>a+v,0);
      def+=Math.max(0,meta-tempo);
    }
    return def;
  },[dataInicioPlano,semanaAtual,tSaved]);

  // Déficit acumulado por matéria
  const deficitPorMateria=useMemo(()=>{
    if(!dataInicioPlano)return {};
    const d={};
    for(let s=1;s<semanaAtual;s++){
      const cfg=CRONOGRAMA[s]||{f:0};const fase=FASES[cfg.f]||FASES[0];
      fase.materias.forEach(mat=>{
        const meta=mat.horas*3600;const tempo=tSaved[`${s}-${mat.id}`]||0;
        const def=Math.max(0,meta-tempo);
        if(def>0)d[mat.id]=(d[mat.id]||0)+def;
      });
    }
    return d;
  },[dataInicioPlano,semanaAtual,tSaved]);

  const streak=useMemo(()=>{let c=0;const d=new Date();const hj=d.toISOString().split('T')[0];if(!reg[hj]||reg[hj]<STREAK_MIN)d.setDate(d.getDate()-1);for(let i=0;i<365;i++){const s=d.toISOString().split('T')[0];if(reg[s]&&reg[s]>=STREAK_MIN){c++;d.setDate(d.getDate()-1);}else break;}return c;},[reg]);
  const diasR=useMemo(()=>{const p=new Date(`${dataProva}T12:00:00`);return Math.max(0,Math.ceil((p-new Date())/86400000));},[dataProva]);
  const tempoTot=useMemo(()=>Object.values(reg).reduce((a,v)=>a+v,0),[reg]);
  const totTop=useMemo(()=>Object.values(topC).filter(Boolean).length,[topC]);
  const totSem=useMemo(()=>Object.values(concl).filter(Boolean).length,[concl]);
  const proGeral=useMemo(()=>Math.round(totSem/28*100),[totSem]);

  useEffect(()=>{
    const m={tt:tempoTot,sk:streak,pr:pomo.rod,tc:totTop};
    BADGES.forEach(b=>{if(!badges[b.id]&&b.chk(m)){setBadges(p=>({...p,[b.id]:new Date().toISOString()}));setToast(b);setTimeout(()=>setToast(null),TOAST_MS);}});
  },[tempoTot,streak,pomo.rod,totTop,badges]);

  const salvarResumo=useCallback((k,txt)=>{setResumos(p=>{if(!txt?.trim()){const n={...p};delete n[k];return n;}return{...p,[k]:txt.trim()};});dispatchED({t:'FR'});},[]);
  const salvarDiario=useCallback((sem,txt)=>{setDiarios(p=>({...p,[String(sem)]:txt}));dispatchED({t:'CD'});},[]);

  const exportar=()=>{const d={versao:'2.0',exportadoEm:new Date().toISOString(),tempos:cron.tempos,concluidos:concl,topicosCompletos:topC,topicosPersonalizados:topP,resumos,registrosDiarios:reg,diarios,topicosRevisar:topR,badgesGanhos:badges,pomodoroRodadas:pomo.rod,topicosRenomeados:topRen,dataProva,flashcards,progressoQuestoes};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`estudo-backup-${hoje()}.json`;a.click();URL.revokeObjectURL(u);};
  const importar=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d||typeof d!=='object'){alert('❌ Arquivo inválido.');return;}if(d.concluidos)setConcl(d.concluidos);if(d.topicosCompletos)setTopC(d.topicosCompletos);if(d.topicosPersonalizados)setTopP(d.topicosPersonalizados);if(d.resumos)setResumos(d.resumos);if(d.registrosDiarios)setReg(d.registrosDiarios);if(d.diarios)setDiarios(d.diarios);if(d.topicosRevisar)setTopR(d.topicosRevisar);if(d.badgesGanhos)setBadges(d.badgesGanhos);if(d.topicosRenomeados)setTopRen(d.topicosRenomeados);if(d.dataProva)setDataProva(d.dataProva);if(d.tempos)setTSaved(d.tempos);if(d.flashcards&&Array.isArray(d.flashcards))setFlashcards(d.flashcards);if(d.progressoQuestoes)setProgressoQuestoes(d.progressoQuestoes);alert(`✅ Dados importados! (v${d.versao||'?'})`);}catch(err){alert('❌ Erro: '+err.message);}};r.readAsText(f);e.target.value='';};
  const resetar=()=>{if(!confirm('⚠️ Apagar TODOS os dados? Esta ação é irreversível.\n\nExporte um backup antes!'))return;try{Object.values(LS).forEach(k=>localStorage.removeItem(k));setTimeout(()=>window.location.reload(),100);}catch(err){alert('Erro: '+err.message);}};

  const S={ui,dispatchUI,ed,dispatchED,concl,setConcl,topC,setTopC,topP,setTopP,resumos,setResumos,reg,setReg,diarios,topR,setTopR,badges,setBadges,topRen,setTopRen,dataProva,setDataProva,dataInicioPlano,setDataInicioPlano,semanaAtual,deficitTotal,deficitPorMateria,streak,diasR,tempoTot,totTop,totSem,proGeral,frase,cron,pomo,salvarResumo,salvarDiario,flashcards,setFlashcards,habitos,setHabitos,FASES,CRONOGRAMA,progressoQuestoes,setProgressoQuestoes,bancoQuestoes,studyStructure,setStudyStructure,completedKeys,setCompletedKeys,driveLetter,setDriveLetter,DEFAULT_STUDY_STRUCTURE};
  const{view}=ui;

  return(
    <div style={{minHeight:'100vh',background:'#0f172a',color:'white'}}>
      <Toast badge={toast}/>
      {ui.showS&&<SearchModal S={S}/>}
      {ui.showP&&<PomoModal pomo={pomo} onClose={()=>dispatchUI({t:'POMO'})}/>}
      <div style={{paddingBottom:80}}>
        {view==='dashboard'  &&<Dashboard S={S}/>}
        {view==='cronograma' &&<CronogramaView S={S}/>}
        {view==='videoaulas' &&<VideoaulasView S={S}/>}
        {view==='flashcards' &&<FlashcardsView S={S}/>}
        {view==='quiz'       &&<QuizView S={S}/>}
        {view==='questoes'   &&<QuestoesView S={S}/>}
        {view==='revisao'    &&<RevisaoView S={S}/>}
        {view==='conquistas' &&<Conquistas S={S}/>}
      </div>
      {/* Toolbar flutuante */}
      <div style={{position:'fixed',bottom:68,left:0,right:0,zIndex:30,display:'flex',justifyContent:'center',pointerEvents:'none'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'rgba(17,24,39,0.95)',backdropFilter:'blur(8px)',border:'1px solid #374151',borderRadius:24,padding:'6px 16px',pointerEvents:'auto'}}>
          <button onClick={()=>dispatchUI({t:'SEARCH',p:{t:'',r:[]}})} title="Pesquisar" style={{color:'#9ca3af',background:'none',border:'none',cursor:'pointer',fontSize:16,padding:'4px 8px'}} className="hover:text-white transition-colors">🔍</button>
          <div style={{width:1,height:16,background:'#374151'}}/>
          <button onClick={()=>dispatchUI({t:'POMO'})} title="Pomodoro" style={{color:pomo.at?'#4ade80':'#9ca3af',background:'none',border:'none',cursor:'pointer',fontSize:14,padding:'4px 8px'}} className="transition-colors">
            🍅{pomo.rod>0?` ${pomo.rod}`:''}
          </button>
          <div style={{width:1,height:16,background:'#374151'}}/>
          <button onClick={exportar} title="Exportar" style={{color:'#9ca3af',background:'none',border:'none',cursor:'pointer',fontSize:16,padding:'4px 8px'}} className="hover:text-white transition-colors">⬇</button>
          <label title="Importar" style={{color:'#9ca3af',cursor:'pointer',fontSize:16,padding:'4px 8px'}} className="hover:text-white transition-colors">
            ⬆<input type="file" accept=".json" onChange={importar} style={{display:'none'}}/>
          </label>
          <div style={{width:1,height:16,background:'#374151'}}/>
          <button onClick={resetar} title="Limpar todos os dados" style={{color:'#6b7280',background:'none',border:'none',cursor:'pointer',fontSize:14,padding:'4px 8px'}} className="hover:text-red-400 transition-colors">🗑</button>
        </div>
      </div>
      <NavBar view={view} dispatchUI={dispatchUI}/>
    </div>
  );
}

function VideoaulasView({ S }) {
  const {
    studyStructure,
    setStudyStructure,
    completedKeys,
    setCompletedKeys,
    driveLetter,
    setDriveLetter,
    DEFAULT_STUDY_STRUCTURE
  } = S;

  const getPercent = (completed, total) => {
    if (!total || total <= 0) return 0;
    return Math.round((completed / total) * 10000) / 100;
  };

  const [toastMsg, setToastMsg] = useState(null);

  // Controle de Navegação (Drill-Down)
  const [navigation, setNavigation] = useState({
    view: 'home',
    subjectName: null,
    courseId: null,
    periodName: null
  });

  // Estados para Formulários de Adição
  const [newCourseName, setNewCourseName] = useState("");
  const [newCourseSubject, setNewCourseSubject] = useState("Conhecimento Militar Naval");
  const [newPeriodName, setNewPeriodName] = useState("");
  const [newVideoText, setNewVideoText] = useState("");
  const [newManualItem, setNewManualItem] = useState("");
  const [editingVideo, setEditingVideo] = useState(null); // { courseId, periodName, oldName, value }

  const showToast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 3000);
  };

  const handleDriveChange = async (newDrive) => {
    const cleanDrive = newDrive.replace(/[^a-zA-Z]/g, '').toUpperCase();
    setDriveLetter(cleanDrive);
  };

  // --- Lógica de Progresso ---
  const stats = useMemo(() => {
    let totalVideos = 0;
    let completedVideos = 0;
    let totalManual = 0;
    let completedManual = 0;
    const subjectStats = {};

    Object.keys(VIDEO_SUBJECT_METADATA).forEach(subject => {
      subjectStats[subject] = { total: 0, completed: 0 };
    });

    const safeCourses = Array.isArray(studyStructure?.courses) ? studyStructure.courses : [];
    const safeManual = Array.isArray(studyStructure?.manual) ? studyStructure.manual : [];

    safeCourses.forEach(c => {
      if (!c || !Array.isArray(c.periods)) return;
      const subject = c.subject || "Conhecimento Militar Naval";
      if (!subjectStats[subject]) {
        subjectStats[subject] = { total: 0, completed: 0 };
      }
      c.periods.forEach(p => {
        if (!p || !Array.isArray(p.videos)) return;
        p.videos.forEach(v => {
          const key = `${c.name}/${p.name}/${v}`;
          totalVideos++;
          subjectStats[subject].total++;
          if (completedKeys[key]) {
            completedVideos++;
            subjectStats[subject].completed++;
          }
        });
      });
    });

    safeManual.forEach(m => {
      if (!m) return;
      const subject = m.subject;
      if (!subjectStats[subject]) {
        subjectStats[subject] = { total: 0, completed: 0 };
      }
      const safeItems = Array.isArray(m.items) ? m.items : [];
      safeItems.forEach(i => {
        const key = `manual/${m.id}/${i}`;
        totalManual++;
        subjectStats[subject].total++;
        if (completedKeys[key]) {
          completedManual++;
          subjectStats[subject].completed++;
        }
      });
    });

    const totalAll = totalVideos + totalManual;
    const completedAll = completedVideos + completedManual;
    const percentAll = getPercent(completedAll, totalAll);

    return {
      totalVideos,
      completedVideos,
      totalManual,
      completedManual,
      totalAll,
      completedAll,
      percentAll,
      subjectStats
    };
  }, [studyStructure, completedKeys]);

  const toggleVideoComplete = async (courseName, periodName, videoName) => {
    const key = `${courseName}/${periodName}/${videoName}`;
    setCompletedKeys(prev => ({ ...prev, [key]: !prev[key] }));
  };

  const toggleManualComplete = async (manualId, itemName) => {
    const key = `manual/${manualId}/${itemName}`;
    setCompletedKeys(prev => ({ ...prev, [key]: !prev[key] }));
  };

  // --- Operações de Estrutura ---
  const handleAddCourse = (e) => {
    e.preventDefault();
    if (!newCourseName.trim()) return;

    const newCourse = {
      id: `course-${Date.now()}`,
      name: newCourseName.trim(),
      subject: newCourseSubject,
      periods: []
    };

    setStudyStructure({
      ...studyStructure,
      courses: [...studyStructure.courses, newCourse]
    });
    setNewCourseName("");
    showToast(`Curso "${newCourse.name}" adicionado!`);
  };

  const handleAddPeriod = (e, courseId) => {
    e.preventDefault();
    if (!newPeriodName.trim()) return;

    const updatedCourses = studyStructure.courses.map(c => {
      if (c.id === courseId) {
        if (c.periods.some(p => p.name.toUpperCase() === newPeriodName.trim().toUpperCase())) {
          showToast("Este período já existe!");
          return c;
        }
        return {
          ...c,
          periods: [...c.periods, { name: newPeriodName.trim(), videos: [] }]
        };
      }
      return c;
    });

    setStudyStructure({ ...studyStructure, courses: updatedCourses });
    setNewPeriodName("");
    showToast(`Período "${newPeriodName}" adicionado!`);
  };

  const handleAddVideos = (e, courseId, periodName) => {
    e.preventDefault();
    if (!newVideoText.trim()) return;

    const videosToAdd = newVideoText
      .split("\n")
      .map(v => v.trim())
      .filter(v => v.length > 0);

    if (videosToAdd.length === 0) return;

    const updatedCourses = studyStructure.courses.map(c => {
      if (c.id === courseId) {
        const updatedPeriods = c.periods.map(p => {
          if (p.name === periodName) {
            const uniqueNewVideos = videosToAdd.filter(v => !p.videos.includes(v));
            return {
              ...p,
              videos: [...p.videos, ...uniqueNewVideos]
            };
          }
          return p;
        });
        return { ...c, periods: updatedPeriods };
      }
      return c;
    });

    setStudyStructure({ ...studyStructure, courses: updatedCourses });
    setNewVideoText("");
    showToast(`${videosToAdd.length} vídeo(s) adicionado(s)!`);
  };

  const handleAddManualItem = (e, manualId) => {
    e.preventDefault();
    if (!newManualItem.trim()) return;

    const updatedManual = studyStructure.manual.map(m => {
      if (m.id === manualId) {
        if (m.items.includes(newManualItem.trim())) {
          showToast("Este item já existe!");
          return m;
        }
        return {
          ...m,
          items: [...m.items, newManualItem.trim()]
        };
      }
      return m;
    });

    setStudyStructure({ ...studyStructure, manual: updatedManual });
    setNewManualItem("");
    showToast("Item adicionado com sucesso!");
  };

  const handleDeleteCourse = (courseId, courseName) => {
    if (!confirm(`Deseja realmente remover o curso "${courseName}"?`)) return;
    setStudyStructure({
      ...studyStructure,
      courses: studyStructure.courses.filter(c => c.id !== courseId)
    });
    setNavigation({ view: 'home', subjectName: null, courseId: null, periodName: null });
    showToast("Curso removido!");
  };

  const handleDeletePeriod = (courseId, periodName) => {
    if (!confirm(`Deseja realmente remover o período "${periodName}"?`)) return;
    const updatedCourses = studyStructure.courses.map(c => {
      if (c.id === courseId) {
        return {
          ...c,
          periods: c.periods.filter(p => p.name !== periodName)
        };
      }
      return c;
    });
    setStudyStructure({ ...studyStructure, courses: updatedCourses });
    setNavigation(prev => ({ ...prev, view: 'subject', periodName: null }));
    showToast("Período removido!");
  };

  const handleDeleteVideo = (courseId, periodName, videoName) => {
    if (!confirm(`Remover aula: "${videoName}"?`)) return;
    const updatedCourses = studyStructure.courses.map(c => {
      if (c.id === courseId) {
        const updatedPeriods = c.periods.map(p => {
          if (p.name === periodName) {
            return {
              ...p,
              videos: p.videos.filter(v => v !== videoName)
            };
          }
          return p;
        });
        return { ...c, periods: updatedPeriods };
      }
      return c;
    });
    setStudyStructure({ ...studyStructure, courses: updatedCourses });
    showToast("Aula removida!");
  };

  const handleRenameVideo = (courseId, periodName, oldName, newName) => {
    newName = newName.trim();
    if (!newName || newName === oldName) { setEditingVideo(null); return; }
    // Verifica duplicata
    const course = studyStructure.courses.find(c => c.id === courseId);
    const period = course?.periods?.find(p => p.name === periodName);
    if (period?.videos?.includes(newName)) {
      showToast('Já existe uma aula com esse nome!');
      return;
    }
    // Atualiza o nome na estrutura
    const updatedCourses = studyStructure.courses.map(c => {
      if (c.id !== courseId) return c;
      return {
        ...c,
        periods: c.periods.map(p => {
          if (p.name !== periodName) return p;
          return { ...p, videos: p.videos.map(v => v === oldName ? newName : v) };
        })
      };
    });
    // Migra chave de progresso (completedKeys)
    if (course) {
      const oldKey = `${course.name}/${periodName}/${oldName}`;
      const newKey = `${course.name}/${periodName}/${newName}`;
      if (completedKeys[oldKey] !== undefined) {
        const next = { ...completedKeys, [newKey]: completedKeys[oldKey] };
        delete next[oldKey];
        setCompletedKeys(next);
      }
    }
    setStudyStructure({ ...studyStructure, courses: updatedCourses });
    setEditingVideo(null);
    showToast('Aula renomeada com sucesso!');
  };

  const handleDeleteManualItem = (manualId, itemName) => {
    if (!confirm(`Remover item "${itemName}"?`)) return;
    const updatedManual = studyStructure.manual.map(m => {
      if (m.id === manualId) {
        return {
          ...m,
          items: m.items.filter(i => i !== itemName)
        };
      }
      return m;
    });
    setStudyStructure({ ...studyStructure, manual: updatedManual });
    showToast("Item removido!");
  };

  // --- Navegação ---
  const handleSubjectClick = (subject) => {
    if (subject === "Exercícios" || subject === "Simulados") {
      const manualObj = studyStructure.manual.find(m => m.subject === subject);
      setNavigation({
        view: 'manual',
        subjectName: subject,
        courseId: manualObj ? manualObj.id : null,
        periodName: null
      });
    } else {
      setNavigation({
        view: 'subject',
        subjectName: subject,
        courseId: null,
        periodName: null
      });
    }
  };

  const handleCourseClick = (courseId) => {
    setNavigation(prev => ({
      ...prev,
      view: 'course',
      courseId: courseId
    }));
  };

  const handlePeriodClick = (periodName) => {
    setNavigation(prev => ({
      ...prev,
      view: 'period',
      periodName: periodName
    }));
  };

  const handleBack = () => {
    if (navigation.view === 'period') {
      setNavigation(prev => ({ ...prev, view: 'course', periodName: null }));
    } else if (navigation.view === 'course') {
      setNavigation(prev => ({ ...prev, view: 'subject', courseId: null }));
    } else if (navigation.view === 'subject' || navigation.view === 'manual') {
      setNavigation({ view: 'home', subjectName: null, courseId: null, periodName: null });
    }
  };

  const makeVideoUrl = (courseName, periodName, videoName) => {
    const drive = driveLetter ? `${driveLetter}:` : 'E:';
    // Encodar cada segmento separadamente; '/' dentro do nome indica subpasta — não deve ser codificado
    const encodedCourse = encodeURIComponent(courseName);
    const encodedPeriod = encodeURIComponent(periodName);
    // O videoName pode conter '/' para indicar subpasta — encodar só cada sub-segmento
    const encodedVideo  = videoName.split('/').map(s => encodeURIComponent(s)).join('/');
    return `file:///${drive}/Video%20aulas/AA/${encodedCourse}/${encodedPeriod}/${encodedVideo}`;
  };

  const copyToClipboard = (text) => {
    let cleanText = text;
    if (cleanText.startsWith('file:///')) {
      cleanText = cleanText.substring(8);
      cleanText = decodeURIComponent(cleanText);
      cleanText = cleanText.replace(/\//g, '\\');
    }
    navigator.clipboard.writeText(cleanText)
      .then(() => showToast("📋 Caminho copiado! Cole no Explorer/VLC."))
      .catch(() => showToast("❌ Erro ao copiar."));
  };

  // Resolvers de visualização atual
  const currentCourse = useMemo(() => {
    if (!navigation.courseId) return null;
    return studyStructure.courses.find(c => c.id === navigation.courseId);
  }, [studyStructure, navigation.courseId]);

  const currentPeriod = useMemo(() => {
    if (!currentCourse || !navigation.periodName) return null;
    return currentCourse.periods.find(p => p.name === navigation.periodName);
  }, [currentCourse, navigation.periodName]);

  const currentManual = useMemo(() => {
    if (navigation.view !== 'manual') return null;
    return studyStructure.manual.find(m => m.subject === navigation.subjectName);
  }, [studyStructure, navigation]);

  const filteredCourses = useMemo(() => {
    if (navigation.view !== 'subject') return [];
    return studyStructure.courses.filter(c => c.subject === navigation.subjectName);
  }, [studyStructure, navigation.subjectName, navigation.view]);

  // --- Renderizações parciais ---
  const renderHome = () => {
    return (
      <div className="fade-in space-y-8 mt-6">
        <div>
          <h2 className="text-xl font-bold font-outfit text-slate-300 mb-6 flex items-center gap-2">
            <VideoIcons.Anchor /> Matérias de Estudo
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
            {Object.keys(VIDEO_SUBJECT_METADATA).map(subject => {
              const meta = VIDEO_SUBJECT_METADATA[subject];
              const SubjectIcon = meta.icon;
              const stat = stats.subjectStats[subject] || { total: 0, completed: 0 };
              const percent = getPercent(stat.completed, stat.total);

              return (
                <button
                  key={subject}
                  onClick={() => handleSubjectClick(subject)}
                  className={`text-left p-5 rounded-2xl border transition-all duration-300 group hover:-translate-y-1 ${meta.border} ${meta.bg} hover:border-blue-500/40 hover:shadow-lg hover:shadow-blue-500/5`}
                  style={{ background: 'rgba(30,41,59,0.3)' }}
                >
                  <div className="flex items-center justify-between mb-4">
                    <div className={`p-3 rounded-xl bg-slate-800/80 text-white ${meta.text} shadow-inner`}>
                      <SubjectIcon />
                    </div>
                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                      {stat.completed}/{stat.total} Aulas
                    </span>
                  </div>
                  
                  <h3 className="text-lg font-bold font-outfit text-slate-100 group-hover:text-white transition-colors duration-200">
                    {subject}
                  </h3>
                  
                  <div className="mt-5">
                    <div className="flex justify-between items-center text-sm mb-1.5">
                      <span className="text-slate-400">Progresso</span>
                      <span className={`font-bold ${meta.text}`}>{percent}%</span>
                    </div>
                    <div className="w-full bg-slate-900/80 rounded-full h-2 overflow-hidden p-[1px] border border-slate-800/40">
                      <div 
                        className={`h-full rounded-full bg-gradient-to-r ${meta.color} transition-all duration-500`}
                        style={{ width: `${percent}%` }}
                      ></div>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <div className="glass-card p-6 rounded-2xl">
          <h3 className="text-lg font-bold font-outfit text-slate-200 mb-4 flex items-center gap-2">
            <VideoIcons.Plus /> Cadastrar Novo Curso / Professor
          </h3>
          <form onSubmit={handleAddCourse} className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Nome do Curso / Professor</label>
              <input
                type="text"
                required
                placeholder="Ex: CMN - Ailson"
                value={newCourseName}
                onChange={(e) => setNewCourseName(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Matéria Vinculada</label>
              <select
                value={newCourseSubject}
                onChange={(e) => setNewCourseSubject(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors"
              >
                {Object.keys(VIDEO_SUBJECT_METADATA)
                  .filter(s => s !== "Exercícios" && s !== "Simulados")
                  .map(s => (
                    <option key={s} value={s}>{s}</option>
                ))}
              </select>
            </div>
            <button
              type="submit"
              className="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-6 py-3 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98]"
            >
              <VideoIcons.Plus /> Adicionar Curso
            </button>
          </form>
        </div>
      </div>
    );
  };

  const renderSubject = () => {
    const meta = VIDEO_SUBJECT_METADATA[navigation.subjectName] || VIDEO_SUBJECT_METADATA["Conhecimento Militar Naval"];
    const SubjectIcon = meta.icon;
    const stat = stats.subjectStats[navigation.subjectName] || { total: 0, completed: 0 };
    const percent = getPercent(stat.completed, stat.total);

    return (
      <div className="fade-in space-y-6 mt-6">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <button 
            onClick={handleBack} 
            className="flex items-center gap-2 text-slate-400 hover:text-white text-sm bg-slate-900 border border-slate-800/80 px-4 py-2 rounded-xl transition-all self-start"
          >
            <VideoIcons.ChevronLeft /> Voltar para Início
          </button>
          <div className="text-xs text-slate-500 font-bold uppercase tracking-wider flex items-center gap-2">
            Matérias <VideoIcons.ChevronRight /> <span className={meta.text}>{navigation.subjectName}</span>
          </div>
        </div>

        <div className="glass-card p-6 rounded-2xl flex flex-col md:flex-row items-center gap-6 justify-between">
          <div className="flex items-center gap-4">
            <div className={`p-4 rounded-2xl ${meta.bg} ${meta.text}`}>
              <SubjectIcon />
            </div>
            <div>
              <h1 className="text-2xl font-bold font-outfit text-white">{navigation.subjectName}</h1>
              <p className="text-sm text-slate-400">Progresso Geral nesta Matéria</p>
            </div>
          </div>
          
          <div className="w-full md:w-80">
            <div className="flex justify-between items-center text-sm mb-2">
              <span className="text-slate-400 font-bold">{stat.completed} de {stat.total} aulas concluídas</span>
              <span className={`font-black ${meta.text}`}>{percent}%</span>
            </div>
            <div className="w-full bg-slate-950 rounded-full h-3 p-[1px] border border-slate-800">
              <div 
                className={`h-full rounded-full bg-gradient-to-r ${meta.color} transition-all duration-500`}
                style={{ width: `${percent}%` }}
              ></div>
            </div>
          </div>

          <div className="flex items-center gap-3 mt-2 flex-wrap">
            <p className="text-slate-400 text-sm">Acompanhamento e controle de progresso das aulas e conteúdos.</p>
            
            <div className="flex items-center gap-1.5 bg-slate-900/80 px-2.5 py-1 rounded-lg border border-slate-800/80 text-xs">
              <span className="text-slate-400 font-bold">Disco:</span>
              <input
                type="text"
                maxLength="1"
                value={driveLetter}
                onChange={(e) => handleDriveChange(e.target.value)}
                className="w-7 bg-slate-950 border border-slate-800 rounded px-1.5 py-0.5 text-center font-bold text-indigo-400 focus:outline-none focus:border-indigo-500 uppercase"
                title="Letra da unidade de disco (ex: E, D, C) onde os vídeos estão salvos"
              />
              <span className="text-slate-500 font-semibold">:\Video aulas\AA</span>
            </div>

            <button 
              onClick={async () => {
                if (confirm("Deseja redefinir a estrutura para o padrão dos arquivos locais? (Isso atualizará a lista de pastas e arquivos ocultando metadados, sem apagar suas marcações de concluído)")) {
                  setStudyStructure(DEFAULT_STUDY_STRUCTURE);
                  showToast("Estrutura redefinida para o padrão local!");
                }
              }}
              className="text-xs bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800/80 px-2.5 py-1 rounded-lg transition-all"
            >
              🔄 Recarregar Estrutura Local
            </button>
          </div>
        </div>
        
        <div className="glass-card px-6 py-4 rounded-2xl flex items-center gap-6">
          <div className="space-y-1">
            <div className="text-xs text-slate-500 font-bold uppercase tracking-wider font-outfit">Progresso Geral</div>
            <div className="flex items-baseline gap-1.5">
              <span className="text-3xl font-black font-outfit text-slate-100">{stats.percentAll}%</span>
              <span className="text-xs text-slate-400 font-medium">({stats.completedAll}/{stats.totalAll} Concluídos)</span>
            </div>
          </div>
          <div className="w-24 md:w-32 bg-slate-950 rounded-full h-3 p-[1px] border border-slate-800">
            <div 
              className="h-full rounded-full bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 shadow-[0_0_8px_rgba(99,102,241,0.5)] transition-all duration-500"
              style={{ width: `${stats.percentAll}%` }}
            ></div>
          </div>
        </div>
      </header>

      <div>
        {navigation.view === 'home' && renderHome()}
        {navigation.view === 'subject' && renderSubject()}
        {navigation.view === 'course' && renderCourse()}
        {navigation.view === 'period' && renderPeriod()}
        {navigation.view === 'manual' && renderManual()}
      </div>

      {toastMsg && (
        <div className="fixed bottom-16 right-6 bg-slate-900 border border-slate-700/80 text-slate-200 px-4.5 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-2.5 text-sm animate-bounce">
          <span>{toastMsg}</span>
        </div>
      )}
    </div>
  );
}

// Root criado uma única vez
let __appRoot = null;
function renderApp() {
  if (!__appRoot) {
    __appRoot = ReactDOM.createRoot(document.getElementById('root'));
  }
  __appRoot.render(<App />);
}

// Aguarda Firebase carregar, depois inicializa (guard contra dupla execução)
let __firebaseInited = false;
function initFirebase() {
  if (typeof firebase === 'undefined') {
    setTimeout(initFirebase, 50);
    return;
  }
  if (__firebaseInited) return;
  __firebaseInited = true;

  const firebaseConfig = {
    apiKey: "AIzaSyBR3MoezjKyBdnasY9asVqdxD3nMtoS44Q",
    authDomain: "cronogram-de-estudos.firebaseapp.com",
    databaseURL: "https://cronogram-de-estudos-default-rtdb.firebaseio.com",
    projectId: "cronogram-de-estudos",
    storageBucket: "cronogram-de-estudos.firebasestorage.app",
    messagingSenderId: "742013544348",
    appId: "1:742013544348:web:e27311a9b16a18a9ca4a59"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  window.db   = firebase.database();
  
  const isLocalFile = window.location.protocol === 'file:';
  
  if (!isLocalFile) {
    window.auth = firebase.auth();
    window.googleProvider = new firebase.auth.GoogleAuthProvider();
    window.loginGoogle = function() {
      window.auth.signInWithPopup(window.googleProvider)
        .then(function(r){ console.log("LOGADO:", r.user.displayName); })
        .catch(function(e){ console.error("ERRO LOGIN:", e); alert("Erro: " + e.message); });
    };
  } else {
    // Mock do Firebase Auth para rodar localmente sem erros
    window.auth = {
      currentUser: null,
      signOut: async function() {
        console.log("Mock SignOut");
      },
      onAuthStateChanged: function(callback) {
        setTimeout(function() { callback(null); }, 10);
        return function() {};
      },
      getRedirectResult: function() {
        return Promise.resolve(null);
      }
    };
    window.loginGoogle = function() {
      // Tratado pela UI local
    };
  }

  let uid = localStorage.getItem('_uid');
  if (!uid) {
    uid = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    localStorage.setItem('_uid', uid);
  }
  window._uid = uid;

  // Renderiza o app imediatamente — não depende de auth
  renderApp();
  
  if (!isLocalFile) {
    window.auth.getRedirectResult().then(function(r){if(r&&r.user)console.log("Redirect OK:",r.user.displayName);}).catch(function(e){if(e.code!=="auth/no-current-user")console.error("Redirect error:",e);});

    // Auth apenas atualiza o UID e notifica o React
    window.auth.onAuthStateChanged(function(user) {
      console.log("USER:", user);
      if (user) {
        window._uid = user.uid;
        localStorage.setItem('_uid', user.uid);
      }
      window.dispatchEvent(new CustomEvent('authStateChanged', { detail: user }));
    });
  } else {
    // Modo local emite evento padrão para a UI inicializar
    setTimeout(function() {
      window.dispatchEvent(new CustomEvent('authStateChanged', { detail: null }));
    }, 20);
  }
}

initFirebase();
</script>
