// ─── AUDIO GENERATOR (WEB AUDIO API) ─────────────────────────
function createWhiteNoise(ctx) {
  const bufferSize = 2 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  return source;
}

function createPinkNoise(ctx) {
  const bufferSize = 4 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
    data[i] *= 0.11;
    b6 = white * 0.115926;
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  return source;
}

function createRain(ctx) {
  const pink = createPinkNoise(ctx);
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1000;
  filter.Q.value = 1.0;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 150;
  
  pink.connect(filter);
  filter.connect(hp);
  
  return {
    source: pink,
    connect: (dest) => hp.connect(dest),
    disconnect: () => {
      try {
        pink.disconnect();
        filter.disconnect();
        hp.disconnect();
      } catch(e){}
    },
    start: () => pink.start(0),
    stop: () => { try { pink.stop(); } catch(e) {} }
  };
}

function createBinauralBeats(ctx) {
  const oscL = ctx.createOscillator();
  const oscR = ctx.createOscillator();
  oscL.frequency.value = 100;
  oscR.frequency.value = 105;
  oscL.type = 'sine';
  oscR.type = 'sine';
  const pannerL = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const pannerR = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const gain = ctx.createGain();
  gain.gain.value = 0.5;
  if (pannerL && pannerR) {
    pannerL.pan.value = -1;
    pannerR.pan.value = 1;
    oscL.connect(pannerL);
    pannerL.connect(gain);
    oscR.connect(pannerR);
    pannerR.connect(gain);
  } else {
    oscL.connect(gain);
    oscR.connect(gain);
  }
  return {
    connect: (dest) => gain.connect(dest),
    disconnect: () => {
      try {
        oscL.disconnect();
        oscR.disconnect();
        if (pannerL) pannerL.disconnect();
        if (pannerR) pannerR.disconnect();
        gain.disconnect();
      } catch(e){}
    },
    start: () => { oscL.start(0); oscR.start(0); },
    stop: () => { try { oscL.stop(); oscR.stop(); } catch(e) {} }
  };
}

const FocusSounds = {
  ctx: null,
  gain: null,
  activeNode: null,
  currentType: null,
  volume: 0.3,
  listeners: new Set(),

  subscribe(listener) {
    this.listeners.add(listener);
    return () => this.listeners.delete(listener);
  },

  notify() {
    this.listeners.forEach(l => l({
      currentType: this.currentType,
      volume: this.volume,
      isPlaying: !!this.currentType
    }));
  },

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = this.volume;
    this.gain.connect(this.ctx.destination);
  },

  play(type) {
    try {
      this.init();
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.stop();

      let node;
      if (type === 'pink') {
        node = createPinkNoise(this.ctx);
        node.connect(this.gain);
        node.start(0);
        this.activeNode = node;
      } else if (type === 'white') {
        node = createWhiteNoise(this.ctx);
        node.connect(this.gain);
        node.start(0);
        this.activeNode = node;
      } else if (type === 'rain') {
        node = createRain(this.ctx);
        node.connect(this.gain);
        node.start();
        this.activeNode = node;
      } else if (type === 'binaural') {
        node = createBinauralBeats(this.ctx);
        node.connect(this.gain);
        node.start();
        this.activeNode = node;
      }
      this.currentType = type;
      this.notify();
    } catch (e) {
      console.error("Erro de áudio:", e);
    }
  },

  stop() {
    if (this.activeNode) {
      try {
        this.activeNode.stop();
        this.activeNode.disconnect();
      } catch (e) {}
      this.activeNode = null;
    }
    this.currentType = null;
    this.notify();
  },

  setVolume(vol) {
    this.volume = vol;
    if (this.gain) {
      this.gain.gain.value = vol;
    }
    this.notify();
  }
};

function useFocusSounds() {
  const [state, setState] = useState({
    currentType: FocusSounds.currentType,
    volume: FocusSounds.volume,
    isPlaying: !!FocusSounds.currentType
  });
  useEffect(() => {
    return FocusSounds.subscribe(setState);
  }, []);
  return {
    ...state,
    play: (type) => FocusSounds.play(type),
    stop: () => FocusSounds.stop(),
    setVolume: (v) => FocusSounds.setVolume(v)
  };
}

const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return[h,m,sc].map(n=>String(n).padStart(2,'0')).join(':');};
const fmtMM=s=>fmt(s).slice(3);

// ─── useLS HOOK ───────────────────────────────────────────────
function useLS(key,init,v=null){
  const[val,setVal]=useState(()=>{
    try{const r=localStorage.getItem(key);if(r===null)return init;const p=JSON.parse(r);if(v&&!v(p))return init;return p;}catch{return init;}
  });
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(val));}catch{}},[key,val]);
  return[val,setVal];
}

// ─── useCRON HOOK ─────────────────────────────────────────────
function useCron(saved,onSave,onReg){
  const[tempos,setTempos]=useState(saved);
  const[ativo,setAtivo]=useState(null);
  const[segs,setSegs]=useState(0);
  const[dIni,setDIni]=useState(null);
  // Sincroniza tempos internos quando o Firebase atualizar tSaved externamente (deep compare)
  const prevSaved=useRef(saved);
  const fromFirebaseRef=useRef(false); // flag: mudança veio do Firebase (não dispara onSave)
  const mountedRef=useRef(false);      // flag: evita onSave no mount inicial
  useEffect(()=>{
    if(JSON.stringify(saved)!==JSON.stringify(prevSaved.current)){
      prevSaved.current=saved;
      fromFirebaseRef.current=true; // marca que a mudança veio do Firebase
      setTempos(prev=>{
        const merged={...saved};
        return merged;
      });
    }
  },[saved]);
  useEffect(()=>{
    if(!mountedRef.current){mountedRef.current=true;return;} // pula mount inicial
    if(fromFirebaseRef.current){fromFirebaseRef.current=false;return;} // pula se veio do Firebase
    onSave(tempos); // só salva quando o usuário realmente alterou (parou/resetou timer)
  },[tempos]);
  useEffect(()=>{if(!ativo)return;const t=setInterval(()=>setSegs(p=>p+1),1000);return()=>clearInterval(t);},[ativo]);
  const iniciar=useCallback((sem,mid)=>{
    const k=`${sem}-${mid}`;
    if(ativo===k){
      const add=Math.max(0,segs-(tempos[k]||0));
      setTempos(p=>({...p,[k]:segs}));onReg(add,dIni||hoje());
      setAtivo(null);setSegs(0);setDIni(null);
    }else{
      if(ativo){const add=Math.max(0,segs-(tempos[ativo]||0));setTempos(p=>({...p,[ativo]:segs}));onReg(add,dIni||hoje());}
      setSegs(tempos[k]||0);setAtivo(k);setDIni(hoje());
    }
  },[ativo,segs,tempos,dIni,onReg]);
  const resetar=useCallback((sem,mid,e)=>{
    e?.stopPropagation();const k=`${sem}-${mid}`;
    setTempos(p=>{const n={...p};delete n[k];return n;}); // remove tempo salvo
    if(ativo===k){setAtivo(null);setSegs(0);setDIni(null);}
  },[ativo]);
  const getTempo=useCallback((sem,mid)=>{const k=`${sem}-${mid}`;return ativo===k?segs:(tempos[k]||0);},[ativo,segs,tempos]);
  const getTotal=useCallback((mid)=>{
    let t=0;Object.entries(tempos).forEach(([k,v])=>{if(k.split('-').slice(1).join('-')===mid)t+=v;});
    if(ativo&&ativo.split('-').slice(1).join('-')===mid)t+=segs-(tempos[ativo]||0);
    return t;
  },[tempos,ativo,segs]);
  return{tempos,ativo,segs,iniciar,resetar,getTempo,getTotal};
}

// ─── usePOMO HOOK ─────────────────────────────────────────────
function usePomo(rodIni,onSave){
  const[at,setAt]=useState(false);const[seg,setSeg]=useState(25*60);
  const[tipo,setTipo]=useState('estudo');const[rod,setRod]=useState(rodIni);
  const tRef=useRef(tipo);useEffect(()=>{tRef.current=tipo;},[tipo]);
  useEffect(()=>{onSave(rod);},[rod]);
  useEffect(()=>{
    if(!at)return;
    const som=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)();[[880,0],[1100,.15],[880,.3]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.3;o.start(c.currentTime+d);o.stop(c.currentTime+d+.15);});}catch{}};
    const t=setInterval(()=>setSeg(p=>{if(p<=1){som();if(tRef.current==='estudo'){setRod(r=>r+1);setTipo('pausa');setAt(false);return 5*60;}else{setTipo('estudo');setAt(false);return 25*60;}}return p-1;}),1000);
    return()=>clearInterval(t);
  },[at]);
  return{at,seg,tipo,rod,iniciar:()=>setAt(true),pausar:()=>setAt(false),resetar:()=>{setAt(false);setTipo('estudo');setSeg(25*60);}};
}

// ─── CHARTS ───────────────────────────────────────────────────
function BarChart({ reg }) {
  const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const dados = useMemo(() => {
    const res = [];
    const hojeDate = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(hojeDate.getDate() - i);
      const ch = d.toISOString().split('T')[0];
      const s = reg[ch] || 0;
      const h = s / 3600;
      const diaLabel = diasSemana[d.getDay()];
      res.push({ label: diaLabel, horas: h });
    }
    return res;
  }, [reg]);

  const maxHoras = Math.max(2, ...dados.map(d => d.horas));
  const height = 130;
  const width = 320;
  const padding = { top: 15, right: 10, bottom: 20, left: 30 };
  const graphHeight = height - padding.top - padding.bottom;
  const graphWidth = width - padding.left - padding.right;
  const barWidth = 22;
  const barGap = (graphWidth - barWidth * dados.length) / (dados.length - 1);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto">
      <defs>
        <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#60a5fa" />
          <stop offset="100%" stopColor="#2563eb" />
        </linearGradient>
      </defs>
      {[0, 0.5, 1].map((p, i) => {
        const y = padding.top + graphHeight * (1 - p);
        const val = (maxHoras * p).toFixed(1) + 'h';
        return (
          <g key={i}>
            <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="rgba(255,255,255,0.08)" strokeDasharray="2 2" />
            <text x={padding.left - 5} y={y + 3} fill="rgba(255,255,255,0.4)" fontSize="8" textAnchor="end">{val}</text>
          </g>
        );
      })}
      {dados.map((d, i) => {
        const barHeight = (d.horas / maxHoras) * graphHeight;
        const x = padding.left + i * (barWidth + barGap);
        const y = padding.top + graphHeight - barHeight;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barWidth} height={Math.max(2, barHeight)} rx="3" fill="url(#barGrad)" />
            {d.horas > 0 && (
              <text x={x + barWidth / 2} y={y - 3} fill="#93c5fd" fontSize="8" fontWeight="bold" textAnchor="middle">
                {d.horas.toFixed(1)}
              </text>
            )}
            <text x={x + barWidth / 2} y={height - 5} fill="rgba(255,255,255,0.5)" fontSize="8" textAnchor="middle">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function DonutChart({ dados }) {
  const total = useMemo(() => dados.reduce((a, d) => a + d.val, 0), [dados]);
  const processados = useMemo(() => {
    let acc = 0;
    return dados.map(d => {
      const pct = total > 0 ? (d.val / total) : 0;
      const angle = pct * 360;
      const startAngle = acc;
      acc += angle;
      return { ...d, pct, startAngle };
    });
  }, [dados, total]);

  const cores = ['#60a5fa', '#34d399', '#a78bfa', '#fbbf24', '#f87171', '#2dd4bf', '#f472b6'];

  if (total === 0) return <div className="text-center py-4 text-xs text-white/40 font-medium">Sem dados de tempo.</div>;

  let cumPercent = 0;
  return (
    <div className="flex items-center gap-6 py-2">
      <svg viewBox="0 0 120 120" className="w-24 h-24 shrink-0">
        <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="12" />
        {processados.map((d, i) => {
          if (d.pct === 0) return null;
          const r = 45;
          const circ = 2 * Math.PI * r;
          const strokeLength = d.pct * circ;
          const strokeOffset = circ - (cumPercent * circ);
          cumPercent += d.pct;
          const cor = cores[i % cores.length];
          return (
            <circle
              key={i}
              cx="60"
              cy="60"
              r={r}
              fill="none"
              stroke={cor}
              strokeWidth="12"
              strokeDasharray={`${strokeLength} ${circ}`}
              strokeDashoffset={strokeOffset}
              transform="rotate(-90 60 60)"
            />
          );
        })}
        <circle cx="60" cy="60" r="38" fill="#1e293b" />
      </svg>
      <div className="flex-1 space-y-1.5">
        {processados.map((d, i) => {
          if (d.pct === 0) return null;
          const cor = cores[i % cores.length];
          return (
            <div key={i} className="flex items-center justify-between text-[10px]">
              <div className="flex items-center gap-1.5 text-white/80 truncate">
                <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: cor }} />
                <span className="truncate">{d.label}</span>
              </div>
              <span className="font-semibold text-white/50 text-[9px]">{(d.pct * 100).toFixed(0)}%</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function InterleavingSugestao({S}){

  const fase=FASES[cfg.f]||FASES[0];
  const temposHoje=useMemo(()=>{
    const t={};
    fase.materias.forEach(mat=>{t[mat.id]=cron.tempos[`${semanaAtual}-${mat.id}`]||0;});
    return t;
  },[cron.tempos,semanaAtual,fase]);
  const analise=useMemo(()=>{
    const dados=fase.materias.map(mat=>({...mat,tempo:temposHoje[mat.id]||0,meta:mat.horas*3600,pct:mat.horas>0?(temposHoje[mat.id]||0)/(mat.horas*3600):0}));
    if(dados.length<2)return null;
    const maisEstudada=[...dados].sort((a,b)=>b.tempo-a.tempo)[0];
    const menosEstudada=[...dados].sort((a,b)=>a.pct-b.pct)[0];
    if(maisEstudada.id===menosEstudada.id||maisEstudada.tempo<1800)return null;
    return{maisEstudada,menosEstudada};
  },[temposHoje,fase]);
  const[dispensado,setDispensado]=useState(false);
  if(!analise||dispensado)return null;
  return(
    <div className="rounded-2xl p-3 border slide-in" style={{background:'rgba(139,92,246,0.08)',borderColor:'rgba(139,92,246,0.3)'}}>

            <p className="text-[11px] text-white/60 mt-0.5 leading-snug">
              Você focou em <span className="text-white font-medium">{analise.maisEstudada.nome}</span> ({(analise.maisEstudada.tempo/3600).toFixed(1)}h).
              Alterne para <span className="text-purple-300 font-semibold">{analise.menosEstudada.nome}</span>!
            </p>
          </div>
        </div>
        <button onClick={()=>setDispensado(true)} style={{color:'rgba(255,255,255,0.2)',fontSize:14,flexShrink:0}}>✕</button>

}

// ─── QUIZ ACTIVE RECALL ───────────────────────────────────────
function QuizView({S}){
  const{flashcards,setFlashcards}=S;
  const[fase,setFase]=useState('selecao');
  const[deckSel,setDeckSel]=useState('');
  const[qtde,setQtde]=useState(5);
  const[questoes,setQuestoes]=useState([]);
  const[idx,setIdx]=useState(0);
  const[mostrarVerso,setMostrarVerso]=useState(false);
  const[respostas,setRespostas]=useState([]);
  const[tempoInicio,setTempoInicio]=useState(null);
  const[tempoFim,setTempoFim]=useState(null);
  const decksDisp=useMemo(()=>{
    const d={};
    flashcards.forEach(c=>{if(!d[c.materia])d[c.materia]={id:c.materia,nome:CONTEUDOS[c.materia]?.nome||c.materia,total:0};d[c.materia].total++;});
    return Object.values(d);
  },[flashcards]);
  const iniciarQuiz=()=>{
    const pool=deckSel?flashcards.filter(c=>c.materia===deckSel):flashcards;
    if(!pool.length){alert('Nenhum flashcard disponível!');return;}
    const embaralhado=[...pool].sort(()=>Math.random()-0.5).slice(0,Math.min(qtde,pool.length));
    setQuestoes(embaralhado);setIdx(0);setMostrarVerso(false);setRespostas([]);setTempoInicio(Date.now());setTempoFim(null);setFase('quiz');
  };
  const responder=acertou=>{
    const card=questoes[idx];
    const r=calcularSRS(acertou?'good':'again',card.intervalo);
    setFlashcards(p=>p.map(c=>c.id===card.id?{...c,intervalo:r.interval,revisarEm:r.nextReview}:c));
    const novas=[...respostas,acertou];
    setRespostas(novas);
    if(idx+1<questoes.length){setIdx(p=>p+1);setMostrarVerso(false);}
    else{setTempoFim(Date.now());setFase('resultado');}
  };
  const reiniciar=()=>{setFase('selecao');setQuestoes([]);setRespostas([]);};
  const acertos=respostas.filter(Boolean).length;
  const tempoTotal=tempoFim&&tempoInicio?Math.round((tempoFim-tempoInicio)/1000):0;
  return(
    <div className="min-h-screen bg-gradient-to-br from-slate-950 via-purple-950 to-slate-950 p-4 pb-24">
      <div className="max-w-xl mx-auto space-y-4">
        <div className="bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10">
          <h2 className="text-xl font-bold text-purple-400 font-outfit">🧠 Quiz Rápido</h2>
          <p className="text-xs text-white/50 mt-0.5">Active Recall — teste sua memória</p>
        </div>
        {fase==='selecao'&&(
          <div className="space-y-4">
            {flashcards.length===0?(
              <div className="text-center py-12 bg-white/5 border border-white/5 rounded-2xl p-6">
                <div className="text-4xl mb-3">📇</div>
                <h3 className="font-medium text-white/70">Nenhum flashcard ainda</h3>
                <p className="text-xs text-white/40 mt-1">Crie flashcards na aba 📇 para começar.</p>
              </div>
            ):(
              <div className="bg-white/5 border border-white/10 rounded-2xl p-5 space-y-4">
                <h3 className="font-semibold text-white text-sm">Configurar Sessão</h3>
                <div className="space-y-1">
                  <label className="text-xs text-white/50">Deck (matéria)</label>
                  <select value={deckSel} onChange={e=>setDeckSel(e.target.value)}
                    className="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-purple-500">
                    <option value="">🎲 Todos os decks (misto)</option>
                    {decksDisp.map(d=><option key={d.id} value={d.id}>{d.nome} ({d.total})</option>)}
                  </select>
                </div>
                <div className="space-y-1">
                  <label className="text-xs text-white/50">Questões: <span className="text-white font-bold">{qtde}</span></label>
                  <input type="range" min={3} max={Math.min(20,flashcards.length)} value={qtde} onChange={e=>setQtde(Number(e.target.value))}/>
                </div>
                <button onClick={iniciarQuiz} className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-2xl text-sm transition-all shadow-lg shadow-purple-500/20">
                  🚀 Iniciar Quiz
                </button>
              </div>
            )}
            <div className="bg-white/5 border border-white/5 rounded-2xl p-4">
              <h3 className="text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">Como funciona</h3>
              <div className="space-y-2">
                {[['🃏','Veja a frente do flashcard'],['🧠','Tente lembrar a resposta'],['✅','Avalie: acertou ou errou'],['📊','SRS atualiza automaticamente']].map(([ic,txt])=>(
                  <div key={txt} className="flex items-center gap-2 text-xs text-white/50"><span>{ic}</span><span>{txt}</span></div>
                ))}
              </div>
            </div>
          </div>
        )}
        {fase==='quiz'&&questoes.length>0&&(
          <div className="space-y-4">
            <div className="flex justify-between items-center text-xs text-white/40">
              <span>Questão {idx+1}/{questoes.length}</span>
              <div className="flex gap-1">
                {questoes.map((_,i)=><div key={i} style={{width:8,height:8,borderRadius:'50%',background:i<respostas.length?(respostas[i]?'#4ade80':'#f87171'):i===idx?'#a78bfa':'rgba(255,255,255,0.15)'}}/>)}
              </div>
            </div>
            <div className="min-h-[220px] bg-slate-800/80 border border-white/10 rounded-3xl p-6 flex flex-col justify-between shadow-2xl relative overflow-hidden select-none"
              onClick={()=>!mostrarVerso&&setMostrarVerso(true)} style={{cursor:mostrarVerso?'default':'pointer'}}>
              <div className="absolute top-3 right-3 text-xs bg-white/5 text-white/30 px-2 py-0.5 rounded-full">
                {mostrarVerso?'Resposta':'Pergunta — toque para revelar'}
              </div>
              <div className="flex-1 flex flex-col items-center justify-center text-center px-2 py-6 gap-3">
                {!mostrarVerso
                  ?<p className="text-base text-white font-medium whitespace-pre-wrap">{questoes[idx].frente}</p>
                  :<><p className="text-xs text-white/40 mb-1">{questoes[idx].frente}</p><div className="w-full h-px bg-white/10"/><p className="text-base text-green-300 font-semibold whitespace-pre-wrap">{questoes[idx].verso}</p></>
                }
              </div>
            </div>
            {!mostrarVerso
              ?<button onClick={()=>setMostrarVerso(true)} className="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-2xl font-bold transition-all">Revelar Resposta</button>
              :<div className="grid grid-cols-2 gap-3">
                <button onClick={()=>responder(false)} className="bg-red-500/20 hover:bg-red-500/40 border border-red-500/40 text-red-400 hover:text-white py-4 rounded-2xl font-bold text-sm transition-all flex flex-col items-center">
                  <span>❌ Errei</span><span className="text-[10px] opacity-60 font-normal mt-0.5">revisar em breve</span>
                </button>
                <button onClick={()=>responder(true)} className="bg-green-500/20 hover:bg-green-500/40 border border-green-500/40 text-green-400 hover:text-white py-4 rounded-2xl font-bold text-sm transition-all flex flex-col items-center">
                  <span>✅ Acertei</span><span className="text-[10px] opacity-60 font-normal mt-0.5">revisão adiada</span>
                </button>
              </div>
            }
          </div>
        )}
        {fase==='resultado'&&(
          <div className="space-y-4">
            <div className="bg-white/5 border border-white/10 rounded-3xl p-6 text-center space-y-3">
              <div style={{fontSize:56}}>{acertos===questoes.length?'🏆':acertos>=questoes.length*0.7?'🌟':'💪'}</div>
              <h2 className="text-2xl font-bold text-white font-outfit">{acertos}/{questoes.length}</h2>
              <p className="text-white/50 text-sm">acertos em {fmtMM(tempoTotal)}</p>
              <div className="w-full bg-white/10 rounded-full h-3">
                <div className="h-full rounded-full transition-all" style={{width:`${Math.round(acertos/questoes.length*100)}%`,background:acertos===questoes.length?'linear-gradient(90deg,#4ade80,#22c55e)':'linear-gradient(90deg,#a78bfa,#7c3aed)'}}/>
              </div>
              <p className="text-xs text-white/40">{Math.round(acertos/questoes.length*100)}% de aproveitamento</p>
            </div>
            <div className="space-y-2">
              {questoes.map((q,i)=>(
                <div key={q.id} className="rounded-xl px-4 py-3 flex items-start gap-3 text-xs"
                  style={{background:respostas[i]?'rgba(34,197,94,0.08)':'rgba(239,68,68,0.08)',border:`1px solid ${respostas[i]?'rgba(74,222,128,0.2)':'rgba(248,113,113,0.2)'}`}}>
                  <span>{respostas[i]?'✅':'❌'}</span>
                  <div><p className="text-white/70">{q.frente}</p><p className="text-white/40 mt-0.5">{q.verso}</p></div>
                </div>
              ))}
            </div>
            <button onClick={reiniciar} className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-2xl text-sm transition-all">
              🔄 Novo Quiz
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────
function Dashboard({S}){
  const{streak,diasR,tempoTot,totTop,totSem,frase,reg,badges,pomo,cron,proGeral,dispatchUI,dataInicioPlano,setDataInicioPlano,semanaAtual,deficitTotal,deficitPorMateria}=S;
  const h=(tempoTot/3600).toFixed(1);
  const dias=Object.values(reg).filter(v=>v>0).length;
  const med=dias>0?(tempoTot/3600/dias).toFixed(1):'0.0';
  const totB=Object.keys(badges).length;
  const progMat=useMemo(()=>Object.keys(CONTEUDOS).map(id=>{const mat=CONTEUDOS[id];let t=0,c=0;mat.categorias.forEach((cat,ci)=>{cat.topicos.forEach((_,ti)=>{t++;if(S.topC[`${id}-${ci}-${ti}`])c++;});(S.topP[`${id}-${ci}`]||[]).forEach((_,ti)=>{t++;if(S.topC[`${id}-${ci}-custom-${ti}`])c++;});});return{id,nome:mat.nome,pct:t?Math.round(c/t*100):0};}),[S.topC,S.topP]);
  const matT=useMemo(()=>Object.keys(CONTEUDOS).map(id=>({id,nome:CONTEUDOS[id].nome.split(' ')[0],t:cron.getTotal(id)})).filter(m=>m.t>0).sort((a,b)=>b.t-a.t),[cron]);
  const defMats=Object.entries(deficitPorMateria).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const donutDados=useMemo(()=>matT.map(m=>({label:m.nome,val:m.t})),[matT]);

  return(
    <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 p-4 pb-24">
      <div className="max-w-4xl mx-auto space-y-4">
        <div className="bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10 text-center">
          <p className="text-white/80 italic text-sm">"{frase}"</p>
        </div>
        {/* Plano de estudos config */}
        <div className="glass-card rounded-2xl p-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="text-white font-semibold text-sm font-outfit">📅 Plano de Estudos</div>
              {dataInicioPlano
                ?<div className="text-xs mt-1 text-white/50">Início: {new Date(dataInicioPlano+'T12:00:00').toLocaleDateString('pt-BR')} · <span className="text-blue-300 font-semibold">Semana {semanaAtual}/28</span></div>
                :<div className="text-xs mt-1 text-amber-400/80">⚠ Defina a data de início para detectar semana automaticamente</div>
              }
            </div>
            <div className="flex items-center gap-2">
              <input type="date" value={dataInicioPlano||''} onChange={e=>setDataInicioPlano(e.target.value)}
                className="text-xs rounded-xl px-3 py-1.5 outline-none bg-white/10 border border-white/20 text-white" />
              {dataInicioPlano&&<button onClick={()=>dispatchUI({t:'V',p:'cronograma'})}
                className="text-xs px-3 py-1.5 rounded-xl transition-colors bg-blue-500/20 text-blue-300 border border-blue-500/30 hover:bg-blue-500/30">Ir para semana atual →</button>}
            </div>
          </div>
        </div>
        <div className="grid grid-cols-4 gap-3">
          {[
            {v:streak,l:'Streak',sub:'dias seguidos',c:'text-orange-400',ic:'🔥'},
            {v:h+'h',l:'Total',sub:`~${med}h/dia`,c:'text-blue-400',ic:'⏱'},
            {v:totTop,l:'Tópicos ✓',sub:`${totSem} semanas`,c:'text-green-400',ic:'✅'},
            {v:diasR,l:'Dias p/prova',sub:'foco total',c:diasR<=30?'text-red-400':'text-yellow-400',ic:'🚩'},
          ].map((c,i)=>(
            <div key={i} className="glass-card rounded-2xl p-3">
              <div className="text-xl mb-1">{c.ic}</div>
              <div className={`text-xl font-bold font-outfit ${c.c}`}>{c.v}</div>
              <div className="text-white/50 text-xs font-medium">{c.l}</div>
              <div className="text-white/30 text-[10px]">{c.sub}</div>
            </div>
          ))}
        </div>
        <div className="glass-card rounded-2xl p-4">
          <div className="flex justify-between mb-2"><span className="text-white font-semibold font-outfit text-sm">📈 Progresso Geral</span><span className="text-white font-bold text-sm">{proGeral}%</span></div>
          <div className="w-full bg-white/10 rounded-full h-2.5">
            <div className="h-full rounded-full bg-gradient-to-r from-blue-500 to-emerald-500 transition-all duration-700" style={{width:`${proGeral}%`}}/>
          </div>
          <div className="text-white/40 text-[10px] mt-1.5 text-right">{totSem}/28 semanas concluídas</div>
        </div>
        {/* Déficit acumulado */}
        {dataInicioPlano&&semanaAtual>1&&(
          <div className="rounded-2xl p-4 border" style={{background:deficitTotal>0?'rgba(239,68,68,0.08)':'rgba(16,185,129,0.08)',borderColor:deficitTotal>0?'rgba(239,68,68,0.2)':'rgba(16,185,129,0.2)'}}>
            <div className="flex justify-between items-center mb-2">
              <span className="font-semibold text-sm" style={{color:deficitTotal>0?'#fca5a5':'#6ee7b7'}}>
                {deficitTotal>0?'⚠️ Déficit Acumulado':'✅ Em dia com o plano'}
              </span>
              {deficitTotal>0&&<span className="font-bold text-sm" style={{color:'#fca5a5'}}>{(deficitTotal/3600).toFixed(1)}h em atraso</span>}
            </div>
            {deficitTotal>0&&defMats.length>0&&(
              <div className="space-y-1.5 mt-2">
                {defMats.map(([mid,def])=>{
                  const nome=CONTEUDOS[mid]?.nome||mid;
                  const w=Math.min(100,(def/3600/5)*100);
                  return(
                    <div key={mid} className="flex items-center gap-2">
                      <span className="text-[10px] text-white/50 shrink-0 w-24 truncate">{nome}</span>
                      <div className="flex-1 rounded-full h-1.5 bg-white/10">
                        <div className="h-full rounded-full bg-red-400 transition-all" style={{width:`${w}%`}}/>
                      </div>
                      <span className="text-[10px] shrink-0 text-red-300 w-10 text-right">{(def/3600).toFixed(1)}h</span>
                    </div>
                  );
                })}
              </div>
            )}
            {deficitTotal===0&&<p className="text-xs text-white/40">Todas as semanas anteriores com meta atingida 🎉</p>}
          </div>
        )}
        
        {/* Histórico Semanal (SVG Chart) */}
        <div className="glass-card rounded-2xl p-4">
          <h3 className="text-white font-semibold font-outfit text-sm mb-3">📈 Histórico de Estudos (Últimos 7 Dias)</h3>
          <div className="bg-slate-900/50 rounded-xl p-2">
            <BarChart reg={reg} />
          </div>
        </div>

        <div className="grid grid-cols-2 gap-4">
          <div className="glass-card rounded-2xl p-4 flex flex-col justify-between">
            <h3 className="text-white font-semibold font-outfit text-sm mb-3">📚 Progresso por Matéria</h3>
            <div className="space-y-2.5">
              {progMat.map(m=>(
                <div key={m.id}>
                  <div className="flex justify-between text-[10px] mb-1"><span className="text-white/70 truncate mr-2">{m.nome}</span><span className="text-white/50">{m.pct}%</span></div>
                  <div className="w-full bg-white/5 rounded-full h-1.5">
                    <div className="h-full rounded-full bg-blue-500 transition-all" style={{width:`${m.pct}%`}}/>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="glass-card rounded-2xl p-4 flex flex-col justify-between">
            <h3 className="text-white font-semibold font-outfit text-sm mb-3">📊 Tempo por Matéria</h3>
            <DonutChart dados={donutDados} />
          </div>
        </div>
        <MetaDiaria S={S}/>
        <div className="glass-card rounded-2xl p-4">
          <div className="flex items-center justify-between mb-1">
            <h3 className="text-white font-semibold font-outfit text-sm">🎯 Distribuição Real da Prova</h3>
            <span className="text-white/30 text-[10px]">50 questões · dados 2021–2024</span>
          </div>
          <p className="text-white/40 text-[10px] mb-3">Análise de 4 provas reais (NotebookLM). Padrão fixo de distribuição.</p>
          {/* Barra visual da prova toda */}
          <div className="flex rounded-full overflow-hidden mb-3" style={{height:10}}>
            {[
              {id:'militar',  w:40,cor:'#a855f7'},
              {id:'portugues',w:16,cor:'#ef4444'},
              {id:'geografia',w:16,cor:'#f97316'},
              {id:'matematica',w:14,cor:'#f59e0b'},
              {id:'historia', w:14,cor:'#3b82f6'},
            ].map(x=><div key={x.id} style={{width:`${x.w}%`,background:x.cor,transition:'width .5s'}} title={`${MATERIAS_PESO[x.id]?.questoes}q`}/>)}
          </div>
          <div className="flex flex-wrap gap-x-3 gap-y-0.5 mb-3 text-[9px]">
            {[{id:'militar',nome:'Mil-Naval'},{id:'portugues',nome:'Português'},{id:'geografia',nome:'Geografia'},{id:'matematica',nome:'Matemática'},{id:'historia',nome:'História'}].map(x=>{
              const p=MATERIAS_PESO[x.id];
              return <span key={x.id} style={{color:p?.cor}}>■ {x.nome} {p?.pct}%</span>;
            })}
          </div>
          {/* Listagem por matéria */}
          <div className="space-y-2">
            {[
              {id:'militar',   nome:'Mil-Naval'},
              {id:'portugues', nome:'Português'},
              {id:'geografia', nome:'Geografia'},
              {id:'matematica',nome:'Matemática'},
              {id:'historia',  nome:'História'},
            ].map(({id,nome})=>{
              const p=MATERIAS_PESO[id];if(!p||!p.questoes)return null;
              const prog=progMat.find(m=>m.id===id);
              const progPct=prog?prog.pct:0;
              const [open,setOpen]=React.useState(false);
              return(
                <div key={id} className="rounded-xl p-2.5" style={{background:`${p.cor}11`,border:`1px solid ${p.cor}33`}}>
                  <div className="flex items-center gap-2 mb-1.5">
                    <div className="flex-1">
                      <div className="flex justify-between items-baseline">
                        <span className="text-xs font-semibold" style={{color:p.cor}}>{nome}</span>
                        <span className="text-[10px] text-white/40">{p.range} · {p.questoes}q ({p.pct}%)</span>
                      </div>
                      <div className="flex items-center gap-1.5 mt-1">
                        {/* barra de peso da prova */}
                        <div className="rounded-full" style={{height:4,width:`${p.pct*1.8}px`,maxWidth:'60%',background:p.cor,opacity:0.6}}/>
                        {/* barra de progresso do aluno */}
                        <div className="flex-1 rounded-full" style={{height:4,background:'rgba(255,255,255,0.08)'}}>
                          <div className="h-full rounded-full transition-all" style={{width:`${progPct}%`,background:'rgba(255,255,255,0.35)'}}/>
                        </div>
                        <span className="text-[10px] shrink-0" style={{color:p.cor}}>{progPct}%✓</span>
                      </div>
                    </div>
                  </div>
                  {/* tópicos quentes */}
                  {p.quentes?.length>0&&(
                    <div>
                      <button onClick={()=>setOpen(o=>!o)} className="text-[9px] flex items-center gap-1" style={{color:p.cor,opacity:0.7}}>
                        {open?'▾':'▸'} Tópicos mais cobrados
                      </button>
                      {open&&(
                        <div className="mt-1.5 flex flex-wrap gap-1">
                          {p.quentes.map((t,i)=>(
                            <span key={i} className="text-[9px] px-1.5 py-0.5 rounded-full" style={{background:`${p.cor}22`,color:p.cor}}>
                              {t}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <p className="text-white/20 text-[9px] mt-2">✦ Fonte: análise NotebookLM de 4 provas reais (2021–2024). Confirme no edital vigente.</p>
        </div>
        <HabitosDiarios S={S}/>
        <Heatmap reg={reg}/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div className="glass-card rounded-2xl p-4">
            <h3 className="text-white font-semibold font-outfit text-sm mb-2">🍅 Pomodoro</h3>
            <div className="text-3xl font-bold text-white font-outfit">{pomo.rod}</div>
            <div className="text-white/50 text-xs">ciclos · {(pomo.rod*25/60).toFixed(1)}h focadas</div>
          </div>
          <div className="glass-card rounded-2xl p-4">
            <div className="flex justify-between items-start mb-2">
              <h3 className="text-white font-semibold font-outfit text-sm">🏆 Conquistas</h3>
              <button onClick={()=>dispatchUI({t:'V',p:'conquistas'})} className="text-xs text-blue-400 hover:text-blue-300 font-medium">Ver todas →</button>
            </div>
            <div className="text-3xl font-bold text-yellow-400 font-outfit">{totB}/{BADGES.length}</div>
            <div className="flex flex-wrap gap-1 mt-2">
              {BADGES.map(b=><span key={b.id} title={b.nome} className={b.id in badges?'text-xl':'text-xl opacity-20 grayscale'}>{b.ic}</span>)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
// ─── CONQUISTAS ───────────────────────────────────────────────
function Conquistas({S}){
  const{badges,setBadges}=S;
  const tot=Object.keys(badges).length;
  const pct=Math.round(tot/BADGES.length*100);
  const resetOne=id=>{const b=BADGES.find(x=>x.id===id);if(!b||!badges[id])return;let df='';try{df=` (${new Date(badges[id]).toLocaleDateString('pt-BR')})`;}catch{}if(!confirm(`Resetar "${b.nome}"${df}?`))return;setBadges(p=>{const n={...p};delete n[id];return n;});};
  const resetAll=()=>{if(!tot){alert('Nenhuma conquista para resetar.');return;}if(!confirm(`Resetar todas as ${tot} conquistas?`))return;setBadges({});};
  return(
    <div className="min-h-screen bg-gradient-to-br from-yellow-900 to-slate-900 p-4">
      <div className="max-w-4xl mx-auto space-y-4">
        <div className="bg-white bg-opacity-10 rounded-2xl p-5 border border-white border-opacity-20">
          <div className="flex justify-between items-start flex-wrap gap-3">
            <div><h2 className="text-2xl font-bold text-yellow-300">🏆 Conquistas</h2><p className="text-white text-opacity-50 text-sm mt-1">{tot}/{BADGES.length} badges desbloqueados</p></div>
            <button onClick={resetAll} className="text-sm px-3 py-1.5 rounded-xl text-red-300 transition-colors" style={{backgroundColor:'rgba(239,68,68,0.2)'}}>🗑 Resetar Todas</button>
          </div>
          <div className="mt-3">
            <div className="flex justify-between text-xs mb-1" style={{color:'rgba(255,255,255,0.4)'}}><span>Progresso</span><span>{pct}%</span></div>
            <div className="w-full rounded-full" style={{height:8,backgroundColor:'rgba(255,255,255,0.1)'}}>
              <div className="h-full rounded-full transition-all duration-700 bg-gradient-to-r from-yellow-400 to-amber-400" style={{width:`${pct}%`}}/>
            </div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16}}>
          {BADGES.map(b=>{
            const g=!!badges[b.id];let df='';if(g){try{df=new Date(badges[b.id]).toLocaleDateString('pt-BR');}catch{}}
            return(
              <div key={b.id} className="rounded-2xl p-4 border transition-all" style={{
                background:g?'linear-gradient(135deg,rgba(234,179,8,0.3),rgba(245,158,11,0.2))':'rgba(255,255,255,0.05)',
                borderColor:g?'rgba(234,179,8,0.5)':'rgba(255,255,255,0.1)',opacity:g?1:0.5}}>
                <div className="flex justify-between mb-2">
                  <span style={{fontSize:36,filter:g?'none':'grayscale(1)',opacity:g?1:0.4}}>{b.ic}</span>
                  {g&&<button onClick={()=>resetOne(b.id)} style={{color:'rgba(255,255,255,0.2)',fontSize:14}} className="hover:text-red-400 transition-colors">↺</button>}
                </div>
                <div className="font-semibold text-white text-sm">{b.nome}</div>
                <div className="text-xs mt-1 mb-2" style={{color:'rgba(255,255,255,0.4)'}}>{b.desc}</div>
                {g?<div className="text-xs text-yellow-300">✅ {df?`em ${df}`:'Conquistado!'}</div>:<div className="text-xs" style={{color:'rgba(255,255,255,0.25)'}}>🔒 Não desbloqueado</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function SoundControls() {

    { id: 'white', label: '🤍 Branco', desc: 'Ruído foco' },
    { id: 'pink', label: '💖 Rosa', desc: 'Ruído suave' },
    { id: 'rain', label: '🌧️ Chuva', desc: 'Ambiental' },
    { id: 'binaural', label: '🎧 Binaural', desc: '5Hz Theta' }
  ];
  return (
    <div className="mt-4 pt-3 border-t border-gray-700">
      <div className="text-xs text-gray-400 font-semibold mb-2 flex items-center justify-between">
        <span>🔊 Sons de Foco</span>
        {isPlaying && (
          <button type="button" onClick={stop} className="text-red-400 font-medium hover:underline text-[10px]">
            Parar
          </button>
        )}
      </div>
      <div className="grid grid-cols-2 gap-1.5 mb-2">
        {sounds.map(s => (
          <button

            <div className="text-[7px] opacity-60 font-normal">{s.desc}</div>

        ))}

        <span className="text-[8px] text-gray-500">Vol</span>
        <input
          type="range"
          min="0"
          max="1"
          step="0.05"
          value={volume}
          onChange={e => setVolume(parseFloat(e.target.value))}

          {Math.round(volume * 100)}%

    </div>
  );
}

function PomoModal({pomo,onClose}){
  const total=pomo.tipo==='estudo'?25*60:5*60;
  const pct=(total-pomo.seg)/total*100;
  const r=54,circ=2*Math.PI*r,off=circ*(1-pct/100);
  const cor=pomo.tipo==='estudo'?'#34d399':'#60a5fa';
  return(
    <div className="fixed z-50 rounded-2xl p-4 shadow-2xl" style={{bottom:100,right:16,width:240,background:'#111827',border:'1px solid #374151'}}>
      <div className="flex justify-between items-center mb-3">
        <span className="text-white font-semibold text-sm">🍅 Pomodoro</span>
        <button onClick={onClose} style={{color:'#6b7280'}} className="hover:text-white text-lg leading-none">✕</button>
      </div>
      <div className="flex justify-between items-center mb-3">
        <span className="text-xs px-2 py-1 rounded-full font-medium" style={{background:cor+'33',color:cor}}>{pomo.tipo==='estudo'?'🎯 Estudo':'☕ Pausa'}</span>
        <span className="text-xs" style={{color:'#9ca3af'}}>{pomo.rod} rodada{pomo.rod!==1?'s':''}</span>
      </div>
      <div className="flex justify-center mb-4">
        <div style={{position:'relative',width:112,height:112}}>
          <svg style={{width:'100%',height:'100%',transform:'rotate(-90deg)'}} viewBox="0 0 120 120">
            <circle cx="60" cy="60" r={r} fill="none" stroke="#374151" strokeWidth="8"/>
            <circle cx="60" cy="60" r={r} fill="none" stroke={cor} strokeWidth="8" strokeLinecap="round"
              strokeDasharray={circ} strokeDashoffset={off} style={{transition:'stroke-dashoffset .5s ease'}}/>
          </svg>
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span className="text-white font-mono font-bold text-xl">{fmtMM(pomo.seg)}</span>
          </div>
        </div>
      </div>
      <div className="flex justify-center gap-3">
        <button onClick={pomo.resetar} className="rounded-xl text-white transition-colors" style={{padding:'8px 12px',background:'#374151'}}>↺</button>
        <button onClick={pomo.at?pomo.pausar:pomo.iniciar} className="rounded-xl font-medium text-sm transition-colors flex items-center gap-1"
          style={{padding:'8px 20px',background:cor+'33',color:cor}}>
          {pomo.at?'⏸ Pausar':'▶ Iniciar'}
        </button>
      </div>
      <SoundControls />
    </div>
  );
}

// ─── CRONOGRAMA VIEW ──────────────────────────────────────────
function CronogramaView({S}){
  const{ui,dispatchUI,ed,dispatchED,concl,setConcl,diarios,cron,salvarDiario,semanaAtual,dataInicioPlano}=S;
  const sem=ui.sem;const setSem=n=>dispatchUI({t:'SEM',p:n});
  const cfg=CRONOGRAMA[sem]||{f:0};
  const fase=FASES[cfg.f]||FASES[0];
  const tempoSem=useMemo(()=>{let t=0;Object.entries(cron.tempos).forEach(([k,v])=>{if(k.startsWith(`${sem}-`))t+=v;});if(cron.ativo?.startsWith(`${sem}-`))t+=cron.segs-(cron.tempos[cron.ativo]||0);return t;},[sem,cron]);
  const metaSem=useMemo(()=>fase.materias.reduce((a,m)=>a+m.horas*3600,0),[fase]);
  const pct=metaSem>0?Math.min(100,Math.round(tempoSem/metaSem*100)):0;
  const eAtual=dataInicioPlano&&sem===semanaAtual;
  const atrasado=dataInicioPlano&&sem<semanaAtual&&pct<100;

          <div className="flex justify-between items-center mb-2">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-white font-bold">📚 Semana {sem}/28</h1>
                {eAtual&&<span className="text-xs px-2 py-0.5 rounded-full font-medium" style={{background:'rgba(96,165,250,0.2)',color:'#93c5fd'}}>📍 atual</span>}
                {atrasado&&<span className="text-xs px-2 py-0.5 rounded-full font-medium" style={{background:'rgba(239,68,68,0.2)',color:'#fca5a5'}}>⚠ atraso</span>}
              </div>
              <p style={{color:'rgba(255,255,255,0.5)',fontSize:12}}>{fase.nome} · {cfg.foco||''}</p>
            </div>
            <div className="text-right"><span className="text-white font-bold">{pct}%</span><div style={{color:'rgba(255,255,255,0.3)',fontSize:11}}>{fmt(tempoSem)} / {fmt(metaSem)}</div></div>
          </div>
          <div className="w-full rounded-full" style={{height:6,background:'rgba(255,255,255,0.1)'}}>
            <div className="rounded-full transition-all h-full bg-gradient-to-r from-blue-400 to-green-400" style={{width:`${pct}%`}}/>
          </div>
        </div>
      </div>
      <div className="max-w-3xl mx-auto p-4 space-y-4 pb-36">
        <div className="rounded-2xl p-4 border" style={{background:'rgba(255,255,255,0.07)',borderColor:'rgba(255,255,255,0.1)'}}>
          <div className="flex justify-between text-sm mb-2">
            <span style={{color:'rgba(255,255,255,0.6)'}}>Navegar semana</span>
            <span className="text-white font-bold">{sem} / 28</span>
          </div>
          <input type="range" min={1} max={28} value={sem} onChange={e=>setSem(Number(e.target.value))}/>
          <div className="flex justify-between text-xs mt-1" style={{color:'rgba(255,255,255,0.3)'}}>
            {[1,7,14,21,28].map(n=><button key={n} onClick={()=>setSem(n)} className={`hover:text-white transition-colors ${sem===n?'text-blue-400':''}`}>{n}</button>)}
          </div>
        </div>
        <InterleavingSugestao S={S}/>
        {fase.materias.map(mat=><MateriaCard key={mat.id} mat={mat} sem={sem} S={S}/>)}
        <button onClick={()=>setConcl(p=>({...p,[sem]:!p[sem]}))}
          className="w-full rounded-2xl p-4 border flex items-center gap-3 transition-all"
          style={{background:concl[sem]?'rgba(34,197,94,0.2)':'rgba(255,255,255,0.05)',borderColor:concl[sem]?'rgba(74,222,128,0.5)':'rgba(255,255,255,0.1)',color:concl[sem]?'#86efac':'rgba(255,255,255,0.4)'}}>
          <span>{concl[sem]?'✅':'○'}</span>
          <span className="font-medium">{concl[sem]?'Semana concluída!':'Marcar como concluída'}</span>
        </button>
        <div className="rounded-2xl p-4 border" style={{background:'rgba(255,255,255,0.07)',borderColor:'rgba(255,255,255,0.1)'}}>
          <div className="flex justify-between items-center mb-3">
            <span style={{color:'rgba(255,255,255,0.7)',fontWeight:500,fontSize:14}}>📓 Diário da semana</span>
            {!ed.eD&&<button onClick={()=>dispatchED({t:'OD',p:diarios[sem]||''})} style={{fontSize:12,color:'#93c5fd'}} className="hover:text-blue-200">{diarios[sem]?'Editar':'+ Escrever'}</button>}
          </div>
          {ed.eD?(
            <>
              <textarea autoFocus value={ed.dT} onChange={e=>dispatchED({t:'UD',p:e.target.value})}
                placeholder="Como foi o estudo desta semana?" rows={4}
                className="w-full rounded-xl text-white text-sm p-3 outline-none resize-none"
                style={{background:'#1f2937',border:'1px solid rgba(96,165,250,0.3)'}}/>
              <div className="flex gap-2 mt-2">
                <button onClick={()=>salvarDiario(sem,ed.dT)} className="text-sm px-4 py-1.5 rounded-xl transition-colors" style={{background:'rgba(59,130,246,0.3)',color:'#93c5fd'}}>Salvar</button>
                <button onClick={()=>dispatchED({t:'CD'})} className="text-sm px-4 py-1.5 transition-colors" style={{color:'rgba(255,255,255,0.3)'}}>Cancelar</button>
              </div>
            </>
          ):diarios[sem]?<p className="text-sm whitespace-pre-wrap" style={{color:'rgba(255,255,255,0.6)'}}>{diarios[sem]}</p>
          :<p className="text-sm italic" style={{color:'rgba(255,255,255,0.2)'}}>Nenhuma anotação para esta semana.</p>}
        </div>

function MateriaCard({mat,sem,S}){
  const{ui,dispatchUI,ed,dispatchED,topC,setTopC,topP,setTopP,topR,setTopR,resumos,setResumos,topRen,setTopRen,cron,salvarResumo}=S;
  const k=`${mat.id}-${sem}`;const exp=ui.exp[k];const toggle=()=>dispatchUI({t:'EXP',p:k});
  const md=CONTEUDOS[mat.id];const tempo=cron.getTempo(sem,mat.id);const at=cron.ativo===`${sem}-${mat.id}`;
  const meta=mat.horas*3600;const pct=meta>0?Math.min(100,Math.round(tempo/meta*100)):0;
  const progT=useMemo(()=>{if(!md)return 0;let t=0,c=0;md.categorias.forEach((cat,ci)=>{cat.topicos.forEach((_,ti)=>{t++;if(topC[`${mat.id}-${ci}-${ti}`])c++;});(topP[`${mat.id}-${ci}`]||[]).forEach((_,ti)=>{t++;if(topC[`${mat.id}-${ci}-custom-${ti}`])c++;});});return t?Math.round(c/t*100):0;},[topC,topP,mat.id]);
  return(
    <div className="rounded-2xl border transition-all duration-300" style={{background:'rgba(255,255,255,0.07)',borderColor:at?'rgba(96,165,250,0.7)':'rgba(255,255,255,0.1)',boxShadow:at?'0 0 20px rgba(96,165,250,0.2)':'none'}}>
      <div className="p-4">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-3 flex-1 min-w-0">
            <div className={`w-3 h-3 rounded-full shrink-0 ${mat.cor}`}/>
            <div className="min-w-0"><div className="text-white font-semibold text-sm truncate">{mat.nome}</div><div className="text-xs truncate" style={{color:'rgba(255,255,255,0.4)'}}>{mat.foco}</div></div>
          </div>
          <div className="flex items-center gap-2 ml-2 shrink-0">
            <span className={`font-mono text-sm ${at?'text-blue-300 pulse':'text-white text-opacity-60'}`}>{fmt(tempo)}</span>
            <button onClick={()=>cron.iniciar(sem,mat.id)} className="p-2 rounded-xl transition-all" style={{background:at?'rgba(59,130,246,0.3)':'rgba(255,255,255,0.1)',color:at?'#93c5fd':'rgba(255,255,255,0.6)'}}>{at?'⏸':'▶'}</button>
            <button onClick={e=>cron.resetar(sem,mat.id,e)} className="p-2 rounded-xl transition-all text-xs" style={{background:'rgba(255,255,255,0.05)',color:'rgba(255,255,255,0.2)'}}>↺</button>
          </div>
        </div>
        <div className="flex items-center gap-2 mb-1">
          <div className="flex-1 rounded-full" style={{height:6,background:'rgba(255,255,255,0.1)'}}>
            <div className="h-full rounded-full transition-all" style={{width:`${pct}%`,background:pct>=100?'#4ade80':at?'#60a5fa':'rgba(255,255,255,0.3)'}}/>
          </div>
          <span className="text-xs shrink-0" style={{color:'rgba(255,255,255,0.3)'}}>{pct}% · {mat.horas}h</span>
        </div>
        <div className="flex justify-between items-center">
          <span className="text-xs" style={{color:'rgba(255,255,255,0.3)'}}>{progT}% tópicos ✓</span>
          {(()=>{const p=MATERIAS_PESO[mat.id];return p&&p.questoes>0?(<span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{background:`${p.cor}22`,color:p.cor,border:`1px solid ${p.cor}44`}} title={p.dica}>{p.label} · {p.questoes}q ({p.range})</span>):null;})()}
          {md&&<button onClick={toggle} className="text-xs flex items-center gap-1 transition-colors" style={{color:'#93c5fd'}}>{exp?'▾ Ocultar':'▸ Tópicos'}</button>}
        </div>
      </div>
      {exp&&md&&(
        <div className="p-4 space-y-4" style={{borderTop:'1px solid rgba(255,255,255,0.1)'}}>
          {md.categorias.map((cat,ci)=>(
            <div key={ci}>
              <div className="uppercase tracking-wider font-medium mb-2 text-xs" style={{color:'rgba(255,255,255,0.3)'}}>{cat.titulo}</div>
              <div className="space-y-1">
                {cat.topicos.map((orig,ti)=><TopicoItem key={ti} mid={mat.id} ci={ci} ti={ti} orig={orig} custom={false} S={S}/>)}
                {(topP[`${mat.id}-${ci}`]||[]).map((orig,ti)=><TopicoItem key={`c${ti}`} mid={mat.id} ci={ci} ti={ti} orig={orig} custom={true} S={S}/>)}
                <AddT mid={mat.id} ci={ci} S={S}/>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TopicoItem({mid,ci,ti,orig,custom,S}){
  const{topC,setTopC,topR,setTopR,topP,setTopP,resumos,setResumos,topRen,setTopRen,ed,dispatchED,salvarResumo}=S;
  const k=custom?`${mid}-${ci}-custom-${ti}`:`${mid}-${ci}-${ti}`;
  const nome=topRen[k]||orig;const ok=!!topC[k],rev=!!topR[k],hr=!!resumos[k];
  const eN=ed.eN===k,eR=ed.eR===k;
  const togOk=()=>{const n=!ok;setTopC(p=>({...p,[k]:n}));if(n)setTopR(p=>{const x={...p};delete x[k];return x;});};
  const togRev=()=>{if(ok)return;setTopR(p=>({...p,[k]:!p[k]}));};
  const rem=()=>{const ch=`${mid}-${ci}`;setTopP(p=>{const l=[...(p[ch]||[])];l.splice(ti,1);return{...p,[ch]:l};});setTopC(p=>{const n={...p};delete n[k];return n;});setTopR(p=>{const n={...p};delete n[k];return n;});};
  return(
    <div id={`t-${k}`} className="rounded-xl p-2 transition-all" style={{background:ok?'rgba(34,197,94,0.1)':rev?'rgba(234,179,8,0.1)':'rgba(255,255,255,0.05)'}}>
      <div className="flex items-center gap-2">
        <button onClick={togOk} className="shrink-0 text-base">{ok?'✅':'⬜'}</button>
        {eN?(
          <input autoFocus value={ed.nT} onChange={e=>dispatchED({t:'UN',p:e.target.value})}
            onKeyDown={e=>{if(e.key==='Enter'){setTopRen(p=>({...p,[k]:ed.nT}));dispatchED({t:'FN'});}if(e.key==='Escape')dispatchED({t:'FN'});}}
            className="flex-1 text-white text-xs rounded px-2 py-0.5 outline-none"
            style={{background:'rgba(255,255,255,0.1)',border:'1px solid rgba(96,165,250,0.5)'}}/>
        ):(
          <span className="flex-1 text-xs" style={{color:ok?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.8)',textDecoration:ok?'line-through':'none'}}>
            {nome}{custom&&<span style={{color:'#a78bfa',marginLeft:4}}>*</span>}
            {hr&&<span title="Tem nota" style={{marginLeft:4}}>📝</span>}
          </span>
        )}
        <div className="flex items-center gap-1 shrink-0">
          {eN?(
            <>
              <button onClick={()=>{setTopRen(p=>({...p,[k]:ed.nT}));dispatchED({t:'FN'});}} style={{color:'#4ade80',fontSize:12}}>✓</button>
              <button onClick={()=>dispatchED({t:'FN'})} style={{color:'#f87171',fontSize:12}}>✕</button>
            </>
          ):(
            <>
              {!ok&&<button onClick={togRev} title="Marcar p/revisar" style={{fontSize:11,color:rev?'#fbbf24':'rgba(255,255,255,0.2)',cursor:'pointer'}}>⚠</button>}
              <button onClick={()=>dispatchED({t:'IN',k,v:nome})} title="Renomear" style={{fontSize:11,color:'rgba(255,255,255,0.2)',cursor:'pointer'}} className="hover:text-blue-300">✏</button>
              <button onClick={()=>dispatchED({t:'IR',k,v:resumos[k]||''})} title="Nota" style={{fontSize:11,color:hr?'#60a5fa':'rgba(255,255,255,0.2)',cursor:'pointer'}}>📝</button>
              {custom&&<button onClick={rem} title="Remover" style={{fontSize:11,color:'rgba(255,255,255,0.2)',cursor:'pointer'}} className="hover:text-red-400">🗑</button>}
            </>
          )}
        </div>
      </div>
      {eR&&(
        <div style={{marginTop:8}}>
          <textarea autoFocus value={ed.rT} onChange={e=>dispatchED({t:'UR',p:e.target.value})}
            placeholder="Anotações, palavras-chave…" rows={3}
            className="w-full text-white text-xs rounded-lg p-2 outline-none resize-none"
            style={{background:'#1f2937',border:'1px solid rgba(96,165,250,0.4)'}}/>
          <div className="flex gap-2 mt-1">
            <button onClick={()=>salvarResumo(k,ed.rT)} className="text-xs px-3 py-1 rounded-lg transition-colors" style={{background:'rgba(59,130,246,0.3)',color:'#93c5fd'}}>Salvar</button>
            <button onClick={()=>dispatchED({t:'FR'})} className="text-xs px-3 py-1 transition-colors" style={{color:'rgba(255,255,255,0.3)'}}>Cancelar</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SearchModal({S}){
  const{ui,dispatchUI,topP,resumos}=S;
  const[termo,setTermo]=useState('');
  const inputRef=useRef(null);

  // Foca o input sempre que o modal abrir
  useEffect(()=>{
    setTimeout(()=>{if(inputRef.current)inputRef.current.focus();},50);
  },[]);

  const buscar=t=>{
    setTermo(t);
    // CORREÇÃO: não fecha o modal ao digitar — apenas limpa resultados se < 2 chars
    if(t.length<2){
      dispatchUI({t:'SEARCH',p:{t:'',r:[]}});
      return;
    }
    const tl=t.toLowerCase(),res=[];
    Object.entries(CONTEUDOS).forEach(([mid,mat])=>{
      mat.categorias.forEach((cat,ci)=>{
        cat.topicos.forEach((top,ti)=>{const k=`${mid}-${ci}-${ti}`;if(top.toLowerCase().includes(tl)||resumos[k]?.toLowerCase().includes(tl))res.push({mid,mn:mat.nome,top,k,custom:false});});
        (topP[`${mid}-${ci}`]||[]).forEach((top,ti)=>{const k=`${mid}-${ci}-custom-${ti}`;if(top.toLowerCase().includes(tl))res.push({mid,mn:mat.nome,top,k,custom:true});});
      });
    });
    dispatchUI({t:'SEARCH',p:{t,r:res}});
  };
  const ir=res=>{
    dispatchUI({t:'CSEARCH'});dispatchUI({t:'V',p:'cronograma'});
    setTimeout(()=>{const el=document.getElementById(`t-${res.k}`);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid #fbbf24';setTimeout(()=>el.style.outline='',2000);}else setTimeout(()=>{const el2=document.getElementById(`t-${res.k}`);if(el2){el2.scrollIntoView({behavior:'smooth',block:'center'});}},300);},100);
  };
  const hl=(txt,t)=>{if(!t)return txt;const pts=[];let r=txt;let i=0;while(r.length>0&&i<100){const idx=r.toLowerCase().indexOf(t.toLowerCase());if(idx===-1){pts.push(<span key={i}>{r}</span>);break;}if(idx>0)pts.push(<span key={i+'a'}>{r.slice(0,idx)}</span>);pts.push(<mark key={i+'b'} style={{background:'rgba(251,191,36,0.4)',color:'#fde68a',borderRadius:3,padding:'0 2px'}}>{r.slice(idx,idx+t.length)}</mark>);r=r.slice(idx+t.length);i++;}return pts;};
  return(
    <div style={{position:'fixed',inset:0,zIndex:50,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'flex-start',justifyContent:'center',paddingTop:64,paddingLeft:16,paddingRight:16}}
      onClick={e=>{if(e.target===e.currentTarget)dispatchUI({t:'CSEARCH'});}}>
      <div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden slide-in" style={{background:'#1f2937'}}
        onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 p-4" style={{borderBottom:'1px solid #374151'}}>
          <span style={{color:'#9ca3af'}}>🔍</span>
          <input
            ref={inputRef}
            value={termo}
            onChange={e=>buscar(e.target.value)}
            onKeyDown={e=>{if(e.key==='Escape')dispatchUI({t:'CSEARCH'});}}
            placeholder="Buscar tópico… (mín. 2 caracteres)"
            className="flex-1 text-white outline-none"
            style={{background:'transparent'}}
          />
          <button onClick={()=>dispatchUI({t:'CSEARCH'})} style={{color:'#9ca3af'}} className="hover:text-white">✕</button>
        </div>
        <div style={{maxHeight:384,overflowY:'auto'}}>
          {termo.length>0&&termo.length<2&&<div className="p-4 text-sm text-center" style={{color:'#9ca3af'}}>Continue digitando…</div>}
          {termo.length>=2&&ui.resS.length===0&&<div className="p-4 text-sm text-center" style={{color:'#9ca3af'}}>Nenhum resultado para "{termo}"</div>}
          {ui.resS.map(r=>(
            <button key={r.k} onClick={()=>ir(r)} className="w-full text-left px-4 py-3 hover:bg-gray-700 transition-colors">
              <div className="text-xs mb-0.5" style={{color:'#60a5fa'}}>{r.mn}</div>
              <div className="text-sm text-white">{hl(r.top,termo)}</div>
              {r.custom&&<div className="text-xs" style={{color:'#a78bfa'}}>• personalizado</div>}
            </button>
          ))}
        </div>
        {ui.resS.length>0&&<div className="px-4 py-2 text-xs" style={{borderTop:'1px solid #374151',color:'#6b7280'}}>{ui.resS.length} resultado(s) · ESC para fechar</div>}
      </div>
    </div>
  );
}

function calcularSRS(rating, interval) {
  let nextInterval = 1;
  let nextTime = 0;
  if (rating === 'again') {
    nextInterval = 0;
    nextTime = Date.now() + 60000;
  } else if (rating === 'hard') {
    nextInterval = 1;
    nextTime = Date.now() + 86400000;
  } else if (rating === 'good') {
    nextInterval = interval === 0 ? 3 : Math.max(3, Math.round(interval * 2.0));
    nextTime = Date.now() + nextInterval * 86400000;
  } else if (rating === 'easy') {
    nextInterval = interval === 0 ? 6 : Math.max(6, Math.round(interval * 3.5));
    nextTime = Date.now() + nextInterval * 86400000;
  }
  return {
    interval: nextInterval,
    nextReview: new Date(nextTime).toISOString()
  };
}

function FlashcardsView({ S }) {
  const { flashcards, setFlashcards } = S;
  const [materiaSel, setMateriaSel] = useState('');
  const [abaInterna, setAbaInterna] = useState('decks');
  const [deckAtual, setDeckAtual] = useState(null);
  const [frente, setFrente] = useState('');
  const [verso, setVerso] = useState('');
  const [cardIndex, setCardIndex] = useState(0);
  const [mostrarVerso, setMostrarVerso] = useState(false);

  const Decks = useMemo(() => {
    const d = {};
    Object.keys(CONTEUDOS).forEach(mid => {
      d[mid] = { id: mid, nome: CONTEUDOS[mid].nome, total: 0, due: 0, cards: [] };
    });
    const now = Date.now();
    flashcards.forEach(c => {
      if (d[c.materia]) {
        d[c.materia].total++;
        d[c.materia].cards.push(c);
        const revisarData = new Date(c.revisarEm).getTime();
        if (revisarData <= now) d[c.materia].due++;
      }
    });
    return Object.values(d).filter(x => x.total > 0 || x.id !== 'revisao');
  }, [flashcards]);

  const cardsParaRevisar = useMemo(() => {
    if (!deckAtual) return [];
    const now = Date.now();
    return flashcards.filter(c => c.materia === deckAtual && new Date(c.revisarEm).getTime() <= now);
  }, [flashcards, deckAtual]);

  const iniciarRevisao = (mid) => {
    setDeckAtual(mid);
    setCardIndex(0);
    setMostrarVerso(false);
    setAbaInterna('revisar');
  };

  const criarCard = (e) => {
    e.preventDefault();
    if (!materiaSel || !frente.trim() || !verso.trim()) return;
    const novo = {
      id: `fc_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      materia: materiaSel,
      frente: frente.trim(),
      verso: verso.trim(),
      criadoEm: new Date().toISOString(),
      intervalo: 0,
      revisarEm: new Date().toISOString(),
    };
    setFlashcards(p => [...p, novo]);
    setFrente('');
    setVerso('');
    alert('Flashcard criado com sucesso!');
  };

  const responderSRS = (rating) => {
    const card = cardsParaRevisar[cardIndex];
    if (!card) return;
    const r = calcularSRS(rating, card.intervalo);
    setFlashcards(p => p.map(c => {
      if (c.id === card.id) {
        return {
          ...c,
          intervalo: r.interval,
          revisarEm: r.nextReview
        };
      }
      return c;
    }));
    if (cardIndex + 1 < cardsParaRevisar.length) {
      setCardIndex(p => p + 1);
      setMostrarVerso(false);
    } else {
      alert('Parabéns! Você concluiu a revisão deste deck.');
      setAbaInterna('decks');
      setDeckAtual(null);
    }

  const deletarCard = (id) => {
